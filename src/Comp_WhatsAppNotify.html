<!-- Shared WhatsApp notify preview (Dashboard + Members) -->
<script>
  var WhatsAppNotify = {
    currentPhone: '',
    currentType: '',
    iconSvg: '<svg viewBox="0 0 24 24" class="w-4 h-4 fill-current" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.85 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>',

    getGymName: function() {
      const titleEl = document.getElementById('sidebar-gym-title');
      const name = titleEl && titleEl.textContent ? titleEl.textContent.trim() : '';
      return name || 'LSC';
    },

    normalizePhone: function(phone) {
      let digits = String(phone || '').replace(/\D/g, '');
      if (!digits) return '';
      if (digits.length === 10) digits = '91' + digits;
      if (digits.length === 11 && digits.charAt(0) === '0') digits = '91' + digits.slice(1);
      return digits;
    },

    daysBetween: function(fromDate, toDate) {
      const a = fromDate instanceof Date ? new Date(fromDate) : new Date(fromDate);
      const b = toDate instanceof Date ? new Date(toDate) : new Date(toDate);
      if (isNaN(a) || isNaN(b)) return null;
      a.setHours(0, 0, 0, 0);
      b.setHours(0, 0, 0, 0);
      return Math.round((b - a) / 86400000);
    },

    applyTemplate: function(template, ctx) {
      return String(template || '').replace(/\{\{\s*([a-zA-Z]+)\s*\}\}/g, function(_, raw) {
        const key = String(raw || '').toLowerCase();
        if (key === 'gym' || key === 'gymname') return ctx.gym;
        if (key === 'duedate' || key === 'due') return ctx.dueDate;
        if (ctx[key] == null) return '';
        return String(ctx[key]);
      });
    },

    customTemplate: function(type) {
      const branding = (window.LSC_SESSION && window.LSC_SESSION.branding) || {};
      if (type === 'overdue') return String(branding.waOverdue || '').trim();
      if (type === 'upcoming') return String(branding.waUpcoming || '').trim();
      return '';
    },

    buildTemplate: function(type, row) {
      const gym = this.getGymName();
      const name = row.name || 'Member';
      const amount = (typeof AppUtils !== 'undefined' && AppUtils.formatCurrency)
        ? AppUtils.formatCurrency(row.amount)
        : ('₹' + String(row.amount || 0));
      const dueDate = row.date || row.paidDate || '--';
      const days = row.days;
      const plan = row.plan || 'membership';
      const period = row.period || '';
      const custom = (type === 'overdue' || type === 'upcoming') ? this.customTemplate(type) : '';
      if (custom) {
        return this.applyTemplate(custom, {
          gym: gym,
          name: name,
          amount: amount,
          dueDate: dueDate,
          days: days,
          plan: plan
        });
      }

      if (type === 'overdue') {
        return (
          'Hi ' + name + ',\n\n' +
          'This is a friendly reminder from ' + gym + '. Your ' + plan +
          ' renewal of ' + amount + ' was due on ' + dueDate +
          ' and is now overdue by ' + days + ' day(s).\n\n' +
          'Please complete the payment at your earliest convenience. Thank you!'
        );
      }

      if (type === 'paid' || type === 'receipt') {
        return (
          'Hi ' + name + ',\n\n' +
          'Thank you! ' + gym + ' has received your ' + plan +
          ' payment of ' + amount +
          (period ? (' for ' + period) : '') +
          (dueDate && dueDate !== '--' ? (' on ' + dueDate) : '') +
          '.\n\nWe appreciate your continued membership. See you at the gym!'
        );
      }

      return (
        'Hi ' + name + ',\n\n' +
        'A quick reminder from ' + gym + '. Your ' + plan +
        ' renewal of ' + amount + ' is due on ' + dueDate +
        ' (' + days + ' day(s) left).\n\n' +
        'Please arrange payment before the due date. Thank you!'
      );
    },

    typeMeta: function(type) {
      if (type === 'overdue') {
        return {
          badge: 'Overdue',
          badgeClass: 'text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-red-50 text-red-600 shrink-0',
          subtitle: 'Overdue payment reminder'
        };
      }
      if (type === 'paid' || type === 'receipt') {
        return {
          badge: 'Paid',
          badgeClass: 'text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 shrink-0',
          subtitle: 'Payment received message'
        };
      }
      return {
        badge: 'Upcoming',
        badgeClass: 'text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 shrink-0',
        subtitle: 'Upcoming renewal reminder'
      };
    },

    open: function(type, row, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      if (!row) return;

      const phoneDigits = this.normalizePhone(row.phone);
      this.currentPhone = phoneDigits;
      this.currentType = type;

      const memberEl = document.getElementById('wa-notify-member');
      const phoneEl = document.getElementById('wa-notify-phone');
      const badgeEl = document.getElementById('wa-notify-type-badge');
      const subtitleEl = document.getElementById('wa-notify-subtitle');
      const messageEl = document.getElementById('wa-notify-message');
      const openBtn = document.getElementById('wa-notify-open-btn');
      const meta = this.typeMeta(type);

      if (memberEl) memberEl.textContent = row.name || 'Member';
      if (phoneEl) {
        phoneEl.textContent = phoneDigits
          ? ('+' + phoneDigits)
          : 'No phone number on file';
        phoneEl.className = phoneDigits
          ? 'text-[11px] text-slate-500 mt-0.5'
          : 'text-[11px] text-red-500 mt-0.5';
      }
      if (badgeEl) {
        badgeEl.textContent = meta.badge;
        badgeEl.className = meta.badgeClass;
      }
      if (subtitleEl) subtitleEl.textContent = meta.subtitle;
      if (messageEl) messageEl.value = this.buildTemplate(type, row);
      if (openBtn) {
        openBtn.disabled = !phoneDigits;
        openBtn.classList.toggle('opacity-50', !phoneDigits);
        openBtn.classList.toggle('cursor-not-allowed', !phoneDigits);
      }

      const modal = document.getElementById('whatsapp-notify-modal');
      const content = document.getElementById('whatsapp-notify-content');
      if (!modal || !content) return;
      modal.classList.remove('pointer-events-none', 'opacity-0');
      modal.classList.add('opacity-100');
      content.classList.remove('translate-y-4', 'sm:scale-95', 'opacity-0');
      content.classList.add('translate-y-0', 'sm:scale-100', 'opacity-100');
    },

    close: function() {
      const modal = document.getElementById('whatsapp-notify-modal');
      const content = document.getElementById('whatsapp-notify-content');
      if (!modal || !content) return;
      modal.classList.add('opacity-0', 'pointer-events-none');
      modal.classList.remove('opacity-100');
      content.classList.add('translate-y-4', 'sm:scale-95', 'opacity-0');
      content.classList.remove('translate-y-0', 'sm:scale-100', 'opacity-100');
    },

    copyMessage: function() {
      const messageEl = document.getElementById('wa-notify-message');
      const text = messageEl ? messageEl.value : '';
      if (!text) return;
      const done = () => {
        if (typeof Toast !== 'undefined') Toast.success('Message copied');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => {
          messageEl.select();
          document.execCommand('copy');
          done();
        });
      } else {
        messageEl.select();
        document.execCommand('copy');
        done();
      }
    },

    openWhatsApp: function() {
      const messageEl = document.getElementById('wa-notify-message');
      const text = messageEl ? messageEl.value.trim() : '';
      const phone = this.currentPhone || this.normalizePhone(
        (document.getElementById('wa-notify-phone') || {}).textContent
      );
      if (!phone) {
        if (typeof Toast !== 'undefined') Toast.error('No phone number available for this member.');
        return;
      }
      const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text || '');
      window.open(url, '_blank');
    },

    /** Compact action button HTML for tables. */
    renderButton: function(hasPhone, onClickExpr) {
      const waBtnClass = hasPhone
        ? 'w-8 h-8 inline-flex items-center justify-center rounded-full bg-[#25D366]/15 text-[#128C7E] hover:bg-[#25D366] hover:text-white transition-colors'
        : 'w-8 h-8 inline-flex items-center justify-center rounded-full bg-slate-100 text-slate-300 cursor-not-allowed';
      const waTitle = hasPhone ? 'Notify on WhatsApp' : 'No phone';
      const waHandler = hasPhone
        ? onClickExpr
        : "event.stopPropagation(); if (typeof Toast !== 'undefined') Toast.error('No phone number for this member.');";
      return (
        '<button type="button" title="' + waTitle + '" aria-label="' + waTitle +
        '" onclick="' + waHandler + '" class="' + waBtnClass + '">' +
        this.iconSvg + '</button>'
      );
    }
  };
</script>

<div id="whatsapp-notify-modal" onclick="if (event.target === this) WhatsAppNotify.close()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs opacity-0 pointer-events-none transition-opacity duration-200 z-[130] flex items-end sm:items-center justify-center p-0 sm:p-4 lsc-modal-sheet">
  <div id="whatsapp-notify-content" class="bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl shadow-2xl transform translate-y-4 sm:translate-y-0 sm:scale-95 opacity-0 transition-all duration-200 flex flex-col border border-slate-200 overflow-hidden mb-0 lsc-modal-sheet-panel">
    <div class="flex items-center justify-between px-4 md:px-5 py-3.5 border-b border-slate-100 bg-slate-50/50 shrink-0">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-[#25D366]/15 text-[#128C7E] flex items-center justify-center shrink-0 border border-[#25D366]/30">
          <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.85 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        </div>
        <div class="min-w-0">
          <h2 class="text-sm md:text-base font-bold text-slate-800 truncate">WhatsApp Notify</h2>
          <p id="wa-notify-subtitle" class="text-[11px] text-slate-500 truncate">Preview and send reminder</p>
        </div>
      </div>
      <button type="button" onclick="WhatsAppNotify.close()" class="w-9 h-9 flex items-center justify-center text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-full transition-colors cursor-pointer shrink-0">
        <span class="material-symbols-rounded text-lg">close</span>
      </button>
    </div>

    <div class="p-4 md:p-5 space-y-3 overflow-y-auto no-scrollbar flex-1">
      <div class="flex items-center justify-between gap-3 p-3 bg-slate-50 border border-slate-200 rounded-xl">
        <div class="min-w-0">
          <div id="wa-notify-member" class="text-xs md:text-sm font-bold text-slate-800 truncate">--</div>
          <div id="wa-notify-phone" class="text-[11px] text-slate-500 mt-0.5">--</div>
        </div>
        <span id="wa-notify-type-badge" class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 shrink-0">--</span>
      </div>
      <div>
        <label for="wa-notify-message" class="block text-xs font-semibold text-slate-700 mb-1.5">Message</label>
        <textarea id="wa-notify-message" rows="8" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-xs md:text-sm text-slate-800 focus:border-[#25D366] focus:ring-2 focus:ring-[#25D366]/20 outline-none resize-y min-h-[140px]"></textarea>
        <p class="text-[10px] text-slate-400 mt-1">Edit freely, then copy or open WhatsApp with this text prefilled.</p>
      </div>
    </div>

    <div class="p-4 bg-slate-50 border-t border-slate-100 flex flex-row gap-2 shrink-0">
      <button type="button" onclick="WhatsAppNotify.copyMessage()" class="flex-1 sm:flex-none px-4 py-2.5 bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold text-xs rounded-xl transition-colors cursor-pointer flex items-center justify-center gap-1.5">
        <span class="material-symbols-rounded text-[16px]">content_copy</span>
        <span>Copy</span>
      </button>
      <button type="button" onclick="WhatsAppNotify.openWhatsApp()" id="wa-notify-open-btn" class="flex-[1.4] sm:flex-1 px-4 py-2.5 bg-[#25D366] hover:bg-[#1da851] text-white font-bold text-xs rounded-xl transition-colors cursor-pointer flex items-center justify-center gap-1.5 shadow-sm">
        <svg viewBox="0 0 24 24" class="w-4 h-4 fill-current shrink-0" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.85 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        <span>Open WhatsApp</span>
      </button>
    </div>
  </div>
</div>
