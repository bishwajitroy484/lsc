<script>
  var SettingsApp = {
    schemas: [],
    allDropdowns: {}, 
    sheetStructure: {}, 
    generalSettingsData: [], // Stores SETTINGS sheet data
    
    activeTab: 'general',
    activeSchema: null,
    activeOptionsList: [],
    hasUnsavedOrder: false,
    optionToDelete: null,
    isEditingSchema: false, 
    
    logoBase64: null,
    logoFileName: null,

    // Core known settings mapped directly to UI Inputs
    coreKeys: [
      'GYM_NAME', 'OWNER_NAME', 'OWNER_EMAIL', 'LOGO_ID',
      'Revenue_Recognition', 'CURRENCY_FORMAT',
      'SPREADSHEET_ID', 'DRIVE_ID', 'ENABLE_NOTIFICATION',
      'NOTIFY_PAYMENT_RECEIPT', 'NOTIFY_WEEKLY_REPORT', 'NOTIFY_REPORT_DAY', 'NOTIFY_REPORT_HOUR',
      'NOTIFY_REPORT_DAYS', 'NOTIFY_WEEKLY_CC', 'NOTIFY_WEEKLY_FIELDS',
      'NOTIFY_RECEIPT_SUBJECT', 'NOTIFY_RECEIPT_BODY',
      'NOTIFY_WEEKLY_SUBJECT', 'NOTIFY_WEEKLY_INTRO',
      'NOTIFY_WA_OVERDUE', 'NOTIFY_WA_UPCOMING',
      'ENABLE_CALENDAR_DUE_EVENTS', 'CALENDAR_DUE_HOUR', 'CALENDAR_DUE_DURATION_MIN'
    ],
    checkboxKeys: [
      'ENABLE_NOTIFICATION', 'NOTIFY_PAYMENT_RECEIPT', 'NOTIFY_WEEKLY_REPORT',
      'ENABLE_CALENDAR_DUE_EVENTS'
    ],
    editingMessageType: null,

    defaultTemplates: {
      receipt: {
        subject: '{{gymName}} — Payment confirmation',
        body:
          'Hi {{memberName}},\n\n' +
          'Thank you for your payment at {{gymName}}. Your membership has been updated successfully.\n\n' +
          'Plan: {{plan}}\n' +
          'Amount paid: {{amount}}\n' +
          'Payment date: {{paidDate}}\n' +
          'Coverage period: {{startDate}} to {{endDate}}\n' +
          'Member ID: {{memberId}}\n\n' +
          'If you have any questions, please reply to this email or contact the front desk.\n\n' +
          'Warm regards,\n' +
          '{{gymName}} Team'
      },
      weekly: {
        subject: '{{gymName}} — Weekly renewal report ({{rangeLabel}})',
        body:
          'Hi {{ownerName}},\n\n' +
          'Here is your weekly renewal snapshot for {{gymName}} covering {{rangeLabel}}.\n\n' +
          '• Upcoming renewals (next {{reportDays}} days): {{upcomingCount}}\n' +
          '• Already overdue: {{overdueCount}}\n\n' +
          'Member details are listed in the tables below so you can follow up promptly.'
      },
      waOverdue: {
        subject: '',
        body:
          'Hi {{name}},\n\n' +
          'This is a friendly reminder from {{gymName}}. Your {{plan}} renewal of {{amount}} was due on {{dueDate}} and is now overdue by {{days}} day(s).\n\n' +
          'Please complete the payment at your earliest convenience. Thank you!'
      },
      waUpcoming: {
        subject: '',
        body:
          'Hi {{name}},\n\n' +
          'A quick reminder from {{gymName}}. Your {{plan}} renewal of {{amount}} is due on {{dueDate}} ({{days}} day(s) left).\n\n' +
          'Please arrange payment before the due date. Thank you!'
      }
    },

    safeSetText: AppUtils.safeSetText,
    safeSetValue: AppUtils.safeSetValue,

    showToast: function(msg, isError = false) {
      if (typeof Toast !== 'undefined') {
        if (isError) Toast.error(msg);
        else Toast.success(msg);
      } else {
        alert(msg);
      }
    },

    usersCache: [],
    permissionPresets: null,
    accessModules: ['dashboard', 'members', 'staff', 'expenses', 'calendar', 'settings'],
    // UI shows Expenses hub once (Staff+Expenses merged); stored keys still include both.
    uiAccessModules: ['dashboard', 'members', 'expenses', 'calendar', 'settings'],
    moduleLabels: {
      dashboard: 'Dashboard',
      members: 'Members',
      expenses: 'Expenses & Staff',
      calendar: 'Calendar',
      settings: 'Settings'
    },

    inviteModalUser: null,

    init: function() {
      this.fetchData();
      this.fetchGeneralSettings();
      this.initSectionDefaults();
      this.refreshSetupStatus();
      this.refreshDeployStatus();
      this.applySettingsAccessGates();
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.success) this.permissionPresets = res.data || null;
        })
        .api_getPermissionPresets();
    },

    applySettingsAccessGates: function() {
      const canEdit = typeof AccessControl !== 'undefined' && AccessControl.can('settings', 'edit');
      const canViewUsers = typeof AccessControl !== 'undefined' && (AccessControl.can('settings', 'view') || AccessControl.can('settings', 'edit'));
      const isOwner = typeof AccessControl !== 'undefined' && AccessControl.session && AccessControl.session.isOwner;
      const usersTab = document.getElementById('tab-btn-users');
      if (usersTab && !canViewUsers) usersTab.classList.add('hidden');
      const addBtn = document.getElementById('btn-add-user');
      if (addBtn) addBtn.classList.toggle('hidden', !canEdit);
      const publishBtn = document.getElementById('btn-publish-webapp');
      if (publishBtn) publishBtn.classList.toggle('hidden', !isOwner);
      const saveDeployBtn = document.getElementById('btn-save-deployment-id');
      if (saveDeployBtn) saveDeployBtn.classList.toggle('hidden', !isOwner);
      const deployInput = document.getElementById('deploy-deployment-id');
      if (deployInput) deployInput.readOnly = !isOwner;
      const resetSection = document.getElementById('factory-reset-section');
      if (resetSection) resetSection.classList.toggle('hidden', !isOwner);
    },

    openFactoryResetModal: function() {
      const backdrop = document.getElementById('factory-reset-modal');
      const content = document.getElementById('factory-reset-modal-content');
      const confirmBtn = document.getElementById('btn-factory-reset-confirm');
      if (confirmBtn) {
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Delete';
      }
      if (backdrop) backdrop.classList.remove('opacity-0', 'pointer-events-none');
      if (content) content.classList.remove('scale-95', 'opacity-0');
    },

    closeFactoryResetModal: function() {
      const backdrop = document.getElementById('factory-reset-modal');
      const content = document.getElementById('factory-reset-modal-content');
      if (backdrop) backdrop.classList.add('opacity-0', 'pointer-events-none');
      if (content) content.classList.add('scale-95', 'opacity-0');
    },

    confirmFactoryReset: function() {
      const confirmBtn = document.getElementById('btn-factory-reset-confirm');
      if (confirmBtn) {
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Deleting...';
      }
      google.script.run
        .withSuccessHandler((res) => {
          if (confirmBtn) {
            confirmBtn.disabled = false;
            confirmBtn.textContent = 'Delete';
          }
          if (res && res.success) {
            this.closeFactoryResetModal();
            this.showToast(res.message || 'Application data cleared.', false);
          } else {
            this.showToast((res && res.error) || 'Could not reset application data.', true);
          }
        })
        .withFailureHandler((err) => {
          if (confirmBtn) {
            confirmBtn.disabled = false;
            confirmBtn.textContent = 'Delete';
          }
          this.showToast((err && err.message) || 'Could not reset application data.', true);
        })
        .api_factoryResetApplicationData();
    },

    refreshSetupStatus: function() {
      const list = document.getElementById('setup-status-list');
      if (list) {
        let shm = '';
        for (let i = 0; i < 9; i++) {
          shm += '<div class="h-7 md:h-8 bg-slate-100 shimmer rounded-md md:rounded-lg"></div>';
        }
        list.innerHTML = shm;
      }
      google.script.run
        .withSuccessHandler((res) => {
          if (!res || !res.success || !res.data) return;
          this.renderSetupStatus(res.data);
          if (typeof AccessControl !== 'undefined' && AccessControl.session) {
            AccessControl.session.setup = res.data;
            AccessControl.updateSetupBanner();
          }
        })
        .withFailureHandler(() => {
          if (list) {
            list.innerHTML = '<div class="col-span-3 text-[10px] text-slate-400 py-1">Could not load setup status.</div>';
          }
        })
        .api_getSetupStatus();
    },

    refreshDeployStatus: function() {
      const chips = document.getElementById('deploy-status-chips');
      if (chips) {
        chips.innerHTML =
          '<div class="h-7 md:h-8 bg-slate-100 shimmer rounded-md md:rounded-lg"></div>' +
          '<div class="h-7 md:h-8 bg-slate-100 shimmer rounded-md md:rounded-lg"></div>';
      }
      google.script.run
        .withSuccessHandler((res) => {
          if (!res || !res.success || !res.data) {
            if (chips) {
              chips.innerHTML = '<div class="col-span-2 text-[10px] text-slate-400 py-1">Could not load deploy status.</div>';
            }
            return;
          }
          this.renderDeployStatus(res.data);
        })
        .withFailureHandler(() => {
          if (chips) {
            chips.innerHTML = '<div class="col-span-2 text-[10px] text-slate-400 py-1">Could not load deploy status.</div>';
          }
        })
        .api_getWebAppDeployStatus();
    },

    renderDeployStatus: function(data) {
      const chips = document.getElementById('deploy-status-chips');
      const badge = document.getElementById('deploy-env-badge');
      const hint = document.getElementById('deploy-hint');
      const meta = document.getElementById('deploy-last-meta');
      const input = document.getElementById('deploy-deployment-id');
      const publishBtn = document.getElementById('btn-publish-webapp');
      if (!data) return;

      if (badge) {
        badge.textContent = data.env || '—';
        badge.className = 'text-[10px] font-semibold tracking-wider px-2 py-0.5 rounded ' +
          (String(data.envKey || '').toLowerCase() === 'prod'
            ? 'text-emerald-800 bg-emerald-50 border border-emerald-100'
            : 'text-slate-600 bg-slate-100');
      }

      if (input && !input.matches(':focus')) {
        input.value = data.deploymentId || '';
      }

      if (chips) {
        const versionLabel = data.currentVersion != null ? ('v' + data.currentVersion) : 'Unknown';
        const apiOk = !!data.apiReady;
        const idOk = !!data.deploymentId;
        const rows = [
          ['Live version', versionLabel, apiOk],
          ['Deployment ID', idOk ? 'Ready' : 'Missing', idOk]
        ];
        chips.innerHTML = rows.map(function(pair) {
          const ok = !!pair[2];
          return '<div class="flex items-center justify-between gap-1 px-2 py-1 md:px-2.5 md:py-1.5 rounded-md md:rounded-lg border ' +
            (ok ? 'bg-emerald-50/70 border-emerald-100 text-emerald-800' : 'bg-amber-50/50 border-amber-200 text-amber-800') +
            '"><span class="font-semibold truncate">' + pair[0] + '</span>' +
            '<span class="font-bold shrink-0">' + pair[1] + '</span></div>';
        }).join('');
      }

      if (hint) {
        hint.textContent = data.hint ||
          'After a developer pushes code, click Publish latest code to update this same URL.';
      }

      if (meta) {
        const parts = [];
        if (data.lastPublishedVersion) parts.push('Last published: v' + data.lastPublishedVersion);
        if (data.lastPublishedAt) {
          try {
            const d = new Date(data.lastPublishedAt);
            parts.push(isNaN(d.getTime()) ? data.lastPublishedAt : d.toLocaleString());
          } catch (e) {
            parts.push(data.lastPublishedAt);
          }
        }
        if (data.lastPublishedBy) parts.push('by ' + data.lastPublishedBy);
        if (parts.length) {
          meta.textContent = parts.join(' · ');
          meta.classList.remove('hidden');
        } else {
          meta.textContent = '';
          meta.classList.add('hidden');
        }
      }

      if (publishBtn) {
        const isOwner = typeof AccessControl !== 'undefined' && AccessControl.session && AccessControl.session.isOwner;
        publishBtn.disabled = !isOwner || !data.canPublish;
      }
    },

    copyDeploymentId: function() {
      const input = document.getElementById('deploy-deployment-id');
      const value = input ? String(input.value || '').trim() : '';
      if (!value) {
        this.showToast('No deployment ID to copy.', true);
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(() => {
          this.showToast('Deployment ID copied.', false);
        }).catch(() => {
          this.showToast('Could not copy deployment ID.', true);
        });
      } else {
        try {
          input.select();
          document.execCommand('copy');
          this.showToast('Deployment ID copied.', false);
        } catch (e) {
          this.showToast('Could not copy deployment ID.', true);
        }
      }
    },

    saveDeploymentId: function() {
      const input = document.getElementById('deploy-deployment-id');
      const btn = document.getElementById('btn-save-deployment-id');
      const id = input ? String(input.value || '').trim() : '';
      const restore = btn ? btn.innerHTML : '';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-rounded animate-spin text-[16px]">progress_activity</span>';
      }
      google.script.run
        .withSuccessHandler((res) => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = restore || '<span class="material-symbols-rounded text-[16px]">save</span><span class="hidden sm:inline">Save ID</span>';
          }
          if (!res || !res.success) {
            this.showToast((res && res.error) || 'Could not save deployment ID.', true);
            return;
          }
          this.showToast(res.message || 'Deployment ID saved.', false);
          if (res.data) this.renderDeployStatus(res.data);
          else this.refreshDeployStatus();
        })
        .withFailureHandler((err) => {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = restore || '<span class="material-symbols-rounded text-[16px]">save</span><span class="hidden sm:inline">Save ID</span>';
          }
          this.showToast((err && err.message) || 'Could not save deployment ID.', true);
        })
        .api_saveWebAppDeploymentId(id);
    },

    publishWebAppVersion: function() {
      this.openPublishModal();
    },

    openPublishModal: function() {
      const modal = document.getElementById('publish-webapp-modal');
      const content = document.getElementById('publish-webapp-modal-content');
      const meta = document.getElementById('publish-modal-meta');
      const confirmBtn = document.getElementById('btn-publish-modal-confirm');
      if (!modal || !content) return;

      const envBadge = document.getElementById('deploy-env-badge');
      const envLabel = envBadge ? String(envBadge.textContent || '').trim() : '';
      const versionChip = document.querySelector('#deploy-status-chips .font-bold');
      const versionHint = versionChip ? String(versionChip.textContent || '').trim() : '';
      if (meta) {
        const bits = [];
        if (envLabel && envLabel !== '—') bits.push('Environment: ' + envLabel);
        if (versionHint && versionHint !== 'Unknown' && versionHint !== 'Ready' && versionHint !== 'Missing') {
          bits.push('Current live: ' + versionHint);
        }
        meta.textContent = bits.length
          ? bits.join(' · ')
          : 'A new version number will be created and attached to the same deployment.';
      }
      if (confirmBtn) {
        confirmBtn.disabled = false;
        confirmBtn.innerHTML = '<span class="material-symbols-rounded text-[18px]">publish</span><span>Publish now</span>';
      }
      modal.classList.remove('pointer-events-none', 'opacity-0');
      modal.classList.add('opacity-100');
      content.classList.remove('opacity-0', 'translate-y-4', 'sm:scale-95');
      content.classList.add('opacity-100', 'translate-y-0', 'sm:scale-100');
    },

    closePublishModal: function() {
      const modal = document.getElementById('publish-webapp-modal');
      const content = document.getElementById('publish-webapp-modal-content');
      if (!modal || !content) return;
      modal.classList.add('opacity-0', 'pointer-events-none');
      modal.classList.remove('opacity-100');
      content.classList.add('opacity-0', 'translate-y-4', 'sm:scale-95');
      content.classList.remove('opacity-100', 'translate-y-0', 'sm:scale-100');
    },

    confirmPublishWebAppVersion: function() {
      const btn = document.getElementById('btn-publish-webapp');
      const confirmBtn = document.getElementById('btn-publish-modal-confirm');
      const cancelBtn = document.getElementById('btn-publish-modal-cancel');
      const publishHtml = '<span class="material-symbols-rounded text-[15px] md:text-[16px]">publish</span><span class="sm:hidden">Publish</span><span class="hidden sm:inline">Publish latest code</span>';
      const confirmHtml = '<span class="material-symbols-rounded text-[18px]">publish</span><span>Publish now</span>';

      if (confirmBtn) {
        confirmBtn.disabled = true;
        confirmBtn.innerHTML = '<span class="material-symbols-rounded animate-spin text-[18px]">progress_activity</span><span>Publishing…</span>';
      }
      if (cancelBtn) cancelBtn.disabled = true;
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-rounded animate-spin text-[15px]">progress_activity</span><span>Publishing…</span>';
      }

      google.script.run
        .withSuccessHandler((res) => {
          if (confirmBtn) {
            confirmBtn.disabled = false;
            confirmBtn.innerHTML = confirmHtml;
          }
          if (cancelBtn) cancelBtn.disabled = false;
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = publishHtml;
          }
          if (!res || !res.success) {
            if (res && res.authorizationUrl) {
              this.openAuthorizationUrl(res.authorizationUrl);
              this.showToast('Complete Google consent, then publish again.', true);
            } else {
              this.showToast((res && res.error) || 'Publish failed.', true);
            }
            if (res && res.data) this.renderDeployStatus(res.data);
            else this.refreshDeployStatus();
            this.refreshSetupStatus();
            return;
          }
          this.closePublishModal();
          this.showToast(res.message || 'Published successfully.', false);
          if (res.data) this.renderDeployStatus(res.data);
          else this.refreshDeployStatus();
          this.refreshSetupStatus();
        })
        .withFailureHandler((err) => {
          if (confirmBtn) {
            confirmBtn.disabled = false;
            confirmBtn.innerHTML = confirmHtml;
          }
          if (cancelBtn) cancelBtn.disabled = false;
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = publishHtml;
          }
          this.showToast((err && err.message) || 'Publish failed.', true);
          this.refreshDeployStatus();
          this.refreshSetupStatus();
        })
        .api_publishWebAppVersion('');
    },

    renderSetupStatus: function(setup) {
      const list = document.getElementById('setup-status-list');
      if (!list || !setup) return;
      const rows = [
        ['Sheet', setup.spreadsheetOk ? 'ok' : 'missing'],
        ['Settings', setup.settingsOk ? 'ok' : 'missing'],
        ['Drive', setup.driveOk ? 'ok' : 'missing'],
        ['Mail', setup.mailOk ? 'ok' : 'missing'],
        ['ScriptApp', setup.scriptAppOk ? 'ok' : 'missing'],
        ['Calendar', setup.calendarOk ? 'ok' : 'missing'],
        ['Publish API', setup.deployApiOk ? 'ok' : 'missing'],
        ['Trigger', setup.triggerState || (setup.triggerOk ? 'ok' : 'missing')],
        ['Setup done', setup.setupComplete ? 'ok' : 'missing']
      ];
      list.innerHTML = rows.map(function(pair) {
        const state = pair[1];
        const tone = state === 'ok'
          ? 'bg-emerald-50/70 border-emerald-100 text-emerald-800'
          : state === 'off'
            ? 'bg-slate-50 border-slate-200 text-slate-500'
            : 'bg-amber-50/50 border-amber-200 text-amber-800';
        const icon = state === 'ok' ? 'check_circle' : state === 'off' ? 'schedule' : 'error';
        const title = state === 'ok' ? 'OK' : state === 'off' ? 'Not scheduled' : 'Needed';
        return '<div class="flex items-center justify-between gap-0.5 px-1.5 py-1 md:px-2 md:py-1.5 rounded-md md:rounded-lg border min-w-0 ' +
          tone +
          '"><span class="font-semibold truncate text-[9px] md:text-[11px]">' + pair[0] + '</span>' +
          '<span class="material-symbols-rounded text-[13px] md:text-[14px] shrink-0" title="' + title + '">' +
          icon + '</span></div>';
      }).join('');
      const hint = document.getElementById('setup-auth-hint');
      if (hint) {
        if (setup.authError) {
          hint.textContent = setup.authError;
        } else if (!setup.calendarOk) {
          hint.textContent = 'Google Calendar permission is missing. Click Authorize — if prompted, allow Calendar, then click Authorize again.';
        } else if (!setup.deployApiOk) {
          hint.textContent = 'Publish API is not ready. Click Authorize (allow script projects/deployments). If it still fails, enable Apps Script API on the script’s Cloud project, then Authorize again.';
        } else if (setup.triggerState === 'missing') {
          hint.textContent = 'Weekly report is on, but the trigger is not created yet. Click Authorize again, or save the notification settings.';
        } else if (setup.triggerState === 'off') {
          hint.textContent = 'Weekly report is off, so the trigger stays unscheduled. Turn the weekly report on if you want that email.';
        } else {
          hint.textContent = 'Sign in as the deployer Google account, then authorize once (Mail, ScriptApp, Calendar, and Publish API).';
        }
      }
    },

    openAuthorizationUrl: function(url) {
      const href = String(url || '').trim();
      if (!href) return false;
      try {
        window.open(href, '_blank', 'noopener');
        return true;
      } catch (e) {
        return false;
      }
    },

    authorizeServices: function() {
      const btn = document.getElementById('btn-authorize-services');
      const authBtnHtml = '<span class="material-symbols-rounded text-[15px] md:text-[16px]">key</span><span class="sm:hidden">Authorize</span><span class="hidden sm:inline">Authorize Google services</span>';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-rounded animate-spin text-[15px]">progress_activity</span><span>…</span>';
      }
      const releaseAuthButton = function() {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = authBtnHtml;
        }
      };
      const onStall = function() {
        releaseAuthButton();
        document.removeEventListener('lsc-action-stalled', onStall);
      };
      document.addEventListener('lsc-action-stalled', onStall);
      google.script.run
        .withSuccessHandler((res) => {
          document.removeEventListener('lsc-action-stalled', onStall);
          releaseAuthButton();
          if (!res || !res.success) {
            if (res && res.authorizationUrl) {
              this.openAuthorizationUrl(res.authorizationUrl);
              this.showToast('Complete the Google consent screen (allow Calendar and Publish scopes), then click Authorize again.', true);
            } else {
              this.showToast((res && res.error) || 'Authorization failed.', true);
            }
            if (res && res.data) this.renderSetupStatus(res.data);
            return;
          }
          this.showToast(res.message || 'Services authorized.', false);
          if (res.data) this.renderSetupStatus(res.data);
          this.refreshSetupStatus();
          this.refreshDeployStatus();
        })
        .withFailureHandler((err) => {
          document.removeEventListener('lsc-action-stalled', onStall);
          releaseAuthButton();
          const msg = err && err.message ? err.message : 'Authorization failed.';
          this.showToast(msg, true);
        })
        .api_authorizeServices();
    },

    markSetupComplete: function() {
      google.script.run
        .withSuccessHandler((res) => {
          if (!res || !res.success) {
            this.showToast((res && res.error) || 'Could not mark setup complete.', true);
            return;
          }
          this.showToast(res.message || 'Setup complete.', false);
          if (res.data) this.renderSetupStatus(res.data);
          this.refreshSetupStatus();
        })
        .api_markSetupComplete();
    },

    loadUsers: function() {
      const shimmer = document.getElementById('users-shimmer');
      const content = document.getElementById('users-content');
      if (shimmer) shimmer.classList.remove('hidden');
      if (content) content.classList.add('hidden');
      google.script.run
        .withSuccessHandler((res) => {
          if (!res || !res.success) {
            if (shimmer) shimmer.classList.add('hidden');
            if (content) content.classList.remove('hidden');
            this.showToast((res && res.error) || 'Could not load users.', true);
            return;
          }
          this.usersCache = res.data || [];
          this.renderUsersList();
        })
        .withFailureHandler(() => {
          if (shimmer) shimmer.classList.add('hidden');
          if (content) content.classList.remove('hidden');
          this.showToast('Could not load users.', true);
        })
        .api_listUsers();
    },

    renderUsersList: function() {
      const list = document.getElementById('users-list');
      const empty = document.getElementById('users-empty');
      const shimmer = document.getElementById('users-shimmer');
      const content = document.getElementById('users-content');
      if (shimmer) shimmer.classList.add('hidden');
      if (content) content.classList.remove('hidden');
      if (!list) return;
      const canEdit = typeof AccessControl !== 'undefined' && AccessControl.can('settings', 'edit');
      if (!this.usersCache.length) {
        list.innerHTML = '';
        if (empty) empty.classList.remove('hidden');
        return;
      }
      if (empty) empty.classList.add('hidden');
      list.innerHTML = this.usersCache.map((u) => {
        const perms = u.permissions || {};
        const viewMods = this.formatViewModules_(perms);
        const uid = String(u.userId || '').replace(/'/g, '');
        const isDisabled = String(u.status || '').toLowerCase() === 'disabled';
        const actions = canEdit
          ? ('<div class="flex gap-1 shrink-0">' +
             (isDisabled ? '' :
               '<button type="button" title="Email access link" onclick="SettingsApp.sendInvitation(\'' + uid + '\')" class="w-8 h-8 rounded-lg border border-slate-200 text-slate-500 hover:text-brand-primary cursor-pointer"><span class="material-symbols-rounded text-[16px]">forward_to_inbox</span></button>' +
               '<button type="button" title="Link and QR code" onclick="SettingsApp.openInviteModal(\'' + uid + '\')" class="w-8 h-8 rounded-lg border border-slate-200 text-slate-500 hover:text-brand-primary cursor-pointer"><span class="material-symbols-rounded text-[16px]">qr_code_2</span></button>') +
             '<button type="button" onclick="SettingsApp.openUserEditor(\'' + uid + '\')" class="w-8 h-8 rounded-lg border border-slate-200 text-slate-500 hover:text-brand-primary cursor-pointer"><span class="material-symbols-rounded text-[16px]">edit</span></button>' +
             (u.isOwner ? '' : '<button type="button" onclick="SettingsApp.deleteUser(\'' + uid + '\')" class="w-8 h-8 rounded-lg border border-slate-200 text-slate-500 hover:text-red-500 cursor-pointer"><span class="material-symbols-rounded text-[16px]">delete</span></button>') +
             '</div>')
          : '';
        return '<div class="p-3 border border-slate-200 rounded-xl flex items-start justify-between gap-2">' +
          '<div class="min-w-0">' +
          '<div class="text-xs font-bold text-slate-800">' + (u.name || '—') + (u.isOwner ? ' <span class="text-[10px] text-amber-700 bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded-full">Owner</span>' : '') + '</div>' +
          '<div class="text-[11px] text-slate-500 truncate">' + (u.email || '') + '</div>' +
          '<div class="text-[10px] text-slate-400 mt-1">' + (u.status || '') + ' · ' + (u.rolePreset || 'Viewer') + ' · Views: ' + viewMods + '</div>' +
          '</div>' + actions + '</div>';
      }).join('');
    },

    formatViewModules_: function(perms) {
      const labels = [];
      const hub = this.mergeExpenseStaffPerm_(perms);
      this.uiAccessModules.forEach((mod) => {
        const row = mod === 'expenses' ? hub : ((perms && perms[mod]) || {});
        if (row && row.view) labels.push(this.moduleLabels[mod] || mod);
      });
      return labels.length ? labels.join(', ') : 'none';
    },

    mergeExpenseStaffPerm_: function(perms) {
      const e = (perms && perms.expenses) || {};
      const s = (perms && perms.staff) || {};
      return {
        view: !!(e.view || s.view),
        create: !!(e.create || s.create),
        edit: !!(e.edit || s.edit),
        delete: !!(e.delete || s.delete)
      };
    },

    sendInvitation: function(userId) {
      const user = this.usersCache.find(u => String(u.userId) === String(userId));
      if (!user) return;
      if (!confirm('Email ' + (user.email || 'this user') + ' their access link?')) return;
      google.script.run
        .withSuccessHandler((res) => {
          if (!res || !res.success) {
            this.showToast((res && res.error) || 'Could not send the email.', true);
            return;
          }
          this.showToast(res.message || 'Invitation sent.', false);
        })
        .withFailureHandler(() => this.showToast('Could not send the email.', true))
        .api_sendInvitation(userId);
    },

    renderInviteQr: function(url) {
      const box = document.getElementById('invite-qr');
      const fallback = document.getElementById('invite-qr-fallback');
      if (!box) return;
      box.innerHTML = '';
      if (fallback) fallback.classList.add('hidden');
      try {
        if (typeof qrcode !== 'function') throw new Error('QR library unavailable');
        const qr = qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        box.innerHTML = qr.createImgTag(6, 10);
      } catch (e) {
        if (fallback) fallback.classList.remove('hidden');
      }
    },

    showInviteLink: function(user, url) {
      this.inviteModalUser = { userId: user.userId, email: user.email, url: url };
      document.getElementById('invite-modal-who').textContent = (user.name ? user.name + ' · ' : '') + (user.email || '');
      document.getElementById('invite-modal-url').value = url;
      this.renderInviteQr(url);
      this.openModalById('user-invite-modal', 'user-invite-modal-content');
    },

    openInviteModal: function(userId) {
      const user = this.usersCache.find(u => String(u.userId) === String(userId));
      if (!user) return;
      if (user.inviteUrl) {
        this.showInviteLink(user, user.inviteUrl);
        return;
      }
      google.script.run
        .withSuccessHandler((res) => {
          if (!res || !res.success || !res.data || !res.data.url) {
            this.showToast((res && res.error) || 'Could not create the link.', true);
            return;
          }
          user.inviteUrl = res.data.url;
          this.showInviteLink(user, res.data.url);
        })
        .api_getUserInviteLink(userId, false);
    },

    closeInviteModal: function() {
      this.closeModalById('user-invite-modal', 'user-invite-modal-content');
    },

    copyInviteModalUrl: function() {
      const url = this.inviteModalUser && this.inviteModalUser.url;
      if (!url) return;
      const done = () => this.showToast('Link copied.', false);
      const fallback = () => {
        const input = document.getElementById('invite-modal-url');
        if (input) { input.focus(); input.select(); document.execCommand('copy'); }
        done();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done).catch(fallback);
      } else {
        fallback();
      }
    },

    shareInviteModalUrl: function() {
      const url = this.inviteModalUser && this.inviteModalUser.url;
      if (!url) return;
      if (navigator.share) {
        navigator.share({ title: 'LSC', text: 'You have been given access to LSC. Open your personal link:', url: url })
          .catch(function() { /* cancelled */ });
        return;
      }
      this.copyInviteModalUrl();
    },

    resetInviteLink: function() {
      const current = this.inviteModalUser;
      if (!current) return;
      if (!confirm('Create a new link? The current link will stop working for this user.')) return;
      google.script.run
        .withSuccessHandler((res) => {
          if (!res || !res.success || !res.data || !res.data.url) {
            this.showToast((res && res.error) || 'Could not create a new link.', true);
            return;
          }
          const user = this.usersCache.find(u => String(u.userId) === String(current.userId));
          if (user) user.inviteUrl = res.data.url;
          this.showInviteLink(user || { userId: current.userId, email: current.email }, res.data.url);
          this.showToast(res.message || 'New link created.', false);
        })
        .api_getUserInviteLink(current.userId, true);
    },

    openUserEditor: function(userId) {
      const existing = userId ? this.usersCache.find(u => String(u.userId) === String(userId)) : null;
      document.getElementById('user-editor-title').textContent = existing ? 'Edit user' : 'Add user';
      document.getElementById('user-edit-id').value = existing ? existing.userId : '';
      document.getElementById('user-edit-name').value = existing ? (existing.name || '') : '';
      document.getElementById('user-edit-email').value = existing ? (existing.email || '') : '';
      document.getElementById('user-edit-email').disabled = !!existing;
      document.getElementById('user-edit-status').value = existing ? (existing.status || 'Invited') : 'Invited';
      document.getElementById('user-edit-preset').value = existing ? (existing.rolePreset || 'Viewer') : 'Viewer';
      document.getElementById('user-edit-owner').checked = !!(existing && existing.isOwner);
      document.getElementById('user-edit-send').checked = !existing;
      this.renderPermMatrix(existing ? existing.permissions : null, document.getElementById('user-edit-preset').value);
      this.openModalById('user-editor-modal', 'user-editor-modal-content');
    },

    closeUserEditor: function() {
      this.closeModalById('user-editor-modal', 'user-editor-modal-content');
    },

    renderPermMatrix: function(permissions, preset) {
      const body = document.getElementById('user-perm-matrix');
      if (!body) return;
      let perms = permissions;
      if (!perms && this.permissionPresets && this.permissionPresets[preset]) {
        perms = this.permissionPresets[preset];
      }
      if (!perms) {
        perms = {};
        this.accessModules.forEach(m => { perms[m] = { view: m !== 'settings', create: false, edit: false, delete: false }; });
      }
      body.innerHTML = this.uiAccessModules.map(mod => {
        const row = mod === 'expenses' ? this.mergeExpenseStaffPerm_(perms) : (perms[mod] || {});
        const label = this.moduleLabels[mod] || mod;
        const cell = (action) =>
          '<td class="text-center px-1 py-1.5"><input type="checkbox" data-mod="' + mod + '" data-act="' + action + '" ' +
          (row[action] ? 'checked' : '') + ' class="rounded border-slate-300 text-brand-primary"></td>';
        return '<tr class="border-t border-slate-100">' +
          '<td class="px-2 py-1.5 font-semibold text-slate-700">' + label + '</td>' +
          cell('view') + cell('create') + cell('edit') + cell('delete') +
          '</tr>';
      }).join('');
    },

    applyUserPreset: function() {
      const preset = document.getElementById('user-edit-preset').value || 'Viewer';
      if (this.permissionPresets && this.permissionPresets[preset]) {
        this.renderPermMatrix(this.permissionPresets[preset], preset);
      } else {
        this.renderPermMatrix(null, preset);
      }
      if (preset === 'Admin') document.getElementById('user-edit-owner').checked = true;
    },

    collectPermMatrix: function() {
      const perms = {};
      this.accessModules.forEach(m => { perms[m] = { view: false, create: false, edit: false, delete: false }; });
      document.querySelectorAll('#user-perm-matrix input[type="checkbox"]').forEach(cb => {
        const mod = cb.getAttribute('data-mod');
        const act = cb.getAttribute('data-act');
        if (perms[mod] && act) perms[mod][act] = !!cb.checked;
      });
      // Keep Staff API gates in sync with the merged Expenses & Staff UI row
      perms.staff = {
        view: !!perms.expenses.view,
        create: !!perms.expenses.create,
        edit: !!perms.expenses.edit,
        delete: !!perms.expenses.delete
      };
      return perms;
    },

    saveUserEditor: function() {
      const payload = {
        userId: document.getElementById('user-edit-id').value || '',
        name: document.getElementById('user-edit-name').value.trim(),
        email: document.getElementById('user-edit-email').value.trim(),
        status: document.getElementById('user-edit-status').value,
        rolePreset: document.getElementById('user-edit-preset').value,
        isOwner: document.getElementById('user-edit-owner').checked,
        permissions: this.collectPermMatrix(),
        sendInvite: document.getElementById('user-edit-send').checked
      };
      if (!payload.email) {
        this.showToast('Email is required.', true);
        return;
      }
      google.script.run
        .withSuccessHandler((res) => {
          if (!res || !res.success) {
            this.showToast((res && res.error) || 'Could not save user.', true);
            return;
          }
          this.showToast(res.message || 'User saved.', !!res.warning);
          this.closeUserEditor();
          this.loadUsers();
        })
        .api_saveUser(payload);
    },

    deleteUser: function(userId) {
      if (!userId || !confirm('Remove this user? Their link will stop working.')) return;
      google.script.run
        .withSuccessHandler((res) => {
          if (!res || !res.success) {
            this.showToast((res && res.error) || 'Could not remove user.', true);
            return;
          }
          this.showToast(res.message || 'User removed.', !!res.warning);
          this.loadUsers();
        })
        .api_deleteUser(userId);
    },

    initSectionDefaults: function() {
      // Keep Identity open; collapse the rest on small screens for faster scanning.
      const isMobile = window.matchMedia && window.matchMedia('(max-width: 767px)').matches;
      if (!isMobile) return;
      document.querySelectorAll('#general-content .settings-section').forEach((section, index) => {
        if (index === 0) return;
        const button = section.querySelector('button[aria-expanded]');
        const body = section.querySelector('.settings-section-body');
        const chevron = section.querySelector('.settings-section-chevron');
        if (!button || !body) return;
        body.classList.add('hidden');
        button.setAttribute('aria-expanded', 'false');
        if (chevron) chevron.textContent = 'expand_more';
      });
    },

    toggleSection: function(button) {
      if (!button) return;
      const section = button.closest('.settings-section');
      if (!section) return;
      const body = section.querySelector('.settings-section-body');
      const chevron = section.querySelector('.settings-section-chevron');
      if (!body) return;

      const willExpand = body.classList.contains('hidden');
      body.classList.toggle('hidden', !willExpand);
      button.setAttribute('aria-expanded', willExpand ? 'true' : 'false');
      if (chevron) chevron.textContent = willExpand ? 'expand_less' : 'expand_more';
    },

    switchTab: function(tabName) {
      this.activeTab = tabName;
      
      const paneGen = document.getElementById('pane-general');
      const paneUsers = document.getElementById('pane-users');
      const paneDrop = document.getElementById('pane-dropdowns');
      const paneGuide = document.getElementById('pane-guide');
      const btnGen = document.getElementById('tab-btn-general');
      const btnUsers = document.getElementById('tab-btn-users');
      const btnDrop = document.getElementById('tab-btn-dropdowns');
      const btnGuide = document.getElementById('tab-btn-guide');
      
      const baseBtn = 'flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-2.5 sm:px-3.5 py-1.5 rounded-lg text-[11px] sm:text-xs transition-all cursor-pointer whitespace-nowrap ';
      const activeClass = baseBtn + 'bg-white text-brand-primary font-bold shadow-xs';
      const inactiveClass = baseBtn + 'text-slate-600 hover:text-slate-900 font-medium';

      const showPane = (el, show) => {
        if (!el) return;
        if (show) { el.classList.remove('hidden'); el.classList.add('flex'); }
        else { el.classList.add('hidden'); el.classList.remove('flex'); }
      };

      showPane(paneGen, tabName === 'general');
      showPane(paneUsers, tabName === 'users');
      showPane(paneDrop, tabName === 'dropdowns');
      showPane(paneGuide, tabName === 'guide');
      if (btnGen) btnGen.className = tabName === 'general' ? activeClass : inactiveClass;
      if (btnUsers) btnUsers.className = tabName === 'users' ? activeClass : inactiveClass;
      if (btnDrop) btnDrop.className = tabName === 'dropdowns' ? activeClass : inactiveClass;
      if (btnGuide) btnGuide.className = tabName === 'guide' ? activeClass : inactiveClass;

      const headerSaveBtn = document.getElementById('btn-save-general-header');
      if (headerSaveBtn) {
        if (tabName === 'general') headerSaveBtn.classList.remove('hidden');
        else headerSaveBtn.classList.add('hidden');
      }

      if (tabName === 'users') this.loadUsers();
      if (tabName === 'guide' && typeof GuideApp !== 'undefined' && GuideApp.onShow) {
        GuideApp.onShow();
      }
    },

    // --- GENERAL SETTINGS LOGIC ---
    fetchGeneralSettings: function() {
      // Show Skeleton Loader
      const content = document.getElementById('general-content');
      const shimmer = document.getElementById('general-shimmer');
      if (content) content.classList.add('hidden');
      if (shimmer) shimmer.classList.remove('hidden');

      google.script.run
        .withSuccessHandler((res) => {
           if(res && res.success) {
               this.generalSettingsData = res.data || [];
               this.renderGeneralSettings();
           } else {
               if (shimmer) shimmer.classList.add('hidden');
               if (content) content.classList.remove('hidden');
               this.showToast("Failed to load General Settings.", true);
           }
        })
        .withFailureHandler(() => {
           if (shimmer) shimmer.classList.add('hidden');
           if (content) content.classList.remove('hidden');
           this.showToast("Failed to load General Settings.", true);
        })
        .api_getGeneralSettings();
    },

    renderGeneralSettings: function() {
       // Hide Skeleton Loader, Show Real Content
       const content = document.getElementById('general-content');
       const shimmer = document.getElementById('general-shimmer');
       if (shimmer) shimmer.classList.add('hidden');
       if (content) content.classList.remove('hidden');

       // Clear core inputs first
       this.coreKeys.forEach(k => {
           const el = document.getElementById('gen-' + k);
           if(el) {
             if (el.type === 'checkbox') el.checked = false;
             else el.value = '';
           }
       });

       (this.generalSettingsData || []).forEach(item => {
           if (!item) return;
           const rawKey = item.key || item.Key || item.setting || item.Setting || '';
           if (!rawKey || String(rawKey).trim() === '') return; 
           const rawVal = item.value !== undefined ? item.value : (item.Value !== undefined ? item.Value : '');

           const kLower = String(rawKey).trim().toLowerCase();

           this.coreKeys.forEach(core => {
               if (core.toLowerCase() === kLower || (core === 'ENABLE_NOTIFICATION' && kLower === 'notification_enabled')) {
                   const el = document.getElementById('gen-' + core);
                   if (el) {
                     if (el.type === 'checkbox' || this.checkboxKeys.indexOf(core) >= 0) {
                       const v = String(rawVal || '').trim().toUpperCase();
                       el.checked = (v === 'YES' || v === 'Y' || v === 'TRUE' || v === '1' || v === 'ENABLED');
                     } else {
                       el.value = rawVal || '';
                     }
                   }
               }
           });
       });

       const currSelect = document.getElementById('gen-CURRENCY_FORMAT');
       if (currSelect && !currSelect.value && AppUtils.currencyFormat) {
         currSelect.value = AppUtils.currencyFormat;
       }

       // Defaults when notification keys are not yet saved in SETTINGS
       const hasKey = (key) => (this.generalSettingsData || []).some(item => {
         const rawKey = String((item && (item.key || item.Key || item.setting || item.Setting)) || '').trim().toLowerCase();
         return rawKey === String(key).toLowerCase();
       });
       ['NOTIFY_PAYMENT_RECEIPT', 'NOTIFY_WEEKLY_REPORT'].forEach(key => {
         const el = document.getElementById('gen-' + key);
         if (el && !hasKey(key)) el.checked = true;
       });
       const dayEl = document.getElementById('gen-NOTIFY_REPORT_DAY');
       if (dayEl && !hasKey('NOTIFY_REPORT_DAY') && !dayEl.value) dayEl.value = 'Monday';
       const hourEl = document.getElementById('gen-NOTIFY_REPORT_HOUR');
       if (hourEl && !hasKey('NOTIFY_REPORT_HOUR') && !hourEl.value) hourEl.value = '8';
       const daysEl = document.getElementById('gen-NOTIFY_REPORT_DAYS');
       if (daysEl && !hasKey('NOTIFY_REPORT_DAYS') && !daysEl.value) daysEl.value = '7';

       const calHourEl = document.getElementById('gen-CALENDAR_DUE_HOUR');
       if (calHourEl && !hasKey('CALENDAR_DUE_HOUR') && !calHourEl.value) calHourEl.value = '9';
       const calDurEl = document.getElementById('gen-CALENDAR_DUE_DURATION_MIN');
       if (calDurEl && !hasKey('CALENDAR_DUE_DURATION_MIN') && !calDurEl.value) calDurEl.value = '30';
       const calEnableEl = document.getElementById('gen-ENABLE_CALENDAR_DUE_EVENTS');
       if (calEnableEl && !hasKey('ENABLE_CALENDAR_DUE_EVENTS')) calEnableEl.checked = false;

       const receiptSubject = document.getElementById('gen-NOTIFY_RECEIPT_SUBJECT');
       const receiptBody = document.getElementById('gen-NOTIFY_RECEIPT_BODY');
       if (receiptSubject && !String(receiptSubject.value || '').trim()) receiptSubject.value = this.defaultTemplates.receipt.subject;
       if (receiptBody && !String(receiptBody.value || '').trim()) receiptBody.value = this.defaultTemplates.receipt.body;
       const weeklySubject = document.getElementById('gen-NOTIFY_WEEKLY_SUBJECT');
       const weeklyIntro = document.getElementById('gen-NOTIFY_WEEKLY_INTRO');
       if (weeklySubject && !String(weeklySubject.value || '').trim()) weeklySubject.value = this.defaultTemplates.weekly.subject;
       if (weeklyIntro && !String(weeklyIntro.value || '').trim()) weeklyIntro.value = this.defaultTemplates.weekly.body;
       const waOverdue = document.getElementById('gen-NOTIFY_WA_OVERDUE');
       const waUpcoming = document.getElementById('gen-NOTIFY_WA_UPCOMING');
       if (waOverdue && !String(waOverdue.value || '').trim()) waOverdue.value = this.defaultTemplates.waOverdue.body;
       if (waUpcoming && !String(waUpcoming.value || '').trim()) waUpcoming.value = this.defaultTemplates.waUpcoming.body;

       this.applyWeeklyFieldsToUI();
       this.syncWeeklyFields();

       // Update live preview helpers and notifications
       this.updateLogoPreview();
       this.updateRevenueExplanation();
       this.updateCurrencyExplanation();
       this.toggleNotificationView();
       this.updateNotificationSummary();
       this.toggleCalendarDueView();
    },

    onLogoFileSelected: function(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      this.logoFileName = file.name;
      const reader = new FileReader();
      reader.onload = (e) => {
        const base64 = e.target.result;
        this.logoBase64 = base64;

        const imgEl = document.getElementById('logo-preview-img');
        const fallbackEl = document.getElementById('logo-preview-fallback');
        const statusEl = document.getElementById('logo-preview-status');
        const clearBtn = document.getElementById('btn-clear-logo');

        if (imgEl && fallbackEl) {
          imgEl.src = base64;
          imgEl.classList.remove('hidden');
          fallbackEl.classList.add('hidden');
        }
        if (statusEl) statusEl.textContent = 'Unsaved';
        if (clearBtn) clearBtn.classList.remove('hidden');

        // Immediately reflect preview on sidebar logo
        const sidebarImg = document.getElementById('sidebar-logo-img');
        const sidebarFallback = document.getElementById('sidebar-logo-fallback');
        if (sidebarImg && sidebarFallback) {
          sidebarImg.src = base64;
          sidebarImg.classList.remove('hidden');
          sidebarFallback.classList.add('hidden');
        }
      };
      reader.readAsDataURL(file);
    },

    clearLogo: function() {
      this.logoBase64 = null;
      this.logoFileName = null;
      const fileInput = document.getElementById('setting-logo-file');
      if (fileInput) fileInput.value = '';
      const idInput = document.getElementById('gen-LOGO_ID');
      if (idInput) idInput.value = '';

      const imgEl = document.getElementById('logo-preview-img');
      const fallbackEl = document.getElementById('logo-preview-fallback');
      const statusEl = document.getElementById('logo-preview-status');
      const clearBtn = document.getElementById('btn-clear-logo');

      if (imgEl) {
        imgEl.src = '';
        imgEl.classList.add('hidden');
      }
      if (fallbackEl) fallbackEl.classList.remove('hidden');
      if (statusEl) statusEl.textContent = 'Upload';
      if (clearBtn) clearBtn.classList.add('hidden');

      // Revert sidebar logo to LSC fallback
      const sidebarImg = document.getElementById('sidebar-logo-img');
      const sidebarFallback = document.getElementById('sidebar-logo-fallback');
      if (sidebarImg) {
        sidebarImg.src = '';
        sidebarImg.classList.add('hidden');
      }
      if (sidebarFallback) sidebarFallback.classList.remove('hidden');
    },

    updateLogoPreview: function() {
      const logoInput = document.getElementById('gen-LOGO_ID');
      const imgEl = document.getElementById('logo-preview-img');
      const fallbackEl = document.getElementById('logo-preview-fallback');
      const statusEl = document.getElementById('logo-preview-status');
      const clearBtn = document.getElementById('btn-clear-logo');
      if (!imgEl || !fallbackEl) return;

      const val = (logoInput ? logoInput.value : '').trim();
      if (!val && !this.logoBase64) {
        imgEl.src = '';
        imgEl.classList.add('hidden');
        fallbackEl.classList.remove('hidden');
        if (statusEl) statusEl.textContent = 'Upload';
        if (clearBtn) clearBtn.classList.add('hidden');
        return;
      }

      const targetSrc = this.logoBase64 || AppUtils.getSafeImageUrl(val);
      imgEl.onload = () => {
        imgEl.classList.remove('hidden');
        fallbackEl.classList.add('hidden');
        if (statusEl) statusEl.textContent = this.logoBase64 ? 'Unsaved' : 'Logo set';
        if (clearBtn) clearBtn.classList.remove('hidden');
      };
      imgEl.onerror = () => {
        imgEl.classList.add('hidden');
        fallbackEl.classList.remove('hidden');
        if (statusEl) statusEl.textContent = 'Upload';
        if (clearBtn) clearBtn.classList.remove('hidden');
      };
      imgEl.src = targetSrc;
    },

    updateRevenueExplanation: function() {
      const sel = document.getElementById('gen-Revenue_Recognition');
      const textEl = document.getElementById('revenue-rec-text');
      if (!sel || !textEl) return;

      if (sel.value === 'Split') {

    formatReportHourLabel: function(hourValue) {
      const hour = parseInt(hourValue, 10);
      if (!Number.isFinite(hour)) return '08:00 AM';
      const suffix = hour >= 12 ? 'PM' : 'AM';
      const hour12 = ((hour + 11) % 12) + 1;
      return String(hour12).padStart(2, '0') + ':00 ' + suffix;
    },

    getWeeklyFieldsFromUI: function() {
      const checked = (id) => {
        const el = document.getElementById(id);
        return !!(el && el.checked);
      };
      return {
        name: checked('nf-field-name'),
        phone: checked('nf-field-phone'),
        email: checked('nf-field-email'),
        due: checked('nf-field-due'),
        days: checked('nf-field-days'),
        memberId: checked('nf-field-memberId')
      };
    },

    applyWeeklyFieldsToUI: function() {
      const hidden = document.getElementById('gen-NOTIFY_WEEKLY_FIELDS');
      let fields = { name: true, phone: true, email: false, due: true, days: true, memberId: true };
      if (hidden && String(hidden.value || '').trim()) {
        try {
          const parsed = JSON.parse(hidden.value);
          if (parsed && typeof parsed === 'object') {
            fields = {
              name: parsed.name !== false,
              phone: parsed.phone !== false,
              email: parsed.email === true,
              due: parsed.due !== false,
              days: parsed.days !== false,
              memberId: parsed.memberId !== false
            };
          }
        } catch (e) { /* keep defaults */ }
      }
      const map = {
        'nf-field-name': fields.name,
        'nf-field-phone': fields.phone,
        'nf-field-email': fields.email,
        'nf-field-due': fields.due,
        'nf-field-days': fields.days,
        'nf-field-memberId': fields.memberId
      };
      Object.keys(map).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.checked = !!map[id];
      });
    },

    syncWeeklyFields: function() {
      const hidden = document.getElementById('gen-NOTIFY_WEEKLY_FIELDS');
      if (hidden) hidden.value = JSON.stringify(this.getWeeklyFieldsFromUI());
    },

    updateNotificationSummary: function() {
      const ownerEmailInput = document.getElementById('gen-OWNER_EMAIL');
      const summaryEmail = document.getElementById('notification-summary-email');
      const summaryFreq = document.getElementById('notification-summary-freq');
      const dayEl = document.getElementById('gen-NOTIFY_REPORT_DAY');
      const hourEl = document.getElementById('gen-NOTIFY_REPORT_HOUR');
      const daysEl = document.getElementById('gen-NOTIFY_REPORT_DAYS');
      const weeklyEl = document.getElementById('gen-NOTIFY_WEEKLY_REPORT');

      const ownerVal = (ownerEmailInput && ownerEmailInput.value.trim()) ? ownerEmailInput.value.trim() : 'Owner / Admin Email';
      const day = (dayEl && dayEl.value) ? dayEl.value : 'Monday';
      const hourLabel = this.formatReportHourLabel(hourEl ? hourEl.value : 8);
      const daysAhead = (daysEl && daysEl.value) ? daysEl.value : '7';
      const scheduleText = weeklyEl && !weeklyEl.checked
        ? 'Weekly report off'

      const gym = (gymNameEl && gymNameEl.value.trim()) || 'LSC';

        days: kind === 'waOverdue' ? '3' : '2',
        plan: 'Quarterly',
        gym: gym,
        gymName: gym
      };
      const text = String(template).replace(/\{\{\s*([a-zA-Z]+)\s*\}\}/g, function(_, raw) {
        const key = String(raw || '').toLowerCase();
        if (key === 'gym' || key === 'gymname') return sample.gym;
        if (key === 'duedate' || key === 'due') return sample.dueDate;
        return sample[key] != null ? String(sample[key]) : '';
      });
      const title = document.getElementById('notif-preview-title');
      const metaEl = document.getElementById('notif-preview-meta');
      const subjectWrap = document.getElementById('notif-preview-subject-wrap');
      const textEl = document.getElementById('notif-preview-text');
      const frame = document.getElementById('notif-preview-frame');
      const loadingEl = document.getElementById('notif-preview-loading');
      const ccRow = document.getElementById('notif-preview-cc');
      if (title) title.textContent = kind === 'waOverdue' ? 'Overdue WhatsApp preview' : 'Upcoming WhatsApp preview';
      if (metaEl) metaEl.textContent = 'Sample member · Supreet Kaur';
      if (subjectWrap) subjectWrap.classList.add('hidden');
      if (ccRow) ccRow.classList.add('hidden');
      if (loadingEl) loadingEl.classList.add('hidden');
      if (frame) frame.classList.add('hidden');
      if (textEl) {
        textEl.textContent = text;
        textEl.classList.remove('hidden');
      }
      this.openModalById('notification-preview-modal', 'notification-preview-modal-content');
    },

    previewNotificationEmail: function(type) {
      const kind = type === 'weekly' ? 'weekly' : 'receipt';
      const title = document.getElementById('notif-preview-title');
      const textEl = document.getElementById('notif-preview-text');
      const subjectWrap = document.getElementById('notif-preview-subject-wrap');
      if (title) title.textContent = 'Email preview';
      if (textEl) textEl.classList.add('hidden');
      if (subjectWrap) subjectWrap.classList.remove('hidden');
      const frameShow = document.getElementById('notif-preview-frame');
      if (frameShow) frameShow.classList.remove('hidden');
      const metaEl = document.getElementById('notif-preview-meta');
      const subjectEl = document.getElementById('notif-preview-subject');
      const ccRow = document.getElementById('notif-preview-cc');
      const ccVal = document.getElementById('notif-preview-cc-value');
      const loadingEl = document.getElementById('notif-preview-loading');
      const frame = document.getElementById('notif-preview-frame');

      if (metaEl) metaEl.textContent = 'Loading sample preview…';
      if (subjectEl) subjectEl.textContent = '—';
      if (ccRow) ccRow.classList.add('hidden');
      if (loadingEl) loadingEl.classList.remove('hidden');
      if (frame) {
        try { frame.srcdoc = ''; } catch (e) { /* ignore */ }
      }

      this.openModalById('notification-preview-modal', 'notification-preview-modal-content');

      google.script.run
        .withSuccessHandler((res) => {
          if (loadingEl) loadingEl.classList.add('hidden');
          if (!res || !res.success || !res.data) {
            this.showToast((res && res.error) || 'Could not build preview.', true);
            return;
          }
          if (metaEl) {
            metaEl.textContent = (res.data.isSample ? 'Sample preview · ' : '') + 'To: ' + (res.data.to || '—');
          }
          if (subjectEl) subjectEl.textContent = res.data.subject || '—';
          if (ccRow && ccVal) {
            if (res.data.cc) {
              ccVal.textContent = res.data.cc;
              ccRow.classList.remove('hidden');
            } else {
              ccRow.classList.add('hidden');
            }
          }
          if (frame) frame.srcdoc = res.data.htmlBody || '<p>No preview content.</p>';
        })
        .withFailureHandler((err) => {
          if (loadingEl) loadingEl.classList.add('hidden');
          this.showToast(err && err.message ? err.message : 'Preview failed.', true);
        })
        .api_previewNotificationEmail(kind, this.collectNotificationDraft());
    },
