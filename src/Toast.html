  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none w-full max-w-sm px-4"></div>

  <script>
    const Toast = {
      show: function(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const id = 'toast-' + Date.now();
        
        const isSuccess = type === 'success';
        const icon = isSuccess ? 'check_circle' : 'error';
        const color = isSuccess ? 'bg-emerald-500' : 'bg-red-500';

        const html = `
          <div id="${id}" class="flex items-center gap-3 px-4 py-3 text-white ${color} rounded-xl shadow-lg transform -translate-y-4 opacity-0 transition-all duration-300 pointer-events-auto">
            <span class="material-symbols-rounded text-lg">${icon}</span>
            <span class="text-sm font-medium flex-1">${msg}</span>
            <button onclick="document.getElementById('${id}').remove()" class="material-symbols-rounded text-lg opacity-70 hover:opacity-100">close</button>
          </div>
        `;
        
        container.insertAdjacentHTML('beforeend', html);
        
        // Trigger entrance animation
        requestAnimationFrame(() => {
          const el = document.getElementById(id);
          el.classList.remove('-translate-y-4', 'opacity-0');
        });

        // Auto-remove after 3 seconds
        setTimeout(() => {
          const el = document.getElementById(id);
          if(el) {
            el.classList.add('-translate-y-4', 'opacity-0');
            setTimeout(() => el.remove(), 300);
          }
        }, 3000);
      },
      success: (msg) => Toast.show(msg, 'success'),
      error: (msg) => Toast.show(msg, 'error')
    };
  </script>
