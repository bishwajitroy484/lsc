<script>
  const AppUtils = {
    currencyFormat: (typeof localStorage !== 'undefined' && localStorage.getItem('LSC_CURRENCY_FORMAT')) || 'Indian',
    availableYears: [],
    availableYearsLoaded: false,
    availableYearsLoading: false,
    availableYearsCallbacks: [],

    setCurrencyFormat: function(format) {
      if (!format) return;
      this.currencyFormat = String(format).trim();
      if (typeof localStorage !== 'undefined') {
        try {
          localStorage.setItem('LSC_CURRENCY_FORMAT', this.currencyFormat);
        } catch (e) {
          console.warn('Could not save currency format to localStorage', e);
        }
      }
    },

    formatCompactCurrency: function(val) {
      if (val === null || val === undefined || val === '') return '₹0';
      const clean = typeof val === 'number' ? val : Number(String(val).replace(/[^0-9.-]+/g, ''));
      if (isNaN(clean)) return '₹0';
      const sign = clean < 0 ? '-' : '';
      const abs = Math.abs(clean);
      let formatted;
      let suffix = '';

      if (abs >= 1e9) {
        formatted = (abs / 1e9).toFixed(1);
        suffix = 'B';
      } else if (abs >= 1e6) {
        formatted = (abs / 1e6).toFixed(1);
        suffix = 'M';
      } else if (abs >= 1e3) {
        formatted = (abs / 1e3).toFixed(1);
        suffix = 'k';
      } else {
        formatted = Number.isInteger(abs) ? abs.toString() : abs.toFixed(1);
      }

      if (formatted.endsWith('.0')) {
        formatted = formatted.slice(0, -2);
      }

      return `${sign}₹${formatted}${suffix}`;
    },

    formatCurrency: function(val, overrideStyle) {
      if (val === null || val === undefined || val === '') return '₹0';
      const clean = typeof val === 'number' ? val : Number(String(val).replace(/[^0-9.-]+/g, ''));
      if (isNaN(clean)) return '₹0';
      const sign = clean < 0 ? '-' : '';
      const abs = Math.abs(clean);
      const style = overrideStyle || (this && this.currencyFormat) || (typeof AppUtils !== 'undefined' && AppUtils.currencyFormat) || (typeof globalThis !== 'undefined' && globalThis.AppUtils && globalThis.AppUtils.currencyFormat) || (typeof localStorage !== 'undefined' && localStorage.getItem('LSC_CURRENCY_FORMAT')) || 'Indian';
      const isIndian = !String(style).toLowerCase().includes('standard') && !String(style).toLowerCase().includes('western') && !String(style).toLowerCase().includes('metric');

      let formatted;
      let suffix = '';

      if (isIndian) {
        if (abs >= 1e7) {
          // 1 Crore = 10,000,000
          formatted = parseFloat((abs / 1e7).toFixed(2)).toString();
          suffix = 'Crore';
        } else if (abs >= 1e5) {
          // 1 Lakh = 100,000
          formatted = parseFloat((abs / 1e5).toFixed(2)).toString();
          suffix = 'Lakhs';
        } else if (abs >= 1000) {
          // 1,000 to 99,999: standard Indian comma grouping (1,000, 10,000, etc.)
          formatted = Math.round(abs).toLocaleString('en-IN');
          suffix = '';
        } else {
          // 0 to 999
          formatted = Number.isInteger(abs) ? abs.toString() : abs.toFixed(1);
        }
      } else {
        // Standard International Metric (k, M, B)
        if (abs >= 1e9) {
          formatted = (abs / 1e9).toFixed(1);
          suffix = 'B';
        } else if (abs >= 1e6) {
          formatted = (abs / 1e6).toFixed(1);
          suffix = 'M';
        } else if (abs >= 1e3) {
          formatted = (abs / 1e3).toFixed(1);
          suffix = 'k';
        } else {
          formatted = Number.isInteger(abs) ? abs.toString() : abs.toFixed(1);
        }
      }

      if (formatted.endsWith('.0')) {
        formatted = formatted.slice(0, -2);
      }

      return `${sign}₹${formatted}${suffix}`;
    },

    parseAmount: function(val) {
      return Number(String(val || 0).replace(/[^0-9.-]+/g, "")) || 0;
    },

    formatDateDDMMMYYYY: function(dateStr, uppercase = false, shortYear = false) {
      if (!dateStr) return '';
      let d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      const months = uppercase
        ? ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC']
        : ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const day = String(d.getDate()).padStart(2, '0');
      const month = months[d.getMonth()];
      const year = shortYear ? String(d.getFullYear()).slice(-2) : d.getFullYear();
      return `${day}-${month}-${year}`;
    },

    parseToISODate: function(input) {
      if (!input) return '';
      if (input instanceof Date && !isNaN(input)) {
        const y = input.getFullYear();
        const m = String(input.getMonth() + 1).padStart(2, '0');
        const day = String(input.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }
      if (typeof input !== 'string') return '';
      const str = input.trim();
      if (!str || str === 'N/A') return '';

      if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
        return str.slice(0, 10);
      }

      const months = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
      const parts = str.split(/[\s\-\/\.]+/);
      if (parts.length >= 3) {
        if (parts[0].length === 4 && !isNaN(parts[0])) {
          let y = parseInt(parts[0], 10);
          let m = isNaN(parts[1]) ? months[parts[1].toLowerCase()] : parseInt(parts[1], 10) - 1;
          let d = parseInt(parts[2], 10);
          if (m !== undefined && !isNaN(m) && !isNaN(d)) {
            return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          }
        }
        if (parts[2].length === 4 || parts[2].length === 2) {
          let y = parseInt(parts[2], 10);
          if (y < 100) y += 2000;
          let m = isNaN(parts[1]) ? months[parts[1].toLowerCase()] : parseInt(parts[1], 10) - 1;
          let d = parseInt(parts[0], 10);
          if (m !== undefined && !isNaN(m) && !isNaN(d)) {
            return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          }
        }
      }

      let d = new Date(str);
      if (isNaN(d)) return '';
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    },

    loadAvailableYears: function(callback) {
      if (this.availableYearsLoaded) {
        if (callback) callback(this.availableYears);
        return;
      }
      if (callback) this.availableYearsCallbacks.push(callback);
      if (this.availableYearsLoading) return;

      this.availableYearsLoading = true;
      google.script.run
        .withSuccessHandler((response) => {
          if (!response || !response.success || !Array.isArray(response.data)) {
            console.error('api_getAvailableYears failed:', response?.error || 'Invalid response');
            this.availableYears = [String(new Date().getFullYear())];
          } else {
            const years = response.data
              .map(year => String(year))
              .filter(year => /^\d{4}$/.test(year));
            years.push(String(new Date().getFullYear()));
            this.availableYears = Array.from(new Set(years)).sort((a, b) => Number(b) - Number(a));
          }

          this.availableYearsLoaded = true;
          this.availableYearsLoading = false;
          const callbacks = this.availableYearsCallbacks.splice(0);
          callbacks.forEach(onLoaded => onLoaded(this.availableYears));
        })
        .withFailureHandler((error) => {
          console.error('api_getAvailableYears failed:', error);
          this.availableYears = [String(new Date().getFullYear())];
          this.availableYearsLoaded = true;
          this.availableYearsLoading = false;
          const callbacks = this.availableYearsCallbacks.splice(0);
          callbacks.forEach(onLoaded => onLoaded(this.availableYears));
        })
        .api_getAvailableYears();
    },

    populateYearSelect: function(elementId, preferredYear) {
      const select = document.getElementById(elementId);
      if (!select) return;

      const currentValue = preferredYear === undefined
        ? (select.value || String(new Date().getFullYear()))
        : String(preferredYear);
      select.innerHTML = this.availableYears
        .map(year => `<option value="${year}">${year}</option>`)
        .join('');

      if (this.availableYears.includes(currentValue)) {
        select.value = currentValue;
      } else {
        select.value = this.availableYears[0] || '';
      }
    },

    safeSetText: function(id, text) {
      const el = document.getElementById(id);
      if (el) el.innerText = text !== undefined && text !== null ? text : '';
    },

    safeSetValue: function(id, val) {
      const el = document.getElementById(id);
      if (el) el.value = val !== undefined && val !== null ? val : '';
    },

    safeSetClass: function(id, cls) {
      const el = document.getElementById(id);
      if (el) el.className = cls;
    },

    debounce: function(fn, wait = 150) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn.apply(this, args), wait);
      };
    },

    showModal: function(backdropId, contentId, hideClasses = ['opacity-0', 'pointer-events-none'], transformClasses = ['translate-y-full', 'opacity-0']) {
      const backdrop = document.getElementById(backdropId);
      const content = document.getElementById(contentId);
      if (backdrop) backdrop.classList.remove(...hideClasses);
      if (content) content.classList.remove(...transformClasses);
    },

    hideModal: function(backdropId, contentId, hideClasses = ['opacity-0', 'pointer-events-none'], transformClasses = ['translate-y-full', 'opacity-0']) {
      const backdrop = document.getElementById(backdropId);
      const content = document.getElementById(contentId);
      if (backdrop) backdrop.classList.add(...hideClasses);
      if (content) content.classList.add(...transformClasses);
    },

    clearValidationState: function(formOrId) {
      const form = typeof formOrId === 'string' ? document.getElementById(formOrId) : formOrId;
      if (!form) return;
      form.querySelectorAll('[data-validation-error]').forEach(error => error.remove());
      form.querySelectorAll('.field-validation-invalid').forEach(field => {
        field.classList.remove('field-validation-invalid');
        field.removeAttribute('aria-invalid');
      });
    },

    validateRequiredFields: function(formOrId) {
      const form = typeof formOrId === 'string' ? document.getElementById(formOrId) : formOrId;
      if (!form) return false;

      this.clearValidationState(form);
      const fields = Array.from(form.querySelectorAll('[required]'))
        .filter(field => !field.disabled && !field.closest('.hidden'));
      const invalidFields = fields.filter(field => {
        const value = typeof field.value === 'string' ? field.value.trim() : field.value;
        const isPlaceholder = field.tagName === 'SELECT' && (!value || value === 'All');
        return isPlaceholder || (typeof field.checkValidity === 'function' && !field.checkValidity());
      });

      invalidFields.forEach(field => {
        field.classList.add('field-validation-invalid');
        field.setAttribute('aria-invalid', 'true');
        const message = document.createElement('div');
        message.className = 'field-validation-error';
        message.dataset.validationError = 'true';
        message.setAttribute('role', 'alert');
        message.textContent = field.validity && !field.validity.valid && field.value
          ? 'Please enter a valid value.'
          : 'This field is required.';
        const container = field.closest('.relative') || field;
        container.insertAdjacentElement('afterend', message);
      });

      form.querySelectorAll('[required]').forEach(field => {
        if (field.dataset.validationBound) return;
        field.dataset.validationBound = 'true';
        const container = field.closest('.relative') || field;
        const clearError = () => {
          const value = typeof field.value === 'string' ? field.value.trim() : field.value;
          if (value && (!field.checkValidity || field.checkValidity())) {
            field.classList.remove('field-validation-invalid');
            field.removeAttribute('aria-invalid');
            const message = container.nextElementSibling;
            if (message && message.hasAttribute('data-validation-error')) message.remove();
          }
        };
        field.addEventListener('input', clearError);
        field.addEventListener('change', clearError);
      });

      if (invalidFields.length) {
        invalidFields[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
        Toast.error('Please complete the highlighted fields.');
        return false;
      }
      return true;
    },

    getSafeImageUrl: function(rawStr) {
      if (!rawStr) return '';
      let str = String(rawStr).trim();
      if (!str) return '';

      // Direct data URL (e.g. FileReader preview)
      if (str.startsWith('data:')) return str;

      // Extract Google Drive ID if full URL passed
      if (str.includes('drive.google.com')) {
        const match = str.match(/id=([a-zA-Z0-9_-]+)/) || str.match(/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          str = match[1];
        }
      }

      // Convert pure Google Drive ID to thumbnail endpoint (unblockable by CORS/Drive redirect)
      if (!str.includes('http') && !str.includes('/') && /^[a-zA-Z0-9_-]{20,}$/.test(str)) {
        return 'https://drive.google.com/thumbnail?id=' + str + '&sz=w200-h200';
      }

      return str;
    },

    applyAppBranding: function(logoIdOrUrl, gymName) {
      const logoImg = document.getElementById('sidebar-logo-img');
      const logoFallback = document.getElementById('sidebar-logo-fallback');
      const titleEl = document.getElementById('sidebar-gym-title');

      if (titleEl && gymName) {
        titleEl.textContent = gymName;
      }

      if (!logoImg || !logoFallback) return;

      const safeUrl = this.getSafeImageUrl(logoIdOrUrl);
      if (!safeUrl) {
        logoImg.src = '';
        logoImg.classList.add('hidden');
        logoFallback.classList.remove('hidden');
        return;
      }

      logoImg.onload = function() {
        logoImg.classList.remove('hidden');
        logoFallback.classList.add('hidden');
      };
      logoImg.onerror = function() {
        logoImg.classList.add('hidden');
        logoFallback.classList.remove('hidden');
      };
      logoImg.src = safeUrl;
    },

    loadAppBranding: function() {
      if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.api_getGeneralSettings === 'function') {
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.success && Array.isArray(res.data)) {
              let logoVal = '';
              let gymVal = '';
              res.data.forEach(item => {
                if (!item) return;
                const rawKey = item.key || item.Key || item.setting || item.Setting || '';
                if (!rawKey) return;
                const rawVal = item.value !== undefined ? item.value : (item.Value !== undefined ? item.Value : '');
                const k = String(rawKey).trim().toUpperCase();
                if (k === 'LOGO_ID' || k === 'LOGO') logoVal = rawVal || '';
                if (k === 'GYM_NAME' || k === 'GYMNAME') gymVal = rawVal || '';
                if (k === 'CURRENCY_FORMAT' || k === 'CURRENCY_STYLE') {
                  this.setCurrencyFormat(rawVal || 'Indian');
                }
              });
              this.applyAppBranding(logoVal, gymVal);
            }
          })
          .api_getGeneralSettings();
      }
    }
  };

  const SidebarManager = {
    toggle: function() {
      const sidebar = document.getElementById('main-sidebar');
      const icon = document.getElementById('sidebar-toggle-icon');
      const isCollapsed = sidebar.classList.contains('w-20');

      if (isCollapsed) {
        // Expand
        sidebar.classList.remove('w-20');
        sidebar.classList.add('w-64');
        icon.innerText = 'keyboard_double_arrow_left';
        document.querySelectorAll('.sidebar-text').forEach(el => el.classList.remove('hidden'));
      } else {
        // Collapse
        sidebar.classList.remove('w-64');
        sidebar.classList.add('w-20');
        icon.innerText = 'keyboard_double_arrow_right';
        document.querySelectorAll('.sidebar-text').forEach(el => el.classList.add('hidden'));
      }
    },
    
    init: function() {
      const sidebar = document.getElementById('main-sidebar');
      const icon = document.getElementById('sidebar-toggle-icon');
      
      if (sidebar) {
        // Force closed by default on initial boot
        sidebar.classList.remove('w-64');
        sidebar.classList.add('w-20');
        if (icon) icon.innerText = 'keyboard_double_arrow_right';
        
        setTimeout(() => {
          document.querySelectorAll('.sidebar-text').forEach(el => el.classList.add('hidden'));
        }, 50);
      }
    }
  };
  
  const AppState = {
    currentView: '',
    
    init: function() {
      AppUtils.loadAvailableYears();

      // 1. Inject static layout components from templates
      this.injectTemplate('tpl-comp-sidebar', 'desktop-nav-container');
      this.injectTemplate('tpl-comp-bottom-nav', 'mobile-nav-container');

      // Load app branding into sidebar
      AppUtils.loadAppBranding();

      // 2. Delegate click handler on .nav-btn for instant SPA navigation & highlighting
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('.nav-btn');
        if (btn) {
          const route = btn.getAttribute('data-route');
          if (route) {
            e.preventDefault();
            if (window.location.hash !== '#' + route) {
              window.location.hash = '#' + route;
            }
            this.route(route);
          }
        }
      });

      // 3. Listen for URL hash changes for browser history & external triggers
      window.addEventListener('hashchange', () => this.route());
      
      // 4. Trigger initial route or default to dashboard
      if (!window.location.hash) {
        window.location.hash = '#dashboard';
      }
      this.route();
    },
    
    injectTemplate: function(templateId, targetId) {
      const tpl = document.getElementById(templateId);
      const target = document.getElementById(targetId);
      if (tpl && target) {
        target.innerHTML = tpl.innerHTML;
      }
    },

    route: function(forcedView) {
      const hash = forcedView ? ('#' + forcedView) : (window.location.hash || '#dashboard');
      const viewName = hash.replace('#', '') || 'dashboard';

      // Always update navigation highlight immediately for fast UI feedback
      this.updateNavHighlight(viewName);

      const root = document.getElementById('app-root');
      if (this.currentView === viewName && root && root.children.length > 0) {
        return;
      }
      this.currentView = viewName;

      const tplId = 'tpl-view-' + viewName;
      const tpl = document.getElementById(tplId);
      
      if (tpl && root) {
         // Apply fade animation class (from Global_Styles)
         root.classList.add('fade-enter');
         root.innerHTML = tpl.innerHTML;
         
         // Trigger DOM reflow and remove fade class to animate in
         requestAnimationFrame(() => {
           root.classList.add('fade-enter-active');
           setTimeout(() => {
             root.classList.remove('fade-enter', 'fade-enter-active');
           }, 300);
         });

         this.executeScripts(root);
      } else if (root) {
         root.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-slate-400">
            <span class="material-symbols-rounded text-5xl mb-2 opacity-50">build</span>
            <h2 class="text-lg font-medium text-slate-600">Module Under Construction</h2>
          </div>`;
      }
    },

    // When injecting HTML via innerHTML, <script> tags do not run automatically.
    // This function rebuilds and forces them to execute.
    executeScripts: function(element) {
      const scripts = element.querySelectorAll('script');
      scripts.forEach(oldScript => {
        const newScript = document.createElement('script');
        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
    },

    updateNavHighlight: function(viewName) {
      // Reset all buttons
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-brand-primary', 'bg-slate-800');
        btn.classList.add('text-slate-400');
      });

      // Highlight active button based on current route
      document.querySelectorAll(`[data-route="${viewName}"]`).forEach(btn => {
        btn.classList.remove('text-slate-400');
        btn.classList.add('text-brand-primary');
        // If it's a desktop sidebar button, give it the dark background highlight
        if(btn.closest('aside')) {
           btn.classList.add('bg-slate-800');
        }
      });
    }
  };

  // Boot the app when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => AppState.init());
  } else {
    AppState.init();
  }
</script>
