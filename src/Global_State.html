<script>
  const ActionProgress = {
    _timer: null,
    _pct: 0,
    _circumference: 2 * Math.PI * 15.5,

    _els: function() {
      return {
        overlay: document.getElementById('action-progress-overlay'),
        ring: document.getElementById('action-progress-ring'),
        pct: document.getElementById('action-progress-pct'),
        label: document.getElementById('action-progress-label')
      };
    },

    _paint: function() {
      const els = this._els();
      if (els.pct) els.pct.textContent = Math.round(this._pct) + '%';
      if (els.ring) {
        const offset = this._circumference * (1 - Math.min(100, Math.max(0, this._pct)) / 100);
        els.ring.style.strokeDasharray = String(this._circumference);
        els.ring.style.strokeDashoffset = String(offset);
      }
    },

    show: function(label) {
      const els = this._els();
      if (!els.overlay) return;
      if (els.label) els.label.textContent = label || 'Working…';
      els.overlay.classList.remove('hidden');
      this._pct = 8;
      this._paint();
      if (this._timer) clearInterval(this._timer);
      this._timer = setInterval(() => {
        if (this._pct >= 90) return;
        this._pct = Math.min(90, this._pct + (2 + Math.random() * 6));
        this._paint();
      }, 220);
    },

    success: function() {
      if (this._timer) { clearInterval(this._timer); this._timer = null; }
      this._pct = 100;
      this._paint();
      const els = this._els();
      if (els.label) els.label.textContent = 'Done';
      setTimeout(() => this.hide(), 280);
    },

    error: function() {
      this.hide();
    },

    hide: function() {
      if (this._timer) { clearInterval(this._timer); this._timer = null; }
      const els = this._els();
      if (els.overlay) els.overlay.classList.add('hidden');
      this._pct = 0;
      this._paint();
    },

    labelForApi: function(name) {
      const n = String(name || '');
      if (/delete|remove/i.test(n)) return 'Deleting…';
      if (/authorize/i.test(n)) return 'Authorizing…';
      if (/redeemInvite/i.test(n)) return 'Opening…';
      if (/record|payment|transaction/i.test(n)) return 'Saving…';
      if (/markSetup/i.test(n)) return 'Updating setup…';
      if (/save|create|update|add/i.test(n)) return 'Saving…';
      return 'Working…';
    },

    shouldTrack: function(name) {
      return /^(api_save|api_delete|api_remove|api_record|api_authorize|api_mark|api_create|api_update|api_redeemInvite|api_sendInvitation|api_sendTestNotificationEmail|api_publishWebAppVersion)/.test(String(name || ''));
    }
  };

  (function installAuthScriptRunBridge() {
    if (typeof google === 'undefined' || !google.script || !google.script.run) return;
    const nativeRun = google.script.run;
    const AUTH_KEY = 'lsc_auth_token';
    const OPEN_APIS = {
      api_redeemInviteToken: true,
      api_invoke: true
    };

    function getToken() {
      try { return sessionStorage.getItem(AUTH_KEY) || ''; } catch (e) { return ''; }
    }

    function createRunner(success, failure, userObj) {
      return new Proxy({}, {
        get: function(_target, prop) {
          if (prop === 'withSuccessHandler') {
            return function(cb) { return createRunner(cb, failure, userObj); };
          }
          if (prop === 'withFailureHandler') {
            return function(cb) { return createRunner(success, cb, userObj); };
          }
          if (prop === 'withUserObject') {
            return function(obj) { return createRunner(success, failure, obj); };
          }
          return function() {
            const args = Array.prototype.slice.call(arguments);
            const token = getToken();
            const trackedName = (prop === 'api_invoke' && args[1]) ? args[1] : prop;
            const track = ActionProgress.shouldTrack(trackedName);
            if (track) ActionProgress.show(ActionProgress.labelForApi(trackedName));

            const wrappedSuccess = function(res) {
              if (track) {
                if (res && res.success === false) ActionProgress.error();
                else ActionProgress.success();
              }
              if (typeof success === 'function') success(res);
            };
            const wrappedFailure = function(err) {
              if (track) ActionProgress.error();
              if (typeof failure === 'function') failure(err);
            };

            let runner = nativeRun;
            runner = runner.withSuccessHandler(wrappedSuccess);
            runner = runner.withFailureHandler(wrappedFailure);
            if (userObj !== undefined) runner = runner.withUserObject(userObj);

            // Prefer invoke whenever we have a session token so invitee identity sticks.
            if (token && !OPEN_APIS[prop] && typeof runner.api_invoke === 'function') {
              return runner.api_invoke(token, prop, args);
            }
            if (typeof runner[prop] !== 'function') {
              if (track) ActionProgress.error();
              throw new Error('Unknown server function: ' + String(prop));
            }
            return runner[prop].apply(runner, args);
          };
        }
      });
    }

    google.script.run = createRunner(null, null, undefined);
    window.LSC_AUTH = {
      key: AUTH_KEY,
      getToken: getToken,
      setToken: function(token) {
        try {
          if (token) sessionStorage.setItem(AUTH_KEY, token);
          else sessionStorage.removeItem(AUTH_KEY);
        } catch (e) { /* ignore */ }
      },
      clear: function() {
        try { sessionStorage.removeItem(AUTH_KEY); } catch (e) { /* ignore */ }
      }
    };
    window.ActionProgress = ActionProgress;
  })();

  const AppUtils = {
    currencyFormat: (typeof localStorage !== 'undefined' && localStorage.getItem('LSC_CURRENCY_FORMAT')) || 'Indian',
    availableYears: [String(new Date().getFullYear())],
    availableYearsLoaded: false,
    availableYearsLoading: false,
    availableYearsCallbacks: [],

    setCurrencyFormat: function(format) {
      if (!format) return;
      this.currencyFormat = String(format).trim();
      if (typeof localStorage !== 'undefined') {
        try {
          localStorage.setItem('LSC_CURRENCY_FORMAT', this.currencyFormat);
        } catch (e) {
          console.warn('Could not save currency format to localStorage', e);
        }
      }
    },

    formatCompactCurrency: function(val) {
      if (val === null || val === undefined || val === '') return '₹0';
      const clean = typeof val === 'number' ? val : Number(String(val).replace(/[^0-9.-]+/g, ''));
      if (isNaN(clean)) return '₹0';
      const sign = clean < 0 ? '-' : '';
      const abs = Math.abs(clean);
      let formatted;
      let suffix = '';

      if (abs >= 1e9) {
        formatted = (abs / 1e9).toFixed(1);
        suffix = 'B';
      } else if (abs >= 1e6) {
        formatted = (abs / 1e6).toFixed(1);
        suffix = 'M';
      } else if (abs >= 1e3) {
        formatted = (abs / 1e3).toFixed(1);
        suffix = 'k';
      } else {
        formatted = Number.isInteger(abs) ? abs.toString() : abs.toFixed(1);
      }

      if (formatted.endsWith('.0')) {
        formatted = formatted.slice(0, -2);
      }

      return `${sign}₹${formatted}${suffix}`;
    },

    formatCurrency: function(val, overrideStyle) {
      if (val === null || val === undefined || val === '') return '₹0';
      const clean = typeof val === 'number' ? val : Number(String(val).replace(/[^0-9.-]+/g, ''));
      if (isNaN(clean)) return '₹0';
      const sign = clean < 0 ? '-' : '';
      const abs = Math.abs(clean);
      const style = overrideStyle || (this && this.currencyFormat) || (typeof AppUtils !== 'undefined' && AppUtils.currencyFormat) || (typeof globalThis !== 'undefined' && globalThis.AppUtils && globalThis.AppUtils.currencyFormat) || (typeof localStorage !== 'undefined' && localStorage.getItem('LSC_CURRENCY_FORMAT')) || 'Indian';
      const isIndian = !String(style).toLowerCase().includes('standard') && !String(style).toLowerCase().includes('western') && !String(style).toLowerCase().includes('metric');

      let formatted;
      let suffix = '';

      if (isIndian) {
        if (abs >= 1e7) {
          // 1 Crore = 10,000,000
          formatted = parseFloat((abs / 1e7).toFixed(2)).toString();
          suffix = 'Crore';
        } else if (abs >= 1e5) {
          // 1 Lakh = 100,000
          formatted = parseFloat((abs / 1e5).toFixed(2)).toString();
          suffix = 'Lakhs';
        } else if (abs >= 1000) {
          // 1,000 to 99,999: standard Indian comma grouping (1,000, 10,000, etc.)
          formatted = Math.round(abs).toLocaleString('en-IN');
          suffix = '';
        } else {
          // 0 to 999
          formatted = Number.isInteger(abs) ? abs.toString() : abs.toFixed(1);
        }
      } else {
        // Standard International Metric (k, M, B)
        if (abs >= 1e9) {
          formatted = (abs / 1e9).toFixed(1);
          suffix = 'B';
        } else if (abs >= 1e6) {
          formatted = (abs / 1e6).toFixed(1);
          suffix = 'M';
        } else if (abs >= 1e3) {
          formatted = (abs / 1e3).toFixed(1);
          suffix = 'k';
        } else {
          formatted = Number.isInteger(abs) ? abs.toString() : abs.toFixed(1);
        }
      }

      if (formatted.endsWith('.0')) {
        formatted = formatted.slice(0, -2);
      }

      return `${sign}₹${formatted}${suffix}`;
    },

    parseAmount: function(val) {
      return Number(String(val || 0).replace(/[^0-9.-]+/g, "")) || 0;
    },

    formatDateDDMMMYYYY: function(dateStr, uppercase = false, shortYear = false) {
      if (!dateStr) return '';
      let d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      const months = uppercase
        ? ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC']
        : ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const day = String(d.getDate()).padStart(2, '0');
      const month = months[d.getMonth()];
      const year = shortYear ? String(d.getFullYear()).slice(-2) : d.getFullYear();
      return `${day}-${month}-${year}`;
    },

    parseToISODate: function(input) {
      if (!input) return '';
      if (input instanceof Date && !isNaN(input)) {
        const y = input.getFullYear();
        const m = String(input.getMonth() + 1).padStart(2, '0');
        const day = String(input.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }
      if (typeof input !== 'string') return '';
      const str = input.trim();
      if (!str || str === 'N/A') return '';

      if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
        return str.slice(0, 10);
      }

      const months = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
      const parts = str.split(/[\s\-\/\.]+/);
      if (parts.length >= 3) {
        if (parts[0].length === 4 && !isNaN(parts[0])) {
          let y = parseInt(parts[0], 10);
          let m = isNaN(parts[1]) ? months[parts[1].toLowerCase()] : parseInt(parts[1], 10) - 1;
          let d = parseInt(parts[2], 10);
          if (m !== undefined && !isNaN(m) && !isNaN(d)) {
            return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          }
        }
        if (parts[2].length === 4 || parts[2].length === 2) {
          let y = parseInt(parts[2], 10);
          if (y < 100) y += 2000;
          let m = isNaN(parts[1]) ? months[parts[1].toLowerCase()] : parseInt(parts[1], 10) - 1;
          let d = parseInt(parts[0], 10);
          if (m !== undefined && !isNaN(m) && !isNaN(d)) {
            return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          }
        }
      }

      let d = new Date(str);
      if (isNaN(d)) return '';
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    },

    loadAvailableYears: function(callback) {
      if (this.availableYearsLoaded) {
        if (callback) callback(this.availableYears);
        return;
      }
      if (callback) this.availableYearsCallbacks.push(callback);
      if (this.availableYearsLoading) return;

      this.availableYearsLoading = true;
      google.script.run
        .withSuccessHandler((response) => {
          if (!response || !response.success || !Array.isArray(response.data)) {
            console.error('api_getAvailableYears failed:', response?.error || 'Invalid response');
            this.availableYears = [String(new Date().getFullYear())];
          } else {
            const years = response.data
              .map(year => String(year))
              .filter(year => /^\d{4}$/.test(year));
            years.push(String(new Date().getFullYear()));
            this.availableYears = Array.from(new Set(years)).sort((a, b) => Number(b) - Number(a));
          }

          this.availableYearsLoaded = true;
          this.availableYearsLoading = false;
          const callbacks = this.availableYearsCallbacks.splice(0);
          callbacks.forEach(onLoaded => onLoaded(this.availableYears));
        })
        .withFailureHandler((error) => {
          console.error('api_getAvailableYears failed:', error);
          this.availableYears = [String(new Date().getFullYear())];
          this.availableYearsLoaded = true;
          this.availableYearsLoading = false;
          const callbacks = this.availableYearsCallbacks.splice(0);
          callbacks.forEach(onLoaded => onLoaded(this.availableYears));
        })
        .api_getAvailableYears();
    },

    populateYearSelect: function(elementId, preferredYear) {
      const select = document.getElementById(elementId);
      if (!select) return;

      const currentValue = preferredYear === undefined
        ? (select.value || String(new Date().getFullYear()))
        : String(preferredYear);
      select.innerHTML = this.availableYears
        .map(year => `<option value="${year}">${year}</option>`)
        .join('');

      if (this.availableYears.includes(currentValue)) {
        select.value = currentValue;
      } else {
        select.value = this.availableYears[0] || '';
      }
    },

    safeSetText: function(id, text) {
      const el = document.getElementById(id);
      if (el) el.innerText = text !== undefined && text !== null ? text : '';
    },

    safeSetValue: function(id, val) {
      const el = document.getElementById(id);
      if (el) el.value = val !== undefined && val !== null ? val : '';
    },

    safeSetClass: function(id, cls) {
      const el = document.getElementById(id);
      if (el) el.className = cls;
    },

    debounce: function(fn, wait = 150) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn.apply(this, args), wait);
      };
    },

    showModal: function(backdropId, contentId, hideClasses = ['opacity-0', 'pointer-events-none'], transformClasses = ['translate-y-full', 'opacity-0']) {
      const backdrop = document.getElementById(backdropId);
      const content = document.getElementById(contentId);
      if (backdrop) backdrop.classList.remove(...hideClasses);
      if (content) content.classList.remove(...transformClasses);
    },

    hideModal: function(backdropId, contentId, hideClasses = ['opacity-0', 'pointer-events-none'], transformClasses = ['translate-y-full', 'opacity-0']) {
      const backdrop = document.getElementById(backdropId);
      const content = document.getElementById(contentId);
      if (backdrop) backdrop.classList.add(...hideClasses);
      if (content) content.classList.add(...transformClasses);
    },

    clearValidationState: function(formOrId) {
      const form = typeof formOrId === 'string' ? document.getElementById(formOrId) : formOrId;
      if (!form) return;
      form.querySelectorAll('[data-validation-error]').forEach(error => error.remove());
      form.querySelectorAll('.field-validation-invalid').forEach(field => {
        field.classList.remove('field-validation-invalid');
        field.removeAttribute('aria-invalid');
      });
    },

    validateRequiredFields: function(formOrId) {
      const form = typeof formOrId === 'string' ? document.getElementById(formOrId) : formOrId;
      if (!form) return false;

      this.clearValidationState(form);
      const fields = Array.from(form.querySelectorAll('[required]'))
        .filter(field => !field.disabled && !field.closest('.hidden'));
      const invalidFields = fields.filter(field => {
        const value = typeof field.value === 'string' ? field.value.trim() : field.value;
        const isPlaceholder = field.tagName === 'SELECT' && (!value || value === 'All');
        return isPlaceholder || (typeof field.checkValidity === 'function' && !field.checkValidity());
      });

      invalidFields.forEach(field => {
        field.classList.add('field-validation-invalid');
        field.setAttribute('aria-invalid', 'true');
        const message = document.createElement('div');
        message.className = 'field-validation-error';
        message.dataset.validationError = 'true';
        message.setAttribute('role', 'alert');
        message.textContent = field.validity && !field.validity.valid && field.value
          ? 'Please enter a valid value.'
          : 'This field is required.';
        const container = field.closest('.relative') || field;
        container.insertAdjacentElement('afterend', message);
      });

      form.querySelectorAll('[required]').forEach(field => {
        if (field.dataset.validationBound) return;
        field.dataset.validationBound = 'true';
        const container = field.closest('.relative') || field;
        const clearError = () => {
          const value = typeof field.value === 'string' ? field.value.trim() : field.value;
          if (value && (!field.checkValidity || field.checkValidity())) {
            field.classList.remove('field-validation-invalid');
            field.removeAttribute('aria-invalid');
            const message = container.nextElementSibling;
            if (message && message.hasAttribute('data-validation-error')) message.remove();
          }
        };
        field.addEventListener('input', clearError);
        field.addEventListener('change', clearError);
      });

      if (invalidFields.length) {
        invalidFields[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
        Toast.error('Please complete the highlighted fields.');
        return false;
      }
      return true;
    },

    getSafeImageUrl: function(rawStr) {
      if (!rawStr) return '';
      let str = String(rawStr).trim();
      if (!str) return '';

      // Direct data URL (e.g. FileReader preview)
      if (str.startsWith('data:')) return str;

      // Extract Google Drive ID if full URL passed
      if (str.includes('drive.google.com')) {
        const match = str.match(/id=([a-zA-Z0-9_-]+)/) || str.match(/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          str = match[1];
        }
      }

      // Convert pure Google Drive ID to thumbnail endpoint (unblockable by CORS/Drive redirect)
      if (!str.includes('http') && !str.includes('/') && /^[a-zA-Z0-9_-]{20,}$/.test(str)) {
        return 'https://drive.google.com/thumbnail?id=' + str + '&sz=w200-h200';
      }

      return str;
    },

    applyAppBranding: function(logoIdOrUrl, gymName) {
      const logoImg = document.getElementById('sidebar-logo-img');
      const logoFallback = document.getElementById('sidebar-logo-fallback');
      const titleEl = document.getElementById('sidebar-gym-title');

      if (titleEl && gymName) {
        titleEl.textContent = gymName;
      }

      if (!logoImg || !logoFallback) return;

      const safeUrl = this.getSafeImageUrl(logoIdOrUrl);
      if (!safeUrl) {
        logoImg.src = '';
        logoImg.classList.add('hidden');
        logoFallback.classList.remove('hidden');
        return;
      }

      logoImg.onload = function() {
        logoImg.classList.remove('hidden');
        logoFallback.classList.add('hidden');
      };
      logoImg.onerror = function() {
        logoImg.classList.add('hidden');
        logoFallback.classList.remove('hidden');
      };
      logoImg.src = safeUrl;
    },

    applySessionBranding: function(session) {
      const branding = (session && session.branding) || {};
      const setup = (session && session.setup) || {};
      const gymName = branding.gymName || setup.gymName || '';
      const logoId = branding.logoId || setup.logoId || '';
      const currencyFormat = branding.currencyFormat || setup.currencyFormat || '';
      if (currencyFormat) this.setCurrencyFormat(currencyFormat);
      this.applyAppBranding(logoId, gymName);
    },

    loadAppBranding: function() {
      // Prefer branding already returned with the session payload (no extra RTT).
      if (window.LSC_SESSION && (window.LSC_SESSION.branding || window.LSC_SESSION.setup)) {
        this.applySessionBranding(window.LSC_SESSION);
        return;
      }
      if (typeof google !== 'undefined' && google.script && google.script.run && typeof google.script.run.api_getGeneralSettings === 'function') {
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.success && Array.isArray(res.data)) {
              let logoVal = '';
              let gymVal = '';
              res.data.forEach(item => {
                if (!item) return;
                const rawKey = item.key || item.Key || item.setting || item.Setting || '';
                if (!rawKey) return;
                const rawVal = item.value !== undefined ? item.value : (item.Value !== undefined ? item.Value : '');
                const k = String(rawKey).trim().toUpperCase();
                if (k === 'LOGO_ID' || k === 'LOGO') logoVal = rawVal || '';
                if (k === 'GYM_NAME' || k === 'GYMNAME') gymVal = rawVal || '';
                if (k === 'CURRENCY_FORMAT' || k === 'CURRENCY_STYLE') {
                  this.setCurrencyFormat(rawVal || 'Indian');
                }
              });
              this.applyAppBranding(logoVal, gymVal);
            }
          })
          .api_getGeneralSettings();
      }
    }
  };

  const SidebarManager = {
    toggle: function() {
      const sidebar = document.getElementById('main-sidebar');
      const icon = document.getElementById('sidebar-toggle-icon');
      const isCollapsed = sidebar.classList.contains('w-20');

      if (isCollapsed) {
        // Expand
        sidebar.classList.remove('w-20');
        sidebar.classList.add('w-64');
        icon.innerText = 'keyboard_double_arrow_left';
        document.querySelectorAll('.sidebar-text').forEach(el => el.classList.remove('hidden'));
      } else {
        // Collapse
        sidebar.classList.remove('w-64');
        sidebar.classList.add('w-20');
        icon.innerText = 'keyboard_double_arrow_right';
        document.querySelectorAll('.sidebar-text').forEach(el => el.classList.add('hidden'));
      }
    },
    
    init: function() {
      const sidebar = document.getElementById('main-sidebar');
      const icon = document.getElementById('sidebar-toggle-icon');
      
      if (sidebar) {
        // Force closed by default on initial boot
        sidebar.classList.remove('w-64');
        sidebar.classList.add('w-20');
        if (icon) icon.innerText = 'keyboard_double_arrow_right';
        
        setTimeout(() => {
          document.querySelectorAll('.sidebar-text').forEach(el => el.classList.add('hidden'));
        }, 50);
      }
    }
  };
  
  const AccessControl = {
    session: null,

    can: function(moduleName, action) {
      const s = this.session;
      if (!s || !s.allowed) return false;
      if (s.isOwner) return true;
      const row = s.permissions && s.permissions[moduleName];
      return !!(row && row[action]);
    },

    firstAllowedRoute: function() {
      const order = ['dashboard', 'members', 'expenses', 'calendar', 'settings'];
      for (let i = 0; i < order.length; i++) {
        const route = order[i];
        if (route === 'expenses') {
          if (this.can('expenses', 'view') || this.can('staff', 'view')) return 'expenses';
          continue;
        }
        if (this.can(route, 'view')) return route;
      }
      if (this.can('staff', 'view')) return 'expenses';
      return '';
    },

    applyNavVisibility: function() {
      document.querySelectorAll('.nav-btn[data-route]').forEach(btn => {
        const route = btn.getAttribute('data-route');
        if (!route) return;
        let allowed = this.can(route, 'view');
        if (route === 'expenses') {
          allowed = this.can('expenses', 'view') || this.can('staff', 'view');
        }
        if (allowed) btn.classList.remove('hidden');
        else btn.classList.add('hidden');
      });
    },

    applyActionGates: function(root, moduleName) {
      if (!root || !moduleName) return;
      root.querySelectorAll('[data-perm]').forEach(el => {
        const spec = String(el.getAttribute('data-perm') || '');
        const parts = spec.split(':');
        const mod = parts[0] || moduleName;
        const action = parts[1] || 'edit';
        if (this.can(mod, action)) el.classList.remove('hidden');
        else el.classList.add('hidden');
      });
      if (!this.can(moduleName, 'create')) {
        root.querySelectorAll(
          'button[onclick*="openModal("], button[onclick*="openModal()"], button[onclick*="MembersApp.openModal"], button[onclick*="StaffApp.openModal"], button[onclick*="ExpensesApp.openModal"], [data-action="create"]'
        ).forEach(el => el.classList.add('hidden'));
      }
      if (!this.can(moduleName, 'edit')) {
        root.querySelectorAll(
          'button[onclick*="editCurrent"], button[onclick*="openTransactionModal"], button[onclick*="openPayment"], [data-action="edit"]'
        ).forEach(el => el.classList.add('hidden'));
      }
      if (!this.can(moduleName, 'delete')) {
        root.querySelectorAll(
          'button[onclick*="deleteCurrent"], button[onclick*="confirmDelete"], button[onclick*="openDelete"], [data-action="delete"]'
        ).forEach(el => el.classList.add('hidden'));
      }
    },

    showDenied: function(message, email, opts) {
      const options = opts || {};
      const boot = document.getElementById('app-boot-overlay');
      const denied = document.getElementById('app-access-denied');
      const msg = document.getElementById('access-denied-message');
      const emailEl = document.getElementById('access-denied-email');
      const title = document.getElementById('access-denied-title');
      const icon = document.getElementById('access-denied-icon');
      const fixBox = document.getElementById('access-denied-fix');
      const fixText = document.getElementById('access-denied-fix-text');
      if (boot) boot.classList.add('hidden');
      if (denied) denied.classList.remove('hidden');
      if (msg) msg.textContent = message || 'You do not have access to this application.';
      if (emailEl) emailEl.textContent = email ? ('Account: ' + email) : '';

      const needsLink = !!options.showLogin;
      if (title) title.textContent = needsLink ? 'Open your invitation link' : 'Access denied';
      if (icon) {
        icon.className = needsLink
          ? 'w-12 h-12 mx-auto rounded-xl bg-red-50 text-brand-primary flex items-center justify-center'
          : 'w-12 h-12 mx-auto rounded-xl bg-red-50 text-red-500 flex items-center justify-center';
        icon.innerHTML = '<span class="material-symbols-rounded text-[26px]">' + (needsLink ? 'mail' : 'lock') + '</span>';
      }
      if (fixBox && fixText) {
        if (options.fix) {
          fixText.textContent = options.fix;
          fixBox.classList.remove('hidden');
        } else {
          fixBox.classList.add('hidden');
        }
      }
    },

    hideBoot: function() {
      const boot = document.getElementById('app-boot-overlay');
      if (boot) boot.classList.add('hidden');
      const denied = document.getElementById('app-access-denied');
      if (denied) denied.classList.add('hidden');
    },

    updateSetupBanner: function() {
      const banner = document.getElementById('app-setup-banner');
      if (!banner) return;
      const setup = this.session && this.session.setup;
      const show = !!(this.session && this.session.allowed && this.can('settings', 'edit') && setup && setup.needsSetup);
      if (show) banner.classList.remove('hidden');
      else banner.classList.add('hidden');
    },

    applySession: function(data, callback) {
      if (!data) {
        this.showDenied('Could not load session.', '', {
          showLogin: true,
          fix: 'Hard-refresh the latest /exec URL. If this continues, ask the owner to redeploy the web app.'
        });
        if (callback) callback(null);
        return;
      }
      if (data.sessionToken && window.LSC_AUTH) {
        window.LSC_AUTH.setToken(data.sessionToken);
      }
      this.session = data;
      window.LSC_SESSION = data;
      if (typeof TableColumns !== 'undefined') TableColumns.hydrate(data.tableColumns);
      if (!data.allowed) {
        this.showDenied(data.error, data.email, {
          showLogin: !!data.needsLogin || !data.email,
          fix: data.fix || ''
        });
        if (callback) callback(data);
        return;
      }
      this.hideBoot();
      this.updateSetupBanner();
      if (callback) callback(data);
    },

    INVITE_KEY: 'lsc_invite_token',

    getStoredInvite: function() {
      try { return localStorage.getItem(this.INVITE_KEY) || ''; } catch (e) { return ''; }
    },

    storeInvite: function(token) {
      try {
        if (token) localStorage.setItem(this.INVITE_KEY, token);
        else localStorage.removeItem(this.INVITE_KEY);
      } catch (e) { /* storage unavailable */ }
    },

    // Opens the app from the personal link (?t=...) or from the link remembered on this device.
    redeemInvite: function(token, fromUrl, callback) {
      const done = (ok) => { if (callback) callback(ok); };
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.success && res.data && res.data.allowed) {
            this.storeInvite(token);
            this.applySession(res.data, () => done(true));
            return;
          }
          this.storeInvite('');
          if (fromUrl) {
            this.showDenied(
              (res && res.error) || 'This invitation link could not be used.',
              '',
              { showLogin: true, fix: (res && res.fix) || 'Ask your admin to send you a new invitation.' }
            );
          }
          done(false);
        })
        .withFailureHandler((err) => {
          if (fromUrl) {
            this.showDenied(
              err && err.message ? err.message : 'This invitation link could not be used.',
              '',
              { showLogin: true, fix: 'Check your connection and open the link again.' }
            );
          }
          done(false);
        })
        .api_redeemInviteToken(token);
    },

    loadSession: function(callback) {
      const finish = (session) => {
        if (callback) callback(session);
      };

      const loadNormal = () => {
        google.script.run
          .withSuccessHandler((res) => {
            if (!res || !res.success || !res.data) {
              this.showDenied((res && res.error) || 'Could not load session.', '', {
                showLogin: true,
                fix: (res && res.fix) || 'Open the link from your invitation email.'
              });
              finish(null);
              return;
            }
            if (!res.data.allowed && res.data.needsLogin) {
              const stored = this.getStoredInvite();
              if (stored) {
                this.redeemInvite(stored, false, (ok) => {
                  if (ok) finish(this.session);
                  else this.applySession(res.data, finish);
                });
                return;
              }
            }
            this.applySession(res.data, finish);
          })
          .withFailureHandler((err) => {
            this.showDenied(err && err.message ? err.message : 'Session check failed.', '', {
              showLogin: true,
              fix: 'Open the link from your invitation email. If you see a Google “need access” page, ask your admin to resend the invitation.'
            });
            finish(null);
          })
          .api_getSession();
      };

      const params = window.LSC_PAGE_PARAMS || {};
      const urlToken = String(params.t || params.invite || '').trim();
      if (urlToken) {
        this.redeemInvite(urlToken, true, (ok) => finish(ok ? this.session : null));
        return;
      }

      if (window.LSC_AUTH && window.LSC_AUTH.getToken()) {
        google.script.run
          .withSuccessHandler((res) => {
            if (res && res.success && res.data && res.data.allowed) {
              this.applySession(res.data, finish);
              return;
            }
            if (window.LSC_AUTH) window.LSC_AUTH.clear();
            loadNormal();
          })
          .withFailureHandler(() => {
            if (window.LSC_AUTH) window.LSC_AUTH.clear();
            loadNormal();
          })
          .api_getSession();
        return;
      }

      loadNormal();
    }
  };

  const AppState = {
    currentView: '',
    booted: false,
    
    init: function() {
      AccessControl.loadSession((session) => {
        if (!session || !session.allowed) return;
        this.bootFromSession(session);
      });
    },

    bootFromSession: function(session) {
      if (this.booted) return;
      if (!session || !session.allowed) return;
      this.booted = true;

        // Prefetch years in the background (modules can render with current year immediately).
        AppUtils.loadAvailableYears();

        // 1. Inject static layout components from templates
        this.injectTemplate('tpl-comp-sidebar', 'desktop-nav-container');
        this.injectTemplate('tpl-comp-bottom-nav', 'mobile-nav-container');
        AccessControl.applyNavVisibility();

        // Branding comes with the session payload — no extra API round-trip.
        AppUtils.applySessionBranding(session);

        const openSetupBtn = document.getElementById('btn-open-setup');
        if (openSetupBtn) {
          openSetupBtn.onclick = () => {
            window.location.hash = '#settings';
            this.route('settings');
          };
        }

        // 2. Delegate click handler on .nav-btn for instant SPA navigation & highlighting
        document.addEventListener('click', (e) => {
          const btn = e.target.closest('.nav-btn');
          if (btn) {
            const route = btn.getAttribute('data-route');
            if (route) {
              e.preventDefault();
              const canRoute = route === 'expenses'
                ? (AccessControl.can('expenses', 'view') || AccessControl.can('staff', 'view'))
                : AccessControl.can(route, 'view');
              if (!canRoute) {
                if (typeof Toast !== 'undefined') Toast.error('You do not have access to this page.');
                return;
              }
              if (window.location.hash !== '#' + route) {
                window.location.hash = '#' + route;
              }
              this.route(route);
            }
          }
        });

        // 3. Listen for URL hash changes for browser history & external triggers
        window.addEventListener('hashchange', () => this.route());
        
        // 4. Trigger initial route or default to first allowed module
        const preferred = AccessControl.firstAllowedRoute() || 'dashboard';
        if (!window.location.hash) {
          window.location.hash = '#' + preferred;
        }
        this.route();
    },
    
    injectTemplate: function(templateId, targetId) {
      const tpl = document.getElementById(templateId);
      const target = document.getElementById(targetId);
      if (tpl && target) {
        target.innerHTML = tpl.innerHTML;
      }
    },

    route: function(forcedView) {
      const hash = forcedView ? ('#' + forcedView) : (window.location.hash || '#dashboard');
      let viewName = hash.replace('#', '') || 'dashboard';

      // Staff lives under Expenses (Staff & Payroll tab)
      if (viewName === 'staff') {
        try { sessionStorage.setItem('lsc_expenses_tab', 'staff'); } catch (e) {}
        viewName = 'expenses';
        if (window.location.hash !== '#expenses') {
          window.location.hash = '#expenses';
          return;
        }
      }

      if (typeof AccessControl !== 'undefined' && AccessControl.session && AccessControl.session.allowed) {
        const canView = viewName === 'expenses'
          ? (AccessControl.can('expenses', 'view') || AccessControl.can('staff', 'view'))
          : AccessControl.can(viewName, 'view');
        if (!canView) {
          const fallback = AccessControl.firstAllowedRoute();
          if (!fallback) {
            AccessControl.showDenied('You do not have permission to view any modules.', AccessControl.session.email);
            return;
          }
          viewName = fallback;
          if (window.location.hash !== '#' + fallback) {
            window.location.hash = '#' + fallback;
          }
        }
      }

      // Always update navigation highlight immediately for fast UI feedback
      this.updateNavHighlight(viewName);

      const root = document.getElementById('app-root');
      if (this.currentView === viewName && root && root.children.length > 0) {
        if (viewName === 'expenses' && typeof ExpensesHub !== 'undefined') {
          ExpensesHub.applyStoredTab();
        }
        return;
      }
      this.currentView = viewName;

      const tplId = 'tpl-view-' + viewName;
      const tpl = document.getElementById(tplId);
      
      if (tpl && root) {
         // Apply fade animation class (from Global_Styles)
         root.classList.add('fade-enter');
         root.innerHTML = tpl.innerHTML;
         
         // Trigger DOM reflow and remove fade class to animate in
         requestAnimationFrame(() => {
           root.classList.add('fade-enter-active');
           setTimeout(() => {
             root.classList.remove('fade-enter', 'fade-enter-active');
           }, 300);
         });

         this.executeScripts(root);
         if (typeof AccessControl !== 'undefined') {
           if (viewName === 'expenses') {
             AccessControl.applyActionGates(root, 'expenses');
             AccessControl.applyActionGates(root, 'staff');
           } else {
             AccessControl.applyActionGates(root, viewName);
           }
         }
      } else if (root) {
         root.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-slate-400">
            <span class="material-symbols-rounded text-5xl mb-2 opacity-50">build</span>
            <h2 class="text-lg font-medium text-slate-600">Module Under Construction</h2>
          </div>`;
      }
    },

    // When injecting HTML via innerHTML, <script> tags do not run automatically.
    // This function rebuilds and forces them to execute.
    executeScripts: function(element) {
      const scripts = element.querySelectorAll('script');
      scripts.forEach(oldScript => {
        const newScript = document.createElement('script');
        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
    },

    updateNavHighlight: function(viewName) {
      // Reset all buttons
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-brand-primary', 'bg-slate-800', 'bg-white/10');
        btn.classList.add('text-slate-400');
      });

      // Highlight active button based on current route
      document.querySelectorAll(`[data-route="${viewName}"]`).forEach(btn => {
        btn.classList.remove('text-slate-400');
        btn.classList.add('text-brand-primary');
        // If it's a desktop sidebar button, give it a soft brand wash
        if(btn.closest('aside')) {
           btn.classList.add('bg-white/10');
        }
      });
    }
  };

  var TableColumns = {
    hidden: {},
    defs: {
      members: [
        { id: 'profile', label: 'Member Profile', locked: true },
        { id: 'plan', label: 'Membership & Batch' },
        { id: 'financials', label: 'Financials & Dates' },
        { id: 'status', label: 'Status' },

      ],
      staff: [
        { id: 'name', label: 'Name', locked: true },
        { id: 'role', label: 'Role' },

      ],
      'exp-all': [

      ],
      'exp-expenses': [
        { id: 'date', label: 'Date', locked: true },
        { id: 'category', label: 'Category' },
        { id: 'description', label: 'Description' },
        { id: 'amount', label: 'Amount' },
        { id: 'addedBy', label: 'Added By' },
        { id: 'actions', label: 'Actions', locked: true }
      ],
      overdue: [

        { id: 'amount', label: 'Amount' },
        { id: 'date', label: 'Due Date' },
        { id: 'days', label: 'Days Overdue' },
        { id: 'notify', label: 'Notify', locked: true }
      ],
      upcoming: [
        { id: 'member', label: 'Member', locked: true },
        { id: 'plan', label: 'Plan' },
        { id: 'amount', label: 'Amount' },
        { id: 'date', label: 'Due Date' },
        { id: 'days', label: 'Days Left' },
        { id: 'notify', label: 'Notify', locked: true }
      ]
    },
    saveTimer: null,
    hydrate: function(map) {
      this.hidden = (map && typeof map === 'object') ? map : {};
      this.applyAll();
    },
    isHidden: function(table, col) {
      const list = this.hidden[table] || [];
      return list.indexOf(col) >= 0;
    },
    apply: function(table) {
      const self = this;
      document.querySelectorAll('[data-lsc-table="' + table + '"]').forEach(function(el) {
        const col = el.getAttribute('data-col');
        if (self.isHidden(table, col)) el.setAttribute('data-col-hidden', '1');
        else el.removeAttribute('data-col-hidden');
      });
    },
    applyAll: function() {
      const self = this;
      Object.keys(this.defs).forEach(function(table) { self.apply(table); });
    },
    openExpenses: function(btn) {
      const tab = (typeof ExpensesHub !== 'undefined' && ExpensesHub.currentListTab) || 'all';
      const map = { all: 'exp-all', staff: 'staff', expenses: 'exp-expenses' };
      this.open(map[tab] || 'exp-all', btn);
    },
    open: function(table, btn) {
      const cols = this.defs[table];
      if (!cols) return;
      this.close();
      const panel = document.createElement('div');
      panel.id = 'lsc-col-menu';
      panel.className = 'fixed z-[10070] bg-white border border-slate-200 rounded-xl shadow-xl p-2 w-56';
      const self = this;
      panel.innerHTML = '<p class="px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-400">Columns</p>' +
        cols.map(function(col) {
          const checked = col.locked || !self.isHidden(table, col.id);
          return '<label class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 text-xs font-semibold text-slate-700 ' + (col.locked ? 'opacity-70' : 'cursor-pointer') + '">' +
            '<input type="checkbox" ' + (checked ? 'checked' : '') + (col.locked ? ' disabled' : '') +
            ' data-col-id="' + col.id + '" class="rounded border-slate-300 text-brand-primary">' +
            '<span>' + col.label + '</span></label>';
        }).join('');
      document.body.appendChild(panel);
      const rect = btn.getBoundingClientRect();
      const width = 224;
      let left = Math.min(rect.left, window.innerWidth - width - 8);
      left = Math.max(8, left);
      let top = rect.bottom + 6;
      if (top + 280 > window.innerHeight) top = Math.max(8, rect.top - 8 - panel.offsetHeight);
      panel.style.left = left + 'px';
      panel.style.top = top + 'px';
      panel.querySelectorAll('input[data-col-id]').forEach(function(input) {
        input.addEventListener('change', function() {
          self.toggle(table, input.getAttribute('data-col-id'), input.checked);
        });
      });
      setTimeout(function() {
        document.addEventListener('mousedown', TableColumns._outside, true);
      }, 0);
    },
    _outside: function(event) {
      const panel = document.getElementById('lsc-col-menu');
      if (!panel || panel.contains(event.target)) return;
      TableColumns.close();
    },
    close: function() {
      const panel = document.getElementById('lsc-col-menu');
      if (panel) panel.remove();
      document.removeEventListener('mousedown', TableColumns._outside, true);
    },
    toggle: function(table, colId, visible) {
      const def = (this.defs[table] || []).filter(function(col) { return col.id === colId; })[0];
      if (!def || def.locked) return;
      let list = (this.hidden[table] || []).slice();
      if (visible) list = list.filter(function(id) { return id !== colId; });
      else if (list.indexOf(colId) < 0) list.push(colId);
      this.hidden[table] = list;
      this.apply(table);
      this.queueSave();
    },
    queueSave: function() {
      const self = this;
      clearTimeout(this.saveTimer);
      this.saveTimer = setTimeout(function() { self.save(); }, 250);
    },
    save: function() {
      if (window.LSC_SESSION) window.LSC_SESSION.tableColumns = this.hidden;
      if (typeof google === 'undefined' || !google.script || !google.script.run) return;
      google.script.run.api_saveMyTableColumns(this.hidden);
    }
  };
  window.TableColumns = TableColumns;

  (function() {
    var timer = null;
    function schedule() {
      clearTimeout(timer);
      timer = setTimeout(function() {
        if (window.TableColumns) TableColumns.applyAll();
      }, 40);
    }
    function start() {
      if (!document.body) return;
      new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();

  (function() {
    function placeTip(tip, bubble) {
      var icon = tip.querySelector('.metric-tip-icon') || tip;
      var rect = icon.getBoundingClientRect();
      var margin = 8;
      var width = Math.min(240, window.innerWidth - 16);
      bubble.style.width = width + 'px';
      bubble.classList.add('is-open');
      var bubbleH = bubble.offsetHeight || 72;
      var left = rect.left + (rect.width / 2) - (width / 2);
      left = Math.max(margin, Math.min(left, window.innerWidth - width - margin));
      var spaceBelow = window.innerHeight - rect.bottom;
      var top;
      if (spaceBelow < bubbleH + 16 && rect.top > bubbleH + 16) {
        top = rect.top - bubbleH - 10;
        bubble.classList.add('tip-above');
      } else {
        top = rect.bottom + 10;
        bubble.classList.remove('tip-above');
      }
      top = Math.max(margin, Math.min(top, window.innerHeight - bubbleH - margin));
      bubble.style.left = left + 'px';
      bubble.style.top = top + 'px';
      var arrowX = rect.left + (rect.width / 2) - left;
      arrowX = Math.max(14, Math.min(arrowX, width - 14));
      bubble.style.setProperty('--tip-arrow', arrowX + 'px');
    }
    function hideTip(bubble) {
      if (!bubble) return;
      bubble.classList.remove('is-open', 'tip-above');
      if (bubble._tipHome && bubble.parentNode !== bubble._tipHome) bubble._tipHome.appendChild(bubble);
    }
    function bubbleFor(tip) {
      var bubble = tip.querySelector('.metric-tip-bubble');
      if (bubble) return bubble;
      var nodes = document.querySelectorAll('.metric-tip-bubble');
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i]._tipHome === tip) return nodes[i];
      }
      return null;
    }
    function showTip(tip) {
      var bubble = bubbleFor(tip);
      if (!bubble) return;
      document.querySelectorAll('.metric-tip-bubble.is-open').forEach(function(open) {
        if (open !== bubble) hideTip(open);
      });
      bubble._tipHome = tip;
      document.body.appendChild(bubble);
      placeTip(tip, bubble);
    }
    document.addEventListener('pointerover', function(event) {
      var tip = event.target && event.target.closest ? event.target.closest('.metric-tip') : null;
      if (!tip || tip.contains(event.relatedTarget)) return;
      showTip(tip);
    });
    document.addEventListener('pointerout', function(event) {
      var tip = event.target && event.target.closest ? event.target.closest('.metric-tip') : null;
      if (!tip || tip.contains(event.relatedTarget)) return;
      var bubble = bubbleFor(tip);
      if (bubble) hideTip(bubble);
    });
    document.addEventListener('focusin', function(event) {
      var tip = event.target && event.target.closest ? event.target.closest('.metric-tip') : null;
      if (tip) showTip(tip);
    });
    document.addEventListener('focusout', function(event) {
      var tip = event.target && event.target.closest ? event.target.closest('.metric-tip') : null;
      if (!tip) return;
      var bubble = bubbleFor(tip);
      if (bubble) hideTip(bubble);
    });
  })();

  // Boot the app when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => AppState.init());
  } else {
    AppState.init();
  }
