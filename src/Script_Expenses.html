<script>
  var ExpensesApp = {
    allData: [],
    filteredData: [], 
    tableData: [],    
    dropdowns: {},
    
    isDropdownsLoaded: false,
    isExpensesLoaded: false,
    isYearsLoaded: false,
    
    months: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
    quarters: ['Q1', 'Q2', 'Q3', 'Q4'],
    selectedPeriods: [],
    
    sortColumn: 'date',
    sortAsc: false,
    
    chartInstances: {},
    expenseToDelete: null,
    colorMap: ['#3b82f6', '#f59e0b', '#10b981', '#8b5cf6', '#ef4444', '#06b6d4', '#f97316', '#64748b'],

    pageSize: 50,
    renderedCount: 0,
    isLoadingMore: false,
    scrollListenerBound: false,

    init: function() {
      this.isDropdownsLoaded = false;
      this.isExpensesLoaded = false;
      this.isYearsLoaded = false;
      this.selectedPeriods = [...this.months];

      // Seed year select immediately; refresh list when full years arrive.
      AppUtils.populateYearSelect('exp-filter-year');
      this.isYearsLoaded = true;
      AppUtils.loadAvailableYears(() => {
        AppUtils.populateYearSelect('exp-filter-year');
      });
      
      this.renderCheckboxes();
      this.updateMultiSelectLabel();
      this.showShimmer();
      this.initDatePickers();

      google.script.run
        .withSuccessHandler((res) => {
           this.onDropdownsLoaded(res);
           this.isDropdownsLoaded = true;
           this.checkAndRender();
        })
        .withFailureHandler((err) => {
           console.error('api_getGlobalDropdowns failed:', err);
           this.dropdowns = this.dropdowns || {};
           this.dropdowns.expenseCats = [];
           this.isDropdownsLoaded = true;
           this.checkAndRender();
        })
        .api_getGlobalDropdowns();
        
      google.script.run
        .withSuccessHandler((res) => {
           this.onDataLoaded(res);
           this.isExpensesLoaded = true;
           this.checkAndRender();
        })
        .withFailureHandler((err) => {
           console.error('api_getExpenses failed:', err);
           this.onDataLoaded({ success: false, error: err.message || 'Failed to load expenses.' });
           this.isExpensesLoaded = true;
           this.checkAndRender();
        })
        .api_getExpenses();

      document.addEventListener('click', (e) => {
        const menu = document.getElementById('exp-multi-select-menu');
        const btn = document.getElementById('exp-multi-select-label')?.parentElement;
        if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
          menu.classList.add('hidden');
        }
      });
    },

    checkAndRender: function() {
      if (this.isDropdownsLoaded && this.isExpensesLoaded && this.isYearsLoaded) {
          this.applyGlobalFilters();
      }
    },

    initDatePickers: function() {
      flatpickr(".date-field", {
        dateFormat: "d-M-Y",    
        allowInput: true,
        disableMobile: "true"   
      });
    },

    setDatePicker: function(id, dateObjOrStr) {
      const el = document.getElementById(id);
      if (el && el._flatpickr) {
        el._flatpickr.setDate(dateObjOrStr);
      } else if (el) {
        el.value = dateObjOrStr; 
      }
    },

    formatDateDDMMMYYYY: AppUtils.formatDateDDMMMYYYY,
    parseToISODate: AppUtils.parseToISODate,

    showShimmer: function() {
      let dHtml = '';
      for(let i=0; i<5; i++){ dHtml += `<tr><td colspan="6" class="px-4 py-4"><div class="h-6 w-full shimmer rounded"></div></td></tr>`; }
      const tb = document.getElementById('desktop-expense-body');
      if(tb) tb.innerHTML = dHtml;
      
      const mc = document.getElementById('mobile-expense-container');
      if(mc) mc.innerHTML = `<div class="p-4 bg-white rounded-xl shadow-sm"><div class="h-10 w-full shimmer rounded"></div></div>`;
      
      if(this.chartInstances.trend) { try { this.chartInstances.trend.destroy(); } catch(e){} this.chartInstances.trend = null; }
      if(this.chartInstances.breakdown) { try { this.chartInstances.breakdown.destroy(); } catch(e){} this.chartInstances.breakdown = null; }
      if(this.chartInstances.misc) { try { this.chartInstances.misc.destroy(); } catch(e){} this.chartInstances.misc = null; }
      
      const trEl = document.getElementById('chart-expense-trend');
      if(trEl) trEl.innerHTML = `<div class="w-full h-full shimmer opacity-40 rounded-lg"></div>`;
      const brEl = document.getElementById('chart-expense-breakdown');
      if(brEl) brEl.innerHTML = `<div class="w-full h-full shimmer opacity-40 rounded-lg"></div>`;
      const msEl = document.getElementById('chart-expense-misc');
      if(msEl) msEl.innerHTML = `<div class="w-full h-full shimmer opacity-40 rounded-lg"></div>`;
    },

    parseAmount: AppUtils.parseAmount,

    onDropdownsLoaded: function(response) {
      if (!response || !response.success) {
        this.dropdowns = this.dropdowns || {};
        this.dropdowns.expenseCats = this.dropdowns.expenseCats || [];
        return;
      }
      this.dropdowns = response.data?.options || {};
      
      const expenseCats = this.dropdowns.expensecategory || this.dropdowns.expense_category || this.dropdowns.expense || this.dropdowns.categories || [];
      this.dropdowns.expenseCats = Array.isArray(expenseCats) ? expenseCats : [];
      
      this.populateSelect('exp-category', this.dropdowns.expenseCats, null, "Select Category");
      this.populateSelect('filter-table-cat', this.dropdowns.expenseCats, null, "All Categories", true);
    },

    populateSelect: function(elementId, optionsArray, secondaryLabel = null, defaultText = "Select Option...", isFilter = false) {
      const el = document.getElementById(elementId);
      if(!el) return;
      let html = isFilter ? `<option value="All">${defaultText}</option>` : `<option value="" disabled selected>${defaultText}</option>`;
      
      if (Array.isArray(optionsArray)) {
        optionsArray.forEach(opt => {
          const label = secondaryLabel && opt[secondaryLabel] ? `${opt.name} (${opt[secondaryLabel]})` : opt.name;
          html += `<option value="${opt.id}">${label}</option>`;
        });
      }
      el.innerHTML = html;
    },

    getName: function(id) {
      if(!id || !this.dropdowns.expenseCats) return id || 'N/A';
      const match = this.dropdowns.expenseCats.find(item => item && item.id === id);
      if (!match) return id;
      return match.name || match.category || match.label || match.id || id;
    },

    getColor: function(idx) { return this.colorMap[idx % this.colorMap.length]; },

    fetchData: function() {
      google.script.run
        .withSuccessHandler((res) => {
           this.onDataLoaded(res);
           this.applyGlobalFilters();
        })
        .api_getExpenses();
    },

    onDataLoaded: function(response) {
      if (!response || !response.success) {
        const errMsg = (response && response.error) || 'Failed to load expenses.';
        const tb = document.getElementById('desktop-expense-body');
        if(tb) tb.innerHTML = `<tr><td colspan="6" class="text-center text-red-500 py-8">${errMsg}</td></tr>`;
        const mc = document.getElementById('mobile-expense-container');
        if(mc) mc.innerHTML = `<div class="bg-white p-6 text-center text-xs text-red-500 rounded-xl border border-red-200">${errMsg}</div>`;
        Toast.error('Failed to load expenses.');
        return;
      }
      
      this.allData = response.data || [];
      this.salaries = response.salaries || [];
      this.staffMetrics = response.staffMetrics || {};
      if (response.currencyFormat) {
        AppUtils.setCurrencyFormat(response.currencyFormat);
      }
      
    },

    handleModeSwitch: function() {
      const mode = document.getElementById('exp-filter-mode').value;
      this.selectedPeriods = mode === 'Monthly' ? [...this.months] : [...this.quarters];
      this.renderCheckboxes();
      this.updateMultiSelectLabel();
      this.applyGlobalFilters();
    },

    renderCheckboxes: function() {
      const mode = document.getElementById('exp-filter-mode').value;
      const options = mode === 'Monthly' ? this.months : this.quarters;
      const menu = document.getElementById('exp-multi-select-menu');
      const allSelected = this.selectedPeriods.length === options.length;

      let html = `<label class="flex items-center gap-2 px-3 py-2 hover:bg-slate-50 cursor-pointer rounded text-xs font-bold text-slate-800 border-b border-slate-100 mb-1"><input type="checkbox" onchange="ExpensesApp.toggleAllPeriods(this)" ${allSelected ? 'checked' : ''} class="accent-brand-primary w-3.5 h-3.5 rounded border-slate-300">Select All</label>`;
      options.forEach(opt => {
        const isChecked = this.selectedPeriods.includes(opt) ? 'checked' : '';
        html += `<label class="flex items-center gap-2 px-3 py-2 hover:bg-slate-50 cursor-pointer rounded text-xs text-slate-700"><input type="checkbox" value="${opt}" ${isChecked} onchange="ExpensesApp.togglePeriod(this)" class="accent-brand-primary w-3.5 h-3.5 rounded border-slate-300">${opt}</label>`;
      });
      menu.innerHTML = html;
    },

    toggleAllPeriods: function(checkbox) {
      const mode = document.getElementById('exp-filter-mode').value;
      const options = mode === 'Monthly' ? this.months : this.quarters;
      this.selectedPeriods = checkbox.checked ? [...options] : [options[0]]; 
      this.updateMultiSelectLabel();
      this.renderCheckboxes();
      this.applyGlobalFilters();
    },

    togglePeriod: function(checkbox) {
      if (checkbox.checked) { this.selectedPeriods.push(checkbox.value); } 
      else { this.selectedPeriods = this.selectedPeriods.filter(v => v !== checkbox.value); }
      
      const mode = document.getElementById('exp-filter-mode').value;
      const options = mode === 'Monthly' ? this.months : this.quarters;
      this.selectedPeriods.sort((a, b) => options.indexOf(a) - options.indexOf(b));
      if (this.selectedPeriods.length === 0) this.selectedPeriods = [options[0]]; 
      
      this.updateMultiSelectLabel();
      this.renderCheckboxes();
      this.applyGlobalFilters(); 
    },

    updateMultiSelectLabel: function() {
      const labelEl = document.getElementById('exp-multi-select-label');
      if (!labelEl) return;
      const mode = document.getElementById('exp-filter-mode').value;
      const maxLen = mode === 'Monthly' ? 12 : 4;
      if (this.selectedPeriods.length === maxLen) { labelEl.innerText = "All Selected"; } 
      else if (this.selectedPeriods.length <= 3) { labelEl.innerText = this.selectedPeriods.join(', '); } 
      else { labelEl.innerText = `${this.selectedPeriods.slice(0, 3).join(', ')} +${this.selectedPeriods.length - 3}`; }
    },

    applyGlobalFilters: function() {
      const year = document.getElementById('exp-filter-year')?.value;
      const mode = document.getElementById('exp-filter-mode')?.value;
      if (!year || !mode) return;
      
      this.filteredData = (this.allData || []).filter(exp => {
        if(!exp.date) return false;
        
        const d = new Date(this.parseToISODate(exp.date));
        if(isNaN(d)) return false;
        
        if (d.getFullYear().toString() !== year) return false;
        
        if (mode === 'Monthly') {
           return this.selectedPeriods.includes(this.months[d.getMonth()]);
        } else {
           return this.selectedPeriods.includes(this.quarters[Math.floor(d.getMonth() / 3)]);
        }
      });

      this.calculateKPIs();
      this.renderCharts();
      this.filterTable(); 
    },

    calculateKPIs: function() {
      let total = 0;
      let catSums = {};
      
      (this.filteredData || []).forEach(exp => {
        const amt = this.parseAmount(exp.amount);
        total += amt;
        catSums[exp.categoryId] = (catSums[exp.categoryId] || 0) + amt;
      });

      // Dynamic Title and Average Calculation
      const mode = document.getElementById('exp-filter-mode')?.value || 'Monthly';
      const isMonthly = mode === 'Monthly';
      const avgTitle = document.getElementById('kpi-avg-title');
      if (avgTitle) {
          avgTitle.innerText = isMonthly ? 'MONTHLY AVG' : 'QUARTERLY AVG';
      }

      // Calculate Staff Cost for the selected year and selected periods from staffMetrics
      const year = document.getElementById('exp-filter-year')?.value;
      let staffTotal = 0;
      const yearStaffMetrics = (this.staffMetrics && year) ? this.staffMetrics[year] : null;

      if (yearStaffMetrics) {
        this.selectedPeriods.forEach(p => {
          if (isMonthly) {
            const mIdx = this.months.indexOf(p);
            if (mIdx !== -1 && yearStaffMetrics.monthly[mIdx]) {
              staffTotal += yearStaffMetrics.monthly[mIdx];
            }
          } else {
            const qIdx = this.quarters.indexOf(p);
            if (qIdx !== -1 && yearStaffMetrics.quarterly[qIdx]) {
              staffTotal += yearStaffMetrics.quarterly[qIdx];
            }
          }
        });
      }

      // Also account for any direct expense categorized as staff/salary in EXPENSES
      if (this.dropdowns.expenseCats) {
        const staffCat = this.dropdowns.expenseCats.find(c => {
          if (!c || !c.name) return false;
          const n = c.name.toLowerCase();
          return n.includes('staff') || n.includes('trainer') || n.includes('salary');
        });
        if (staffCat && catSums[staffCat.id]) {
          staffTotal += catSums[staffCat.id];
        }
      }

      document.getElementById('kpi-staff-exp').innerText = AppUtils.formatCurrency(staffTotal);

      // Other operating expenses (excludes staff payroll metrics)
      const otherTotal = total;
      const otherEl = document.getElementById('kpi-other-exp');
      if (otherEl) otherEl.innerText = AppUtils.formatCurrency(otherTotal);

      // Total Outflow includes General Expenses + Staff Cost
      const grandTotal = total + staffTotal;
      document.getElementById('kpi-total-exp').innerText = AppUtils.formatCurrency(grandTotal);

      // Top category (considering both general categories and Staff Cost)
      let topCatName = '--';
      let topAmt = 0;
      for (const [catId, sum] of Object.entries(catSums)) {
         if (sum > topAmt) {
           topAmt = sum;
           topCatName = this.getName(catId);
         }
      }
      if (staffTotal > topAmt) {
        topAmt = staffTotal;
        topCatName = 'Staff Cost';
      }
      const topCatEl = document.getElementById('kpi-top-cat');
      const topAmtEl = document.getElementById('kpi-top-cat-amt');
      if (topCatEl) topCatEl.innerText = topCatName;
      if (topAmtEl) topAmtEl.innerText = AppUtils.formatCurrency(topAmt);

      const periodCount = this.selectedPeriods.length || 1;
      const avg = grandTotal / periodCount;
      document.getElementById('kpi-avg-exp').innerText = AppUtils.formatCurrency(avg);

      if (typeof ExpensesHub !== 'undefined') ExpensesHub.refreshAllRecords();
    },

    renderCharts: function() {
      const mode = document.getElementById('exp-filter-mode').value;
      const isMonthly = mode === 'Monthly';
      const chartType = document.getElementById('chart-type-toggle').value; // Read dynamic chart type
      
      const trendDataMap = {};
      this.selectedPeriods.forEach(p => trendDataMap[p] = 0);

      let catSums = {};
      let miscSums = {}; 

      (this.filteredData || []).forEach(exp => {
         const amt = this.parseAmount(exp.amount);
         const d = new Date(this.parseToISODate(exp.date));
         if(!isNaN(d)) {
             const expMonthIdx = d.getMonth();
             const key = isMonthly ? this.months[expMonthIdx] : this.quarters[Math.floor(expMonthIdx / 3)];
             if(trendDataMap[key] !== undefined) trendDataMap[key] += amt;
         }

         const cName = String(this.getName(exp.categoryId) || 'N/A');
         catSums[cName] = (catSums[cName] || 0) + amt;

         if (cName.toLowerCase().includes('misc') || cName.toLowerCase().includes('other')) {
             const label = exp.whatMisc ? exp.whatMisc : 'Unspecified';
             miscSums[label] = (miscSums[label] || 0) + amt;
         }
      });

      // Integrate Staff Cost into Trend and Category Breakdown
      const year = document.getElementById('exp-filter-year')?.value;
      const yearStaffMetrics = (this.staffMetrics && year) ? this.staffMetrics[year] : null;
      let staffTotal = 0;

      if (yearStaffMetrics) {
        this.selectedPeriods.forEach(p => {
          let sAmt = 0;
          if (isMonthly) {
            const mIdx = this.months.indexOf(p);
            if (mIdx !== -1 && yearStaffMetrics.monthly[mIdx]) sAmt = yearStaffMetrics.monthly[mIdx];
          } else {
            const qIdx = this.quarters.indexOf(p);
            if (qIdx !== -1 && yearStaffMetrics.quarterly[qIdx]) sAmt = yearStaffMetrics.quarterly[qIdx];
          }
          staffTotal += sAmt;
        });
      }

      if (staffTotal > 0) {
        catSums['Staff Cost'] = (catSums['Staff Cost'] || 0) + staffTotal;
      }

      // Dual series: Staff Cost + Other Expenses (trendDataMap is other-only)
      const categories = Object.keys(trendDataMap);
      const otherSeries = categories.map(p => trendDataMap[p] || 0);
      const staffSeries = categories.map(p => {
        let sAmt = 0;
        if (yearStaffMetrics) {
          if (isMonthly) {
            const mIdx = this.months.indexOf(p);
            if (mIdx !== -1 && yearStaffMetrics.monthly[mIdx]) sAmt = yearStaffMetrics.monthly[mIdx];
          } else {
            const qIdx = this.quarters.indexOf(p);
            if (qIdx !== -1 && yearStaffMetrics.quarterly[qIdx]) sAmt = yearStaffMetrics.quarterly[qIdx];
          }
        }
        return sAmt;
      });

      // 1. Trend Chart (stacked Staff + Other)
      const trendOpts = {
        series: [
          { name: 'Staff Cost', data: staffSeries },
          { name: 'Other Expenses', data: otherSeries }
        ],
        chart: { type: chartType === 'bar' ? 'bar' : chartType, height: '100%', toolbar: { show: false }, stacked: chartType === 'bar' },
        plotOptions: { bar: { borderRadius: 4, columnWidth: '45%', borderRadiusApplication: 'end' } },
        stroke: { curve: 'smooth', width: chartType === 'bar' ? 0 : 3 },
        markers: { size: chartType === 'bar' ? 0 : 3 },
        dataLabels: { 
          enabled: chartType === 'bar', 
          formatter: function (val) { return val ? AppUtils.formatCompactCurrency(val) : ""; },
          style: { fontSize: '10px', fontWeight: 600, colors: ['#0f172a'] },
          background: { enabled: true, foreColor: '#ffffff', borderRadius: 4, padding: 2, opacity: 0.9, borderWidth: 0 },
          offsetY: -6
        },
        legend: { position: 'top', horizontalAlign: 'right', fontSize: '11px' },
        xaxis: { categories: categories, axisBorder: { show: false }, axisTicks: { show: false }, labels: { style: { fontSize: '11px', colors: '#64748b' } } },
        yaxis: { labels: { formatter: (val) => AppUtils.formatCurrency(val), style: { fontSize: '11px', colors: '#64748b' } } },
        tooltip: { y: { formatter: (val) => AppUtils.formatCurrency(val) } },
        colors: ['#8b5cf6', '#f59e0b'],
        grid: { borderColor: '#f1f5f9', strokeDashArray: 4, padding: { top: 24, right: 10, left: 10, bottom: 4 } }
      };

      document.getElementById("chart-expense-trend").innerHTML = "";
      if(this.chartInstances.trend) this.chartInstances.trend.destroy();
      this.chartInstances.trend = new ApexCharts(document.querySelector("#chart-expense-trend"), trendOpts);
      this.chartInstances.trend.render();

      // 2. Category Breakdown Chart (Consistent Data Labels)
      const bLabels = Object.keys(catSums);
      const bSeries = Object.values(catSums);
      const bColors = bLabels.map((l, i) => l === 'Staff Cost' ? '#8b5cf6' : this.getColor(i));
      const totalAmt = bSeries.reduce((a,b)=>a+b, 0);

      const breakOpts = {
        series: bSeries,
        labels: bLabels,
        chart: { type: 'donut', height: '100%' },
        colors: bColors.length ? bColors : ['#e2e8f0'],
        plotOptions: { pie: { donut: { size: '65%', labels: { show: true, total: { show: true, label: 'Total', fontSize: '14px', fontWeight: 600, formatter: () => AppUtils.formatCurrency(totalAmt) } } } } },
        legend: { position: 'right', fontSize: '11px', offsetY: 20 },
        dataLabels: { enabled: true, formatter: function (val, opts) { return AppUtils.formatCompactCurrency(opts.w.globals.seriesTotals[opts.seriesIndex]); }, style: { fontSize: '11px', fontWeight: 600 }, dropShadow: { enabled: false } },
        tooltip: { y: { formatter: (val) => AppUtils.formatCurrency(val) } }
      };

      document.getElementById("chart-expense-breakdown").innerHTML = "";
      if(this.chartInstances.breakdown) this.chartInstances.breakdown.destroy();
      this.chartInstances.breakdown = new ApexCharts(document.querySelector("#chart-expense-breakdown"), breakOpts);
      this.chartInstances.breakdown.render();

      // Misc chart optional (hidden wrapper by default in unified layout)
      const miscWrapper = document.getElementById("chart-misc-wrapper");
      if (miscWrapper) miscWrapper.classList.add('hidden');
    },

    sortTable: function(column) {
      if (this.sortColumn === column) {
        this.sortAsc = !this.sortAsc;
      } else {
        this.sortColumn = column;
        this.sortAsc = true;
      }
      this.updateSortIcons();
      this.renderTable();
    },

    updateSortIcons: function() {
      ['date', 'category', 'amount'].forEach(col => {
        const icon = document.getElementById(`sort-icon-${col}`);
        if(icon) {
          if (this.sortColumn === col) {
            icon.classList.remove('text-transparent');
            icon.classList.add('text-slate-500');
            icon.innerText = this.sortAsc ? 'arrow_upward' : 'arrow_downward';
          } else {
            icon.classList.remove('text-slate-500');
            icon.classList.add('text-transparent');
          }
        }
      });
    },

    _debouncedFilterTable: null,
    searchTable: function(query) {
      this.tableSearchQuery = query.toLowerCase().trim();
      if (!this._debouncedFilterTable) {
        this._debouncedFilterTable = AppUtils.debounce(() => this.filterTable(), 150);
      }
      this._debouncedFilterTable();
    },

    filterTable: function() {
      const q = this.tableSearchQuery || '';
      const cat = document.getElementById('filter-table-cat')?.value || 'All';

      this.tableData = (this.filteredData || []).filter(exp => {
         const matchCat = cat === 'All' || exp.categoryId === cat;
         const matchSearch = !q || 
                             (exp.description && exp.description.toLowerCase().includes(q)) ||
                             (exp.amount && exp.amount.toString().includes(q)) ||
                             (exp.whatMisc && exp.whatMisc.toLowerCase().includes(q));
         return matchCat && matchSearch;
      });

      this.renderTable();
    },

    buildDesktopRowHtml: function(exp, index) {
      let cName = String(this.getName(exp.categoryId) || 'N/A');
      const cIdx = this.dropdowns.expenseCats ? this.dropdowns.expenseCats.findIndex(c => c.id === exp.categoryId) : index;
      const color = this.getColor(cIdx > -1 ? cIdx : index);
      
      if ((cName.toLowerCase().includes('misc') || cName.toLowerCase().includes('other')) && exp.whatMisc) {
          cName += ` (${exp.whatMisc})`;
      }

      const dateStr = this.formatDateDDMMMYYYY(exp.date) || 'N/A';
      const cleanAmt = this.parseAmount(exp.amount);
      const amtStr = cleanAmt > 0 ? AppUtils.formatCurrency(cleanAmt) : '₹0';
      
      const creator = exp.createdBy ? exp.createdBy.split('@')[0] : 'Admin';
      const safeDesc = exp.description || '--';
      const fileId = exp.receiptFileId || exp.receiptUrl || '';
      let rcptHtml = fileId ? `<a href="https://drive.google.com/file/d/${fileId}/view?usp=sharing" target="_blank" onclick="event.stopPropagation()" class="text-brand-primary hover:underline ml-1" title="View Receipt"><span class="material-symbols-rounded text-[13px] align-middle">receipt_long</span></a>` : '';

      return `
        <tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-colors">
          <td class="px-4 py-3 font-medium text-slate-700 text-xs">${dateStr}</td>
          <td class="px-4 py-3">
            <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${color}"></span><span class="font-semibold text-slate-800 text-xs truncate max-w-[140px]">${cName}</span></div>
          </td>
          <td class="px-4 py-3 text-slate-700 text-xs">${safeDesc}</td>
          <td class="px-4 py-3 font-bold text-slate-800 text-xs md:text-sm">${amtStr}${rcptHtml}</td>
          <td class="px-4 py-3 text-slate-500 capitalize text-xs">${creator}</td>
          <td class="px-4 py-3 text-right">
            <button onclick="ExpensesApp.openModalByIndex(${index})" class="w-7 h-7 text-slate-400 hover:text-brand-primary hover:bg-blue-50 rounded"><span class="material-symbols-rounded text-[17px]">edit</span></button>
            <button onclick="ExpensesApp.openDeleteModalByIndex(${index})" class="w-7 h-7 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded"><span class="material-symbols-rounded text-[17px]">delete</span></button>
          </td>
        </tr>
      `;
    },

    buildMobileCardHtml: function(exp, index) {
      let cName = String(this.getName(exp.categoryId) || 'N/A');
      const cIdx = this.dropdowns.expenseCats ? this.dropdowns.expenseCats.findIndex(c => c.id === exp.categoryId) : index;
      const color = this.getColor(cIdx > -1 ? cIdx : index);
      
      const dateStr = this.formatDateDDMMMYYYY(exp.date) || 'N/A';
      const cleanAmt = this.parseAmount(exp.amount);
      const amtStr = cleanAmt > 0 ? AppUtils.formatCurrency(cleanAmt) : '₹0';
      const fileId = exp.receiptFileId || exp.receiptUrl || '';
      let rcptHtml = fileId ? `<a href="https://drive.google.com/file/d/${fileId}/view?usp=sharing" target="_blank" onclick="event.stopPropagation()" class="text-brand-primary hover:underline ml-1" title="View Receipt"><span class="material-symbols-rounded text-[13px] align-middle">receipt_long</span></a>` : '';

      return `
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2 relative">
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-start gap-2">
              <span class="w-2.5 h-2.5 rounded-full shrink-0 mt-1" style="background-color: ${color}"></span>
              <div>
                <span class="text-sm font-bold text-slate-800 leading-tight">${cName} ${exp.description ? `<span class="font-medium text-slate-500 text-xs block sm:inline">(${exp.description})</span>` : ''}</span>
              </div>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button onclick="ExpensesApp.openModalByIndex(${index})" class="text-slate-400 hover:text-brand-primary"><span class="material-symbols-rounded text-[18px]">edit</span></button>
              <button onclick="ExpensesApp.openDeleteModalByIndex(${index})" class="text-slate-400 hover:text-red-500"><span class="material-symbols-rounded text-[18px]">delete</span></button>
            </div>
          </div>
          <div class="flex items-center justify-between mt-1 pt-2 border-t border-slate-100">
            <span class="text-xs font-medium text-slate-500">${dateStr}</span>
            <span class="text-sm font-bold text-slate-800">${amtStr}${rcptHtml}</span>
          </div>
        </div>
      `;
    },

    renderTable: function() {
      const tBody = document.getElementById('desktop-expense-body');
      const mContainer = document.getElementById('mobile-expense-container');
      if (!tBody || !mContainer) return;

      this.tableData.sort((a, b) => {
         let valA, valB;
         if (this.sortColumn === 'date') {
            valA = new Date(this.parseToISODate(a.date)).getTime();
            valB = new Date(this.parseToISODate(b.date)).getTime();
         } else if (this.sortColumn === 'amount') {
            valA = this.parseAmount(a.amount);
            valB = this.parseAmount(b.amount);
         } else if (this.sortColumn === 'category') {
            valA = this.getName(a.categoryId).toLowerCase();
            valB = this.getName(b.categoryId).toLowerCase();
         }
         
         if (valA < valB) return this.sortAsc ? -1 : 1;
         if (valA > valB) return this.sortAsc ? 1 : -1;
         return 0;
      });

      this.renderedCount = 0;
      this.isLoadingMore = false;

      if (this.tableData.length === 0) {
        tBody.innerHTML = `<tr><td colspan="6" class="text-center py-8 px-4 text-slate-500 text-xs font-medium">No expenses match your criteria.</td></tr>`;
        mContainer.innerHTML = `<div class="bg-white p-6 text-center text-xs text-slate-500 rounded-xl border border-slate-200">No records found.</div>`;
        return;
      }

      const initialBatch = this.tableData.slice(0, this.pageSize);
      tBody.innerHTML = initialBatch.map((exp, i) => this.buildDesktopRowHtml(exp, i)).join('');
      mContainer.innerHTML = initialBatch.map((exp, i) => this.buildMobileCardHtml(exp, i)).join('');
      this.renderedCount = initialBatch.length;

      this.initScrollListener();
    },

    loadMore: function() {
      if (this.isLoadingMore || this.renderedCount >= this.tableData.length) return;
      this.isLoadingMore = true;

      const tBody = document.getElementById('desktop-expense-body');
      const mContainer = document.getElementById('mobile-expense-container');
      if (!tBody || !mContainer) { this.isLoadingMore = false; return; }

      // Show shimmer placeholders at bottom without clearing top rows
      const dShim = document.createElement('tr');
      dShim.id = 'exp-lazy-shimmer-desktop';
      dShim.className = 'lazy-loading-row';
      dShim.innerHTML = `<td colspan="6" class="px-4 py-3"><div class="space-y-2 py-1"><div class="h-5 w-full shimmer rounded"></div><div class="h-5 w-4/5 shimmer rounded"></div></div></td>`;
      tBody.appendChild(dShim);

      const mShim = document.createElement('div');
      mShim.id = 'exp-lazy-shimmer-mobile';
      mShim.innerHTML = `<div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2"><div class="h-4 w-3/4 shimmer rounded"></div><div class="h-3 w-1/2 shimmer rounded mt-2"></div></div>`;
      mContainer.appendChild(mShim);

      setTimeout(() => {
        const dShimEl = document.getElementById('exp-lazy-shimmer-desktop');
        if (dShimEl) dShimEl.remove();
        const mShimEl = document.getElementById('exp-lazy-shimmer-mobile');
        if (mShimEl) mShimEl.remove();

        const startIdx = this.renderedCount;
        const nextBatch = this.tableData.slice(startIdx, startIdx + this.pageSize);
        if (nextBatch.length > 0) {
          const dHtml = nextBatch.map((exp, i) => this.buildDesktopRowHtml(exp, startIdx + i)).join('');
          const mHtml = nextBatch.map((exp, i) => this.buildMobileCardHtml(exp, startIdx + i)).join('');
          tBody.insertAdjacentHTML('beforeend', dHtml);
          mContainer.insertAdjacentHTML('beforeend', mHtml);
          this.renderedCount += nextBatch.length;
        }
        this.isLoadingMore = false;
      }, 160);
    },

    initScrollListener: function() {
      if (this.scrollListenerBound) return;
      this.scrollListenerBound = true;

      const handleScroll = () => {
        if (this.isLoadingMore || this.renderedCount >= this.tableData.length) return;
        const dContainer = document.getElementById('expenses-table-container');
        const mContainer = document.getElementById('mobile-expense-container');
        const appRoot = document.getElementById('app-root');

        const checkNearBottom = (el) => el && (el.scrollTop + el.clientHeight >= el.scrollHeight - 100);

        if (checkNearBottom(dContainer) || checkNearBottom(mContainer) || checkNearBottom(appRoot)) {
          this.loadMore();
        }
      };

      const debouncedScroll = AppUtils.debounce(handleScroll, 60);

      const dContainer = document.getElementById('expenses-table-container');
      if (dContainer && typeof dContainer.addEventListener === 'function') dContainer.addEventListener('scroll', debouncedScroll, { passive: true });

      const mContainer = document.getElementById('mobile-expense-container');
      if (mContainer && typeof mContainer.addEventListener === 'function') mContainer.addEventListener('scroll', debouncedScroll, { passive: true });

      const appRoot = document.getElementById('app-root');
      if (appRoot && typeof appRoot.addEventListener === 'function') appRoot.addEventListener('scroll', debouncedScroll, { passive: true });
    },

    // --- Index-based modal openers (safe for descriptions with special chars) ---
    openModalByIndex: function(index) {
      const exp = this.tableData && this.tableData[index];
      this.openModal(exp || null);
    },

    openDeleteModalByIndex: function(index) {
      const exp = this.tableData && this.tableData[index];
      if (exp) { this.openDeleteModal(exp.expenseId, exp.description); }
    },

    checkMiscCategory: function() {
       const select = document.getElementById('exp-category');
       const name = (select && select.selectedIndex >= 0 && select.options[select.selectedIndex]) ? select.options[select.selectedIndex].text.toLowerCase() : '';
       const miscContainer = document.getElementById('misc-field-container');
       const miscInput = document.getElementById('exp-what-misc');
       
       if (name.includes('misc') || name.includes('other')) {
          miscContainer.classList.remove('hidden');
          miscInput.setAttribute('required', 'true');
       } else {
          miscContainer.classList.add('hidden');
          miscInput.removeAttribute('required');
       }
    },

    previewReceipt: function(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const previewImg = document.getElementById('exp-receipt-preview');
          const previewCont = document.getElementById('exp-receipt-preview-container');
          if (previewImg && previewCont) {
            previewImg.src = e.target.result;
            previewCont.classList.remove('hidden');
          }
        };
        reader.readAsDataURL(input.files[0]);
      }
    },

    openModal: function(exp = null) {
      document.getElementById('exp-modal-title').innerText = exp ? 'Edit Expense' : 'Add Expense';
      document.getElementById('exp-id').value = exp ? exp.expenseId : '';
      
      this.setDatePicker('exp-date', exp && exp.date ? exp.date : new Date());
      
      document.getElementById('exp-category').value = exp ? exp.categoryId : '';
      document.getElementById('exp-amount').value = exp ? this.parseAmount(exp.amount) : '';
      document.getElementById('exp-desc').value = exp ? (exp.description || '') : '';
      document.getElementById('exp-what-misc').value = exp && exp.whatMisc ? exp.whatMisc : '';

      // Reset file input
      const fileInput = document.getElementById('exp-receipt-file');
      if (fileInput) fileInput.value = '';

      // Store existing receiptFileId in hidden field
      const hiddenFileId = document.getElementById('exp-receipt-file-id');
      const existingFileId = exp && (exp.receiptFileId || exp.receiptUrl) ? (exp.receiptFileId || exp.receiptUrl) : '';
      if (hiddenFileId) hiddenFileId.value = existingFileId;

      // Show existing receipt preview if available
      const previewCont = document.getElementById('exp-receipt-preview-container');
      const previewImg = document.getElementById('exp-receipt-preview');
      if (previewCont && previewImg) {
        if (existingFileId) {
          previewImg.src = `https://drive.google.com/thumbnail?id=${existingFileId}&sz=w200-h200`;
          previewCont.classList.remove('hidden');
        } else {
          previewImg.src = '';
          previewCont.classList.add('hidden');
        }
      }

      this.checkMiscCategory();

      document.getElementById('expense-modal').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('expense-modal-content').classList.remove('translate-y-full', 'md:translate-y-10', 'opacity-0');
    },

    closeModal: function() {
      document.getElementById('expense-modal').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('expense-modal-content').classList.add('translate-y-full', 'md:translate-y-10', 'opacity-0');
      document.getElementById('expense-form').reset();
      document.getElementById('misc-field-container').classList.add('hidden');
      const previewCont = document.getElementById('exp-receipt-preview-container');
      const previewImg = document.getElementById('exp-receipt-preview');
      if (previewCont && previewImg) { previewImg.src = ''; previewCont.classList.add('hidden'); }
      const hiddenFileId = document.getElementById('exp-receipt-file-id');
      if (hiddenFileId) hiddenFileId.value = '';
      AppUtils.clearValidationState('expense-form');
    },

    saveExpense: async function(e) {
      e.preventDefault();
      if (!AppUtils.validateRequiredFields('expense-form')) return;
      const btn = document.getElementById('btn-save-expense');
      btn.innerHTML = `<span class="material-symbols-rounded animate-spin text-[18px] mr-2">progress_activity</span> Saving...`;
      btn.disabled = true;

      // Handle file upload if a new file was selected
      const fileInput = document.getElementById('exp-receipt-file');
      let base64Image = null;
      let imageName = null;

      if (fileInput && fileInput.files && fileInput.files.length > 0) {
        const file = fileInput.files[0];
        imageName = file.name;
        try {
          base64Image = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
          });
        } catch (err) {
          console.error('Error reading receipt file:', err);
        }
      }

      const payload = {
        expenseId: document.getElementById('exp-id').value,
        categoryId: document.getElementById('exp-category').value,
        whatMisc: document.getElementById('exp-what-misc').value,
        date: this.formatDateDDMMMYYYY(document.getElementById('exp-date').value),
        amount: Number(document.getElementById('exp-amount').value),
        description: document.getElementById('exp-desc').value || '',
        receiptFileId: document.getElementById('exp-receipt-file-id') ? document.getElementById('exp-receipt-file-id').value : '',
        base64Image: base64Image,
        imageName: imageName
      };

      google.script.run
        .withSuccessHandler((res) => {
          btn.innerHTML = `Save Expense`; btn.disabled = false;
          if(res.success) {
            Toast.success(res.message);
            this.closeModal();
            this.showShimmer();
            this.fetchData();
          } else { Toast.error(res.error); }
        })
        .withFailureHandler((err) => {
          btn.innerHTML = `Save Expense`; btn.disabled = false;
          Toast.error(err.message || 'Server Error.');
        })
        .api_saveExpense(payload);
    },

    openDeleteModal: function(id, desc) {
      this.expenseToDelete = id;
      document.getElementById('delete-exp-desc').innerText = desc || 'this expense';
      document.getElementById('delete-exp-modal').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('delete-exp-content').classList.remove('scale-95', 'opacity-0');
    },

    closeDeleteModal: function() {
      this.expenseToDelete = null;
      document.getElementById('delete-exp-modal').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('delete-exp-content').classList.add('scale-95', 'opacity-0');
    },

    confirmDelete: function() {
      if(!this.expenseToDelete) return;
      google.script.run
        .withSuccessHandler((res) => {
          this.closeDeleteModal();
          if(res.success) {
            Toast.success(res.message);
            this.showShimmer();
            this.fetchData();
          } else { Toast.error(res.error); }
        })
        .api_deleteExpense(this.expenseToDelete);
    }
  };

  var ExpensesHub = {
    currentListTab: 'all',
    allRecords: [],
    allFiltered: [],
    allSearch: '',

    mountStaffPanel: function() {
      var slot = document.getElementById('exp-list-panel-staff');
      var card = document.getElementById('staff-table-card');
      if (slot && card && card.parentElement !== slot) {
        card.classList.remove('border', 'border-slate-200', 'rounded-xl', 'shadow-sm');
        slot.appendChild(card);
      }
    },

    applyStoredTab: function() {
      var tab = 'all';
      try {
        var stored = sessionStorage.getItem('lsc_expenses_tab') || 'all';
        if (stored === 'staff' || stored === 'operating') tab = stored === 'staff' ? 'staff' : 'expenses';
        else if (stored === 'all' || stored === 'expenses') tab = stored;
      } catch (e) {}
      this.mountStaffPanel();
      this.switchListTab(tab, true);
    },

    onSharedFiltersChanged: function() {
      this.syncStaffFiltersFromShared();
      if (typeof ExpensesApp !== 'undefined') ExpensesApp.applyGlobalFilters();
      if (typeof StaffApp !== 'undefined' && StaffApp.applyGlobalFilters) StaffApp.applyGlobalFilters();
    },

    onSharedModeSwitch: function() {
      if (typeof ExpensesApp !== 'undefined') ExpensesApp.handleModeSwitch();
      this.syncStaffFiltersFromShared();
      if (typeof StaffApp !== 'undefined') {
        var modeEl = document.getElementById('staff-filter-mode');
        var sharedMode = document.getElementById('exp-filter-mode');
        if (modeEl && sharedMode) modeEl.value = sharedMode.value;
        if (StaffApp.handleModeSwitch) StaffApp.handleModeSwitch();
      }
    },

    syncStaffFiltersFromShared: function() {
      var y = document.getElementById('exp-filter-year');
      var m = document.getElementById('exp-filter-mode');
      var sy = document.getElementById('staff-filter-year');
      var sm = document.getElementById('staff-filter-mode');
      if (y && sy) sy.value = y.value;
      if (m && sm) sm.value = m.value;
      if (typeof StaffApp !== 'undefined' && typeof ExpensesApp !== 'undefined') {
        StaffApp.selectedPeriods = (ExpensesApp.selectedPeriods || []).slice();
      }
    },

    switchListTab: function(tab, skipPersist) {
      var canExp = typeof AccessControl === 'undefined' || AccessControl.can('expenses', 'view');
      var canSt = typeof AccessControl === 'undefined' || AccessControl.can('staff', 'view');
      if (tab === 'staff' && !canSt) tab = canExp ? 'expenses' : 'all';
      if (tab === 'expenses' && !canExp) tab = canSt ? 'staff' : 'all';
      if (tab === 'all' && !canExp && canSt) tab = 'staff';

      this.currentListTab = tab;
      if (!skipPersist) {
        try { sessionStorage.setItem('lsc_expenses_tab', tab); } catch (e) {}
      }

      this.mountStaffPanel();

      ['all', 'staff', 'expenses'].forEach(function(name) {
        var btn = document.getElementById('exp-list-tab-' + name);
        var panel = document.getElementById('exp-list-panel-' + name);
        var active = name === tab;
        if (btn) {
          if (name === 'staff') btn.classList.toggle('hidden', !canSt);
          if (name === 'expenses') btn.classList.toggle('hidden', !canExp);
          btn.className = 'exp-list-tab shrink-0 px-3 py-1.5 rounded-lg text-[11px] font-bold transition-colors ' +
            (active ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700');
        }
        if (panel) {
          if (active) panel.classList.remove('hidden');
          else panel.classList.add('hidden');
        }
      });

      var fAll = document.getElementById('exp-list-filters-all');
      var fExp = document.getElementById('exp-list-filters-expenses');
      if (fAll) fAll.classList.toggle('hidden', tab !== 'all');
      if (fExp) fExp.classList.toggle('hidden', tab !== 'expenses');

      if (tab === 'all') this.refreshAllRecords();
    },

    // Back-compat for older Staff Cost KPI clicks
    switchTab: function(tab) {
      this.switchListTab(tab === 'staff' ? 'staff' : 'expenses');
    },

    refreshAllRecords: function() {
      var rows = [];
      var year = document.getElementById('exp-filter-year')?.value;
      var expenses = (typeof ExpensesApp !== 'undefined' && ExpensesApp.filteredData) ? ExpensesApp.filteredData : [];
      expenses.forEach(function(exp) {
        rows.push({
          recordType: 'expense',
          date: exp.date,
          sortDate: exp.date,
          name: (typeof ExpensesApp !== 'undefined') ? ExpensesApp.getName(exp.categoryId) : (exp.categoryId || 'Expense'),
          description: exp.description || exp.whatMisc || '',
          amount: exp.amount,
          status: 'Recorded',
          statusClass: 'text-emerald-700 bg-emerald-50 border-emerald-100',
          raw: exp
        });
      });

      var salaries = (typeof ExpensesApp !== 'undefined' && ExpensesApp.salaries) ? ExpensesApp.salaries : [];
      var staffList = (typeof StaffApp !== 'undefined' && StaffApp.allData) ? StaffApp.allData : [];
      var staffNameById = {};
      staffList.forEach(function(s) { staffNameById[String(s.staffId)] = s.fullName || s.name || s.staffId; });

      salaries.forEach(function(sal) {
        var d = sal.paidDate || sal.startDate || sal.date;
        if (year && d) {
          var parsed = new Date(typeof AppUtils !== 'undefined' && AppUtils.parseToISODate ? AppUtils.parseToISODate(d) : d);
          if (!isNaN(parsed) && String(parsed.getFullYear()) !== String(year)) return;
        }
        var statusLabel = String(sal.paymentStatus || sal.status || 'Paid');
        var lower = statusLabel.toLowerCase();
        var statusClass = 'text-emerald-700 bg-emerald-50 border-emerald-100';
        if (lower.indexOf('pending') >= 0 || lower.indexOf('action') >= 0) statusClass = 'text-amber-700 bg-amber-50 border-amber-100';
        rows.push({
          recordType: 'staff',
          date: d,
          sortDate: d,
          name: staffNameById[String(sal.staffId)] || sal.staffId || 'Staff',
          description: sal.type || sal.creditType || 'Salary',
          amount: sal.amount,
          status: statusLabel,
          statusClass: statusClass,
          staffId: sal.staffId,
          raw: sal
        });
      });

      // Pending salary cycles (Action Needed) from StaffApp cycle engine
      if (typeof StaffApp !== 'undefined' && StaffApp.getStaffCycles) {
        staffList.forEach(function(s) {
          var cycleInfo = StaffApp.getStaffCycles(s, StaffApp.allPayments || []);
          (cycleInfo.pendingCycles || []).forEach(function(cycle) {
            rows.push({
              recordType: 'staff',
              date: cycle.monthLabel || cycle.endDate || '',
              sortDate: cycle.endDate || cycle.startDate || '',
              name: s.fullName || s.name || s.staffId,
              description: 'Salary · ' + (cycle.monthLabel || 'Pending cycle'),
              amount: cycle.amount || s.salary || s.monthlySalary || 0,
              status: 'Action Needed',
              statusClass: 'text-amber-700 bg-amber-50 border-amber-200',
              staffId: s.staffId,
              raw: cycle
            });
          });
        });
      }

      rows.sort(function(a, b) {
        var da = new Date(typeof AppUtils !== 'undefined' && AppUtils.parseToISODate ? AppUtils.parseToISODate(a.sortDate) : a.sortDate);
        var db = new Date(typeof AppUtils !== 'undefined' && AppUtils.parseToISODate ? AppUtils.parseToISODate(b.sortDate) : b.sortDate);
        return (db - da) || 0;
      });

      this.allRecords = rows;
      this.filterAllRecords();
    },

    searchAllRecords: function(q) {
      this.allSearch = String(q || '').toLowerCase();
      this.filterAllRecords();
    },

    filterAllRecords: function() {
      var type = document.getElementById('all-filter-type')?.value || 'All';
      var q = this.allSearch || '';
      this.allFiltered = (this.allRecords || []).filter(function(r) {
        if (type === 'staff' && r.recordType !== 'staff') return false;
        if (type === 'expense' && r.recordType !== 'expense') return false;
        if (!q) return true;
        return String(r.name || '').toLowerCase().indexOf(q) >= 0
          || String(r.description || '').toLowerCase().indexOf(q) >= 0
          || String(r.status || '').toLowerCase().indexOf(q) >= 0;
      });
      this.renderAllRecords();
    },

    renderAllRecords: function() {
      var tbody = document.getElementById('desktop-all-body');
      var mobile = document.getElementById('mobile-all-container');
      var rows = this.allFiltered || [];
      if (tbody) {
        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-xs font-bold text-slate-400">No records for this period.</td></tr>';
        } else {
          tbody.innerHTML = rows.map(function(r) {
            var typeBadge = r.recordType === 'staff'
              ? '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded border uppercase bg-purple-50 text-purple-700 border-purple-100">Staff</span>'
              : '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded border uppercase bg-blue-50 text-blue-700 border-blue-100">Expense</span>';
            var statusBadge = '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded border ' + r.statusClass + '">' + r.status + '</span>';
            var amt = (typeof AppUtils !== 'undefined') ? AppUtils.formatCurrency(r.amount) : r.amount;
            var dateFmt = (typeof ExpensesApp !== 'undefined' && ExpensesApp.formatDateDDMMMYYYY)
              ? ExpensesApp.formatDateDDMMMYYYY(r.date) : (r.date || '--');
            var actions = '';
            if (r.recordType === 'expense' && r.raw && r.raw.expenseId) {
              var pJson = JSON.stringify(r.raw).replace(/"/g, '&quot;');
              actions = '<button onclick=\'ExpensesApp.openModal(' + pJson + ')\' class="w-6 h-6 text-slate-400 hover:text-brand-primary rounded"><span class="material-symbols-rounded text-[14px]">edit</span></button>';
            } else if (r.recordType === 'staff' && r.staffId && typeof StaffApp !== 'undefined') {
              actions = '<button onclick="ExpensesHub.openStaffFromAll(\'' + String(r.staffId).replace(/'/g, '') + '\')" class="w-6 h-6 text-slate-400 hover:text-brand-primary rounded"><span class="material-symbols-rounded text-[14px]">visibility</span></button>';
            }
            return '<tr class="border-b border-slate-50 hover:bg-slate-50">' +
              '<td class="px-4 py-3 font-semibold text-slate-800 whitespace-nowrap">' + dateFmt + '</td>' +
              '<td class="px-4 py-3">' + typeBadge + '</td>' +
              '<td class="px-4 py-3 font-bold text-slate-800">' + (r.name || '--') + '</td>' +
              '<td class="px-4 py-3 text-slate-600">' + (r.description || '--') + '</td>' +
              '<td class="px-4 py-3 font-bold text-slate-800 whitespace-nowrap">' + amt + '</td>' +
              '<td class="px-4 py-3">' + statusBadge + '</td>' +
              '<td class="px-4 py-3 text-right">' + actions + '</td></tr>';
          }).join('');
        }
      }
      if (mobile) {
        if (!rows.length) {
          mobile.innerHTML = '<div class="bg-white p-6 text-center text-xs text-slate-400 rounded-xl border">No records for this period.</div>';
        } else {
          mobile.innerHTML = rows.map(function(r) {
            var amt = (typeof AppUtils !== 'undefined') ? AppUtils.formatCurrency(r.amount) : r.amount;
            var dateFmt = (typeof ExpensesApp !== 'undefined' && ExpensesApp.formatDateDDMMMYYYY)
              ? ExpensesApp.formatDateDDMMMYYYY(r.date) : (r.date || '--');
            return '<div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm">' +
              '<div class="flex items-center justify-between gap-2 mb-1"><span class="text-[10px] font-bold text-slate-500">' + dateFmt + '</span>' +
              '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded border ' + r.statusClass + '">' + r.status + '</span></div>' +
              '<div class="font-bold text-sm text-slate-800">' + (r.name || '--') + '</div>' +
              '<div class="text-[11px] text-slate-500">' + (r.recordType === 'staff' ? 'Staff' : 'Expense') + ' · ' + (r.description || '') + '</div>' +
              '<div class="text-sm font-bold text-slate-800 mt-1">' + amt + '</div></div>';
          }).join('');
        }
      }
    },

    openStaffFromAll: function(staffId) {
      this.switchListTab('staff');
      if (typeof StaffApp === 'undefined') return;
      var member = (StaffApp.allData || []).find(function(s) { return String(s.staffId) === String(staffId); });
      if (member && StaffApp.openDetails) StaffApp.openDetails(member);
    },

    onAddClick: function() {
      var canExp = typeof AccessControl === 'undefined' || AccessControl.can('expenses', 'create');
      var canSt = typeof AccessControl === 'undefined' || AccessControl.can('staff', 'create');
      if (canExp && canSt) {
        this.openAddChooser();
        return;
      }
      if (canSt) { if (typeof StaffApp !== 'undefined') StaffApp.openModal(); return; }
      if (canExp) { if (typeof ExpensesApp !== 'undefined') ExpensesApp.openModal(); return; }
      if (typeof Toast !== 'undefined') Toast.error('You do not have permission to add records.');
    },

    openAddChooser: function() {
      var modal = document.getElementById('exp-add-chooser-modal');
      var content = document.getElementById('exp-add-chooser-content');
      if (!modal || !content) return;
      var canExp = typeof AccessControl === 'undefined' || AccessControl.can('expenses', 'create');
      var canSt = typeof AccessControl === 'undefined' || AccessControl.can('staff', 'create');
      var staffBtn = document.getElementById('exp-add-choose-staff');
      var expBtn = document.getElementById('exp-add-choose-expense');
      if (staffBtn) staffBtn.classList.toggle('hidden', !canSt);
      if (expBtn) expBtn.classList.toggle('hidden', !canExp);
      modal.classList.remove('pointer-events-none', 'opacity-0');
      modal.classList.add('opacity-100');
      content.classList.remove('translate-y-4', 'sm:scale-95', 'opacity-0');
      content.classList.add('translate-y-0', 'sm:scale-100', 'opacity-100');
    },

    closeAddChooser: function() {
      var modal = document.getElementById('exp-add-chooser-modal');
      var content = document.getElementById('exp-add-chooser-content');
      if (!modal || !content) return;
      modal.classList.add('opacity-0', 'pointer-events-none');
      modal.classList.remove('opacity-100');
      content.classList.add('translate-y-4', 'sm:scale-95', 'opacity-0');
      content.classList.remove('translate-y-0', 'sm:scale-100', 'opacity-100');
    },

    chooseAddType: function(type) {
      this.closeAddChooser();
      if (type === 'staff' && typeof StaffApp !== 'undefined') StaffApp.openModal();
      else if (typeof ExpensesApp !== 'undefined') ExpensesApp.openModal();
    }
  };

  ExpensesApp.init();
  if (typeof ExpensesHub !== 'undefined') {
    ExpensesHub.mountStaffPanel();
    ExpensesHub.applyStoredTab();
  }
</script>
