<script>
  var CalendarModule = {
    monthNames: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
    today: null,
    currentDate: null,
    selectedDateKey: null,
    events: [],
    dateBuckets: {},
    lowercaseSearchTerm: '',
    activeFilters: { renewal: true, overdue: true, exit: true },
    openDrawerDateKey: null,
    drawerOpen: false,

    init: function() {
      this.today = new Date();
      this.today.setHours(0, 0, 0, 0);
      this.currentDate = new Date(this.today.getFullYear(), this.today.getMonth(), 1);
      this.selectedDateKey = this.dateKeyFromParts(this.today.getFullYear(), this.today.getMonth() + 1, this.today.getDate());
      this.bindControls();
      AppUtils.populateYearSelect('cal-year-select', String(this.currentDate.getFullYear()));
      AppUtils.loadAvailableYears(() => {
        AppUtils.populateYearSelect('cal-year-select', String(this.currentDate.getFullYear()));
      });
      this.loadCalendarData();
    },

    dateKeyFromParts: function(year, month, day) {
      return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    },

    showLoadingShimmer: function() {
      const grid = document.getElementById('cal-grid');
      const list = document.getElementById('cal-member-list');
      if (grid) {
        let skeleton = '';
        for (let i = 0; i < 35; i++) {
          skeleton += '<div class="h-12 rounded-lg shimmer opacity-70"></div>';
        }
        grid.innerHTML = skeleton;
      }
      if (list) {
        let listSkeleton = '';
        for (let i = 0; i < 4; i++) {
          listSkeleton += '<div class="flex items-center justify-between gap-3 py-3"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full shimmer"></div><div class="space-y-2"><div class="h-3 w-24 shimmer rounded"></div><div class="h-2 w-16 shimmer rounded"></div></div></div><div class="h-4 w-12 shimmer rounded"></div></div>';
        }
        list.innerHTML = listSkeleton;
      }
      ['cal-stat-overdue', 'cal-stat-due-2', 'cal-stat-due-3-7', 'cal-stat-month'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = '<span class="h-4 w-8 inline-block shimmer rounded"></span>';
      });
    },

    formatMonthYear: function(date) {
      return `${this.monthNames[date.getMonth()]} ${date.getFullYear()}`;
    },

    eventPassesFilters: function(item) {
      const type = item.type || (item.daysLeft < 0 ? 'overdue' : 'renewal');
      if (!this.activeFilters[type]) return false;
      if (!this.lowercaseSearchTerm) return true;
      return String(item.name || '').toLowerCase().includes(this.lowercaseSearchTerm);
    },

    getVisibleEvents: function() {
      const monthKey = `${this.currentDate.getFullYear()}-${String(this.currentDate.getMonth() + 1).padStart(2, '0')}`;
      return this.events.filter((item) => {
        if (!this.eventPassesFilters(item)) return false;
        const next = new Date(item.eventDate || item.nextDueDate || item.dateKey || 0);
        const itemMonth = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}`;
        const matchesSelectedMonth = itemMonth === monthKey;
        const isUrgency = Number.isFinite(item.daysLeft) && item.daysLeft <= 7;
        return matchesSelectedMonth || isUrgency;
      });
    },

    filteredBucket: function(dateKey) {
      const bucket = this.dateBuckets[dateKey] || [];
      return bucket.filter((item) => this.eventPassesFilters(item));
    },

    typeDotClass: function(item) {
      if (item.colorKey === 'exit' || item.type === 'exit') return 'bg-violet-500';
      if (item.colorKey === 'overdue' || item.type === 'overdue' || item.daysLeft < 0) return 'bg-red-500';
      return 'bg-sky-500';
    },

    typeLabel: function(item) {
      if (item.type === 'exit') return 'Exit';
      if (item.type === 'overdue' || item.daysLeft < 0) return 'Overdue';
      return 'Renewal';
    },

    renderFilterChips: function() {
      document.querySelectorAll('.cal-filter-chip').forEach((chip) => {
        const key = chip.getAttribute('data-cal-filter');
        const on = Boolean(this.activeFilters[key]);
        chip.classList.toggle('opacity-45', !on);
        chip.classList.toggle('bg-white', !on);
        chip.setAttribute('aria-pressed', on ? 'true' : 'false');
        if (key === 'renewal') {
          chip.classList.toggle('border-sky-400', on);
          chip.classList.toggle('bg-sky-50', on);
          chip.classList.toggle('text-sky-700', on);
          chip.classList.toggle('border-slate-200', !on);
          chip.classList.toggle('text-slate-500', !on);
        }
        if (key === 'overdue') {
          chip.classList.toggle('border-red-400', on);
          chip.classList.toggle('bg-red-50', on);
          chip.classList.toggle('text-red-700', on);
          chip.classList.toggle('border-slate-200', !on);
          chip.classList.toggle('text-slate-500', !on);
        }
        if (key === 'exit') {
          chip.classList.toggle('border-violet-400', on);
          chip.classList.toggle('bg-violet-50', on);
          chip.classList.toggle('text-violet-700', on);
          chip.classList.toggle('border-slate-200', !on);
          chip.classList.toggle('text-slate-500', !on);
        }
      });
    },

    renderCalendarFromData: function() {
      const stats = this.events.reduce((acc, item) => {
        if (item.type === 'exit') {
          acc.exits += 1;
          return acc;
        }
        if (item.daysLeft < 0) acc.overdue += 1;
        else if (item.daysLeft <= 2) acc.due2 += 1;
        else if (item.daysLeft <= 7) acc.due3To7 += 1;
        return acc;
      }, { overdue: 0, due2: 0, due3To7: 0, exits: 0 });

      const monthKey = `${this.currentDate.getFullYear()}-${String(this.currentDate.getMonth() + 1).padStart(2, '0')}`;
      const thisMonth = this.events.filter((item) => {
        const d = new Date(item.eventDate || item.nextDueDate || 0);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}` === monthKey;
      }).length;

      const setStat = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.innerText = value;
      };
      setStat('cal-stat-overdue', stats.overdue);
      setStat('cal-stat-due-2', stats.due2);
      setStat('cal-stat-due-3-7', stats.due3To7);
      setStat('cal-stat-month', thisMonth);

      const monthTitle = document.getElementById('cal-month-title');
      const yearSelect = document.getElementById('cal-year-select');
      if (monthTitle) monthTitle.innerText = this.formatMonthYear(this.currentDate);
      if (yearSelect) yearSelect.value = String(this.currentDate.getFullYear());

      this.renderFilterChips();
      this.buildGrid();
      this.renderMemberList();
      this.setupDrawerClose();
    },

    loadCalendarData: function() {
      this.showLoadingShimmer();

      const finalizeLoad = (response) => {
        const payload = response && response.success && response.data ? response.data : {};
        this.events = Array.isArray(payload.events)
          ? payload.events
          : (Array.isArray(payload.monthMembers) ? payload.monthMembers : []);
        this.dateBuckets = payload.dateBuckets || {};

        if (!response || !response.success) {
          const listEl = document.getElementById('cal-member-list');
          if (listEl) listEl.innerHTML = '<div class="text-xs text-slate-500">Unable to load calendar data.</div>';
        }

        this.renderCalendarFromData();
      };

      google.script.run
        .withSuccessHandler((response) => finalizeLoad(response))
        .withFailureHandler(() => {
          this.events = [];
          this.dateBuckets = {};
          this.renderCalendarFromData();
        })
        .api_getCalendarData(this.currentDate.getMonth(), this.currentDate.getFullYear());
    },

    buildGrid: function() {
      const grid = document.getElementById('cal-grid');
      if (!grid) return;

      const year = this.currentDate.getFullYear();
      const month = this.currentDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      let html = '';
      for (let i = 0; i < firstDay; i++) {
        const d = daysInPrevMonth - firstDay + i + 1;
        html += `<div class="flex flex-col items-center justify-start min-h-[3.25rem] opacity-30"><span class="text-xs font-medium text-slate-400 leading-7">${d}</span></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = this.dateKeyFromParts(year, month + 1, day);
        const bucket = this.filteredBucket(dateKey);
        const isSelected = dateKey === this.selectedDateKey;
        const isToday = dateKey === this.dateKeyFromParts(this.today.getFullYear(), this.today.getMonth() + 1, this.today.getDate());

        let accent = 'text-slate-700 hover:bg-slate-50';
        if (isSelected) accent = 'bg-brand-primary text-white shadow-sm';
        else if (isToday) accent = 'bg-slate-100 text-brand-primary font-bold';

        const uniqueDots = [];
        bucket.forEach((item) => {
          const cls = this.typeDotClass(item);
          if (uniqueDots.indexOf(cls) === -1) uniqueDots.push(cls);
        });
        const dotsHtml = uniqueDots.slice(0, 3).map((cls) => `<div class="w-1.5 h-1.5 rounded-full shrink-0 ${cls}"></div>`).join('');

        html += `
          <div class="flex flex-col items-center justify-start min-h-[3.25rem] cursor-pointer px-0.5" data-date-key="${dateKey}" data-day="${day}">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-semibold ${accent} transition-colors">
              ${day}
            </div>
            <div class="flex gap-0.5 mt-0.5 min-h-[0.375rem] items-center justify-center">${dotsHtml || '<span class="w-3 h-0.5"></span>'}</div>
          </div>
        `;
      }

      grid.innerHTML = html;
      grid.querySelectorAll('[data-date-key]').forEach((el) => {
        el.addEventListener('click', () => {
          this.selectedDateKey = el.dataset.dateKey;
          this.buildGrid();
          this.openDrawer(el.dataset.dateKey);
        });
      });
    },

    renderMemberList: function() {
      const listEl = document.getElementById('cal-member-list');
      const visible = this.getVisibleEvents();
      const memberCountEl = document.getElementById('cal-member-count');
      if (memberCountEl) memberCountEl.innerText = visible.length;

      if (!listEl) return;
      if (!visible.length) {
        listEl.innerHTML = '<div class="text-xs text-slate-500 py-2">No events for the selected filters this month.</div>';
        return;
      }

      listEl.innerHTML = visible.map((item, index) => {
        const initials = String(item.name || '?').split(' ').map((part) => part[0]).slice(0, 2).join('').toUpperCase();
        const daysLabel = item.type === 'exit'
          ? (item.daysLeft < 0 ? `Exit ${Math.abs(item.daysLeft)}d` : (item.daysLeft === 0 ? 'Exit today' : `Exit ${item.daysLeft}d`))
          : (item.daysLeft < 0 ? `${Math.abs(item.daysLeft)}d overdue` : `${item.daysLeft}d left`);
        const gcalBadge = item.gcalSynced
          ? '<span class="shrink-0 inline-flex text-[8px] font-bold uppercase tracking-wide px-1 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-100 whitespace-nowrap">GCal</span>'
          : '';

        return `
          <button type="button" class="w-full text-left flex items-start justify-between gap-2 pb-3 border-b border-slate-50 last:border-0 min-w-0" data-list-index="${index}">
            <div class="flex items-center gap-2.5 min-w-0 flex-1 overflow-hidden">
              <div class="w-9 h-9 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-[10px] font-bold shrink-0">${initials}</div>
              <div class="min-w-0 flex-1 overflow-hidden">
                <div class="flex items-center gap-1.5 min-w-0">
                  <div class="text-xs font-bold text-slate-800 truncate">${item.name}</div>
                  ${gcalBadge}
                </div>
                <div class="text-[10px] text-slate-500 truncate">${item.plan} · ${this.typeLabel(item)}</div>
                <div class="text-[10px] text-slate-500 mt-0.5">${item.dueDateLabel}</div>
              </div>
            </div>
            <div class="flex flex-col items-end gap-1 shrink-0 pt-0.5">
              <span class="inline-flex items-center text-[9px] font-bold px-1.5 py-0.5 rounded border whitespace-nowrap leading-tight ${item.badgeClass || 'bg-slate-50 text-slate-600 border-slate-200'}">${daysLabel}</span>
              ${item.type !== 'exit' ? `<span class="text-[11px] font-bold text-slate-800 whitespace-nowrap">${AppUtils.formatCurrency(item.amount)}</span>` : ''}
            </div>
          </button>
        `;
      }).join('');

      listEl.querySelectorAll('[data-list-index]').forEach((el) => {
        el.addEventListener('click', () => {
          const item = visible[Number(el.dataset.listIndex)];
          if (item && item.dateKey) {
            this.selectedDateKey = item.dateKey;
            this.buildGrid();
            this.openDrawer(item.dateKey);
          }
        });
      });
    },

    buildWaRow: function(item) {
      return {
        name: item.name,
        phone: item.phone || '',
        amount: item.amount || 0,
        plan: item.plan || '',
        date: item.dueDateLabel || '',
        days: item.daysLeft < 0 ? Math.abs(item.daysLeft) : item.daysLeft
      };
    },

    openMember: function(item) {
      this.closeDrawer();
      const memberId = item && item.memberId ? String(item.memberId) : '';
      const rowData = {
        memberId: memberId,
        name: item.name || '',
        plan: item.plan || '',
        amount: item.amount || 0,
        date: item.dueDateLabel || '',
        phone: item.phone || ''
      };
      if (typeof window.navigateToMemberDetail === 'function') {
        window.navigateToMemberDetail(memberId, rowData);
        return;
      }
      window.location.hash = '#members';
      const tryOpen = () => {
        if (typeof MembersApp === 'undefined' || !MembersApp) return false;
        if (MembersApp.allData && MembersApp.allData.length) {
          const target = MembersApp.allData.find(m => String(m.memberId) === memberId || m.fullName === rowData.name);
          if (target) {
            MembersApp.openDetails(target);
            return true;
          }
        }
        if (typeof MembersApp.fetchData === 'function') {
          MembersApp.fetchData(() => {
            const fresh = MembersApp.allData && MembersApp.allData.find(m => String(m.memberId) === memberId || m.fullName === rowData.name);
            if (fresh) MembersApp.openDetails(fresh);
            else if (typeof MembersApp.openDetails === 'function') {
              MembersApp.openDetails({
                memberId: memberId,
                fullName: rowData.name,
                membershipAmount: rowData.amount,
                phone: rowData.phone
              });
            }
          });
          return true;
        }
        return false;
      };
      if (!tryOpen()) {
        setTimeout(tryOpen, 400);
        setTimeout(tryOpen, 1000);
      }
    },

    openDrawer: function(dateKey) {
      this.openDrawerDateKey = dateKey;
      const bucket = this.filteredBucket(dateKey);
      const [year, month, day] = dateKey.split('-').map(Number);
      const drawerTitle = document.getElementById('drawer-title');
      const drawerSubtitle = document.getElementById('drawer-subtitle');
      if (drawerTitle) drawerTitle.innerText = `${day} ${this.monthNames[month - 1]} ${year}`;
      if (drawerSubtitle) drawerSubtitle.innerText = `${bucket.length} event${bucket.length === 1 ? '' : 's'}`;

      const drawerSearch = document.getElementById('calendar-drawer-search');
      const searchValue = (drawerSearch ? drawerSearch.value : '').trim().toLowerCase();
      const filtered = bucket.filter((item) => String(item.name || '').toLowerCase().includes(searchValue));

      const content = document.getElementById('calendar-drawer-content');
      if (!content) return;
      if (!filtered.length) {
        content.innerHTML = '<div class="text-xs text-slate-500">No events for this date.</div>';
      } else {
        content.innerHTML = filtered.map((item, index) => {
          const daysLabel = item.type === 'exit'
            ? (item.daysLeft < 0 ? `Exited ${Math.abs(item.daysLeft)} days ago` : (item.daysLeft === 0 ? 'Exit today' : `${item.daysLeft} days to exit`))
            : (item.daysLeft < 0 ? `${Math.abs(item.daysLeft)} days overdue` : `${item.daysLeft} days left`);
          const waType = (item.type === 'overdue' || item.daysLeft < 0) ? 'overdue' : 'upcoming';
          const hasPhone = typeof WhatsAppNotify !== 'undefined' && WhatsAppNotify.normalizePhone(item.phone);
          const waBtn = (item.type !== 'exit' && typeof WhatsAppNotify !== 'undefined')
            ? WhatsAppNotify.renderButton(
              hasPhone,
              `CalendarModule.openWhatsApp(${index}, '${waType}')`
            )
            : '';
          const gcalBadge = item.gcalSynced
            ? '<span class="inline-flex max-w-full text-[9px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-100 whitespace-nowrap">GCal synced</span>'
            : '';

          return `
            <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm" data-drawer-index="${index}">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-[10px] font-bold shrink-0">${String(item.name || '?').split(' ').map((part) => part[0]).slice(0, 2).join('').toUpperCase()}</div>
                <div class="min-w-0 flex-1">
                  <div class="text-sm font-bold text-slate-800 truncate">${item.name}</div>
                  <div class="text-[10px] text-slate-500">${item.plan} · ${this.typeLabel(item)}</div>
                  ${gcalBadge ? `<div class="mt-1">${gcalBadge}</div>` : ''}
                </div>
              </div>
              <div class="mt-3 grid grid-cols-2 gap-2 text-[10px] text-slate-600">
                <div class="bg-slate-50 rounded-lg p-2">
                  <div class="font-semibold text-slate-500">${item.type === 'exit' ? 'Exit date' : 'Due date'}</div>
                  <div class="mt-1 font-bold text-slate-800">${item.dueDateLabel}</div>
                </div>
                <div class="bg-slate-50 rounded-lg p-2">
                  <div class="font-semibold text-slate-500">${item.type === 'exit' ? 'Status' : 'Amount'}</div>
                  <div class="mt-1 font-bold text-slate-800">${item.type === 'exit' ? daysLabel : AppUtils.formatCurrency(item.amount)}</div>
                </div>
              </div>
              <div class="mt-3 flex items-center justify-between gap-2 flex-wrap">
                <span class="text-[10px] font-semibold text-slate-500 min-w-0">${daysLabel}</span>
                <span class="shrink-0 inline-flex items-center text-[9px] font-bold px-1.5 py-0.5 rounded border whitespace-nowrap ${item.badgeClass || 'bg-slate-50 text-slate-600 border-slate-200'}">${item.statusText || this.typeLabel(item)}</span>
              </div>
              <div class="mt-3 flex items-center gap-2">
                <button type="button" class="flex-1 px-3 py-2 rounded-lg bg-brand-primary text-white text-[11px] font-bold" data-open-member="${index}">Open member</button>
                ${waBtn ? `<div class="shrink-0" data-wa-slot="${index}">${waBtn}</div>` : ''}
              </div>
            </div>
          `;
        }).join('');

        content.querySelectorAll('[data-open-member]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const item = filtered[Number(btn.getAttribute('data-open-member'))];
            if (item) this.openMember(item);
          });
        });

        this._drawerFiltered = filtered;
      }

      const backdrop = document.getElementById('calendar-drawer-backdrop');
      const drawer = document.getElementById('calendar-drawer');
      if (drawer) {
        drawer.classList.remove('translate-y-full', 'md:translate-x-full');
      }
      if (backdrop) {
        backdrop.classList.remove('opacity-0', 'pointer-events-none');
        backdrop.classList.add('opacity-100');
      }
      this.drawerOpen = true;
    },

    openWhatsApp: function(index, type) {
      const item = (this._drawerFiltered || [])[index];
      if (!item || typeof WhatsAppNotify === 'undefined') return;
      WhatsAppNotify.open(type, this.buildWaRow(item));
    },

    closeDrawer: function() {
      const backdrop = document.getElementById('calendar-drawer-backdrop');
      const drawer = document.getElementById('calendar-drawer');
      if (drawer) {
        drawer.classList.add('translate-y-full', 'md:translate-x-full');
      }
      if (backdrop) {
        backdrop.classList.add('opacity-0', 'pointer-events-none');
        backdrop.classList.remove('opacity-100');
      }
      this.drawerOpen = false;
    },

    setupDrawerClose: function() {
      const closeBtn = document.getElementById('calendar-drawer-close');
      const backdrop = document.getElementById('calendar-drawer-backdrop');
      const search = document.getElementById('calendar-drawer-search');
      if (closeBtn) closeBtn.onclick = () => this.closeDrawer();
      if (backdrop) backdrop.onclick = () => this.closeDrawer();
      if (search) {
        search.oninput = () => {
          if (this.openDrawerDateKey) this.openDrawer(this.openDrawerDateKey);
        };
      }
    },

    updateCurrentMonth: function(offset) {
      this.currentDate = new Date(this.currentDate.getFullYear(), this.currentDate.getMonth() + offset, 1);
      this.selectedDateKey = this.dateKeyFromParts(this.currentDate.getFullYear(), this.currentDate.getMonth() + 1, 1);
      this.loadCalendarData();
    },

    bindControls: function() {
      const prev = document.getElementById('cal-prev-month');
      const next = document.getElementById('cal-next-month');
      const todayBtn = document.getElementById('cal-today-btn');
      const search = document.getElementById('cal-search');
      const yearSelect = document.getElementById('cal-year-select');

      if (prev) prev.addEventListener('click', () => this.updateCurrentMonth(-1));
      if (next) next.addEventListener('click', () => this.updateCurrentMonth(1));
      if (todayBtn) {
        todayBtn.addEventListener('click', () => {
          this.currentDate = new Date(this.today.getFullYear(), this.today.getMonth(), 1);
          this.selectedDateKey = this.dateKeyFromParts(this.today.getFullYear(), this.today.getMonth() + 1, this.today.getDate());
          this.loadCalendarData();
        });
      }
      if (search) {
        search.addEventListener('input', (event) => {
          this.lowercaseSearchTerm = event.target.value.trim().toLowerCase();
          this.buildGrid();
          this.renderMemberList();
        });
      }
      if (yearSelect) {
        yearSelect.addEventListener('change', () => {
          const year = Number(yearSelect.value);
          if (Number.isInteger(year)) {
            this.currentDate = new Date(year, this.currentDate.getMonth(), 1);
            this.loadCalendarData();
          }
        });
      }

      document.querySelectorAll('.cal-filter-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          const key = chip.getAttribute('data-cal-filter');
          if (!key) return;
          this.activeFilters[key] = !this.activeFilters[key];
          // Keep at least one filter on
          if (!this.activeFilters.renewal && !this.activeFilters.overdue && !this.activeFilters.exit) {
            this.activeFilters[key] = true;
          }
          this.renderFilterChips();
          this.buildGrid();
          this.renderMemberList();
          if (this.drawerOpen && this.openDrawerDateKey) this.openDrawer(this.openDrawerDateKey);
        });
      });
    }
  };

  CalendarModule.init();
</script>
