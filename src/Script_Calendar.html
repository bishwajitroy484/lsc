<script>
  (() => {
    
    // Core state for calendar
    let currentDate = new Date(2026, 8, 1); // Mocked to Sep 2026 to match design
    let selectedDate = 10; // Highlight the 10th

    function loadCalendarData() {
      google.script.run
        .withSuccessHandler(renderCalendar)
        .api_getCalendarData(currentDate.getMonth(), currentDate.getFullYear());
    }

    function renderCalendar(response) {
      if (!response.success) return;

      const data = response.data; // stats, dayData, transactions
      
      // 1. Update Stats
      document.getElementById('cal-stat-paid').innerText = response.stats.paid;
      document.getElementById('cal-stat-due').innerText = response.stats.due;
      document.getElementById('cal-stat-overdue').innerText = response.stats.overdue;
      document.getElementById('cal-stat-total').innerText = response.stats.total;

      // 2. Build Grid
      buildGrid(response.dayData);

      // 3. Build List
      buildList(response.transactions);
    }

    function buildGrid(dayData) {
      const grid = document.getElementById('cal-grid');
      if (!grid) return;
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      // Determine days in month and starting day of week
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      let html = '';

      // Padding for previous month
      for (let i = 0; i < firstDay; i++) {
        const d = daysInPrevMonth - firstDay + i + 1;
        html += `<div class="flex flex-col items-center justify-start h-10 opacity-30"><span class="text-xs font-medium text-slate-400">${d}</span></div>`;
      }

      // Current month days
      for (let day = 1; day <= daysInMonth; day++) {
        const isSelected = day === selectedDate;
        const bgClass = isSelected ? 'bg-brand-primary text-white' : 'text-slate-700';
        const dots = dayData[day] || [];
        
        let dotsHtml = '';
        if (dots.includes('paid')) dotsHtml += `<div class="w-1 h-1 rounded-full bg-emerald-500"></div>`;
        if (dots.includes('due')) dotsHtml += `<div class="w-1 h-1 rounded-full bg-amber-400"></div>`;
        if (dots.includes('overdue')) dotsHtml += `<div class="w-1 h-1 rounded-full bg-red-500"></div>`;

        html += `
          <div class="flex flex-col items-center justify-start h-10 cursor-pointer group" onclick="alert('Open Drawer for Day: ${day}')">
            <div class="w-6 h-6 rounded flex items-center justify-center text-xs font-semibold ${bgClass} group-hover:bg-slate-100 group-hover:text-slate-800 transition-colors">
              ${day}
            </div>
            <div class="flex gap-0.5 mt-1 h-1">
              ${dotsHtml}
            </div>
          </div>
        `;
      }

      grid.innerHTML = html;
    }

    function buildList(txs) {
      const container = document.getElementById('cal-tx-list');
      let html = '';

      const statusStyles = {
        'Paid': 'bg-emerald-50 text-emerald-600 border-emerald-100',
        'Due': 'bg-amber-50 text-amber-600 border-amber-100',
        'Overdue': 'bg-red-50 text-red-600 border-red-100'
      };

      txs.forEach(tx => {
        const initials = tx.name.substring(0, 2).toUpperCase();
        const sStyle = statusStyles[tx.status];

        html += `
          <div class="flex items-center justify-between pb-3 border-b border-slate-50 last:border-0">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-xs font-bold shrink-0">
                ${initials}
              </div>
              <div>
                <h4 class="text-xs font-bold text-slate-800">${tx.name}</h4>
                <p class="text-[10px] text-slate-500">${tx.plan}</p>
              </div>
            </div>
            <div class="text-right flex flex-col items-end gap-1">
              <span class="text-xs font-bold text-slate-800">₹ ${tx.amount.toLocaleString('en-IN')}</span>
              <span class="text-[9px] font-bold px-1.5 py-0.5 rounded border ${sStyle}">${tx.status}</span>
              <span class="text-[9px] text-slate-400">${tx.time}</span>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // Init
    loadCalendarData();

  })();
</script>
