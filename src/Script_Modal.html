<script>
  const ModalManager = {
    
    open: function(modalId) {
      const backdrop = document.getElementById('modal-backdrop');
      const modal = document.getElementById(modalId);
      const root = document.getElementById('modal-root');
      
      // Make container visible
      root.classList.remove('hidden', 'pointer-events-none');
      
      // Trigger CSS transition animations
      requestAnimationFrame(() => {
        backdrop.classList.remove('opacity-0', 'pointer-events-none');
        backdrop.classList.add('opacity-100', 'pointer-events-auto');
        
        modal.classList.remove('translate-y-full', 'md:scale-95', 'md:opacity-0');
      });
      
      // Set default date to today
      const dateInput = modal.querySelector('input[type="date"]');
      if(dateInput && !dateInput.value) {
        dateInput.value = new Date().toISOString().split('T')[0];
      }
    },

    closeAll: function() {
      const backdrop = document.getElementById('modal-backdrop');
      const modals = document.querySelectorAll('[id^="modal-"]');
      const root = document.getElementById('modal-root');
      
      backdrop.classList.remove('opacity-100', 'pointer-events-auto');
      backdrop.classList.add('opacity-0', 'pointer-events-none');
      
      modals.forEach(m => {
        if (m.id !== 'modal-backdrop') {
          m.classList.add('translate-y-full', 'md:scale-95', 'md:opacity-0');
        }
      });
      
      // Hide container after animation finishes
      setTimeout(() => {
        root.classList.add('hidden', 'pointer-events-none');
      }, 300);
    },

    submitPayment: function(e) {
      e.preventDefault();
      
      const form = e.target;
      const btn = document.getElementById('btn-submit-payment');
      const originalText = btn.innerHTML;
      
      // Show loading spinner on button
      btn.innerHTML = `<span class="material-symbols-rounded animate-spin text-lg">progress_activity</span> Saving...`;
      btn.disabled = true;
      btn.classList.add('opacity-75');

      // Map form data to the PAYMENTS tab columns
      const payload = {
        paymentId: 'TXN-' + Date.now().toString().slice(-6),
        memberId: form.memberId.value,
        amount: form.amount.value,
        paymentDate: form.paymentDate.value,
        paymentMode: form.paymentMode.value,
        notes: form.notes.value,
        paymentStatus: 'PAY-1' // Active/Paid ID based on your Dropdowns sheet
      };

      // Call Google Apps Script API
      google.script.run
        .withSuccessHandler((res) => {
          btn.innerHTML = originalText;
          btn.disabled = false;
          btn.classList.remove('opacity-75');
          
          if(res.success) {
            form.reset();
            ModalManager.closeAll();
            
            // Re-fetch dashboard data if we are currently on it
            if(AppState.currentView === 'dashboard') {
              if(typeof loadDashboard === 'function') loadDashboard();
            }
          } else {
            alert('Server Error: ' + res.error);
          }
        })
        .api_createRecord('PAYMENTS', payload);
    }
  };
</script>
