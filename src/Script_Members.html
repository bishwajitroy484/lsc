<script>
  var MembersApp = {
    allData: [],
    filteredData: [],
    dropdowns: {},
    schemas: {},
    currentFilter: 'All', 
    searchQuery: '',
    
    isDropdownsLoaded: false,
    isMembersLoaded: false,
    
    deleteState: { type: null, id: null }, 
    currentActiveMember: null,

    statusBadgeClass: function(name) {
      const lower = String(name || '').toLowerCase();
      if (lower.includes('in-active') || lower.includes('inactive')) return 'bg-red-50 text-red-700 border-red-200';
      if (lower === 'active') return 'bg-emerald-50 text-emerald-700 border-emerald-200';
      return 'bg-slate-50 text-slate-600 border-slate-200';
    },
    currentMemberPayments: [], 
    effectiveDueDate: null, 
    chartInstance: null,

    pageSize: 50,
    renderedCount: 0,
    isLoadingMore: false,
    scrollListenerBound: false,

    init: function() {
      this.isDropdownsLoaded = false;
      this.isMembersLoaded = false;
      
      this.showShimmer();
      this.initDatePickers(); 
      
      google.script.run
        .withSuccessHandler((res) => {
           this.onDropdownsLoaded(res);
           this.isDropdownsLoaded = true;
           this.checkAndRender();
        })
        .api_getGlobalDropdowns();
        
      google.script.run
        .withSuccessHandler((res) => {
           this.onDataLoaded(res);
           this.isMembersLoaded = true;
           this.checkAndRender();
        })
        .api_getMembers();
    },
    getSafeAvatarUrl: function(rawStr) {
        if (!rawStr) return '';
        let str = String(rawStr);
        
        // 1. If it's a Google Drive URL, extract just the ID
        if (str.includes('drive.google.com')) {
            const match = str.match(/id=([a-zA-Z0-9_-]+)/) || str.match(/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                str = match[1]; // Isolate the pure ID
            }
        }
        
        // 2. If it's a pure ID, convert it to the unblockable Thumbnail endpoint
        if (!str.includes('http') && !str.includes('/')) {
            return 'https://drive.google.com/thumbnail?id=' + str + '&sz=w200-h200';
        }
        
        // 3. Otherwise, return the standard web URL (Imgur, AWS, etc.)
        return str; 
    },

    previewImage: function(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('mem-profile-preview').src = e.target.result;
                document.getElementById('mem-profile-preview-container').classList.remove('hidden');
            }
            reader.readAsDataURL(input.files[0]);
        }
    },

    checkAndRender: function() {
      if (this.isDropdownsLoaded && this.isMembersLoaded) {
          this.applyFilters();
      }
    },

    initDatePickers: function() {
      flatpickr(".date-field:not(#mem-dob)", {
        dateFormat: "d-M-Y",    
        allowInput: true,
        disableMobile: "true"   
      });
      
      flatpickr("#mem-dob", {
        dateFormat: "d-M-Y",    
        allowInput: true,
        disableMobile: "true",
        onChange: (selectedDates, dateStr) => {
            this.filterBatchesByAge(dateStr);
        }
      });
    },

    filterBatchesByAge: function(dobStr) {
        let batches = this.dropdowns.batch || [];
        let age = 99;

        if (dobStr) {
            let dob = new Date(this.parseToISODate(dobStr));
            if (!isNaN(dob)) {
                const today = new Date();
                age = today.getFullYear() - dob.getFullYear();
                const m = today.getMonth() - dob.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
                    age--;
                }
            }
        }

        const filteredBatches = batches.filter(b => {
            const groupName = String(b.groups || b.group || b.name || '').toLowerCase();
            const isKidBatch = groupName.includes('kid') || groupName.includes('child');
            return age <= 18 ? isKidBatch : !isKidBatch;
        });

        const currentBatch = document.getElementById('mem-batch').value;
        this.populateSelect('mem-batch', filteredBatches, 'groups');
        
        const valid = filteredBatches.find(b => b.id === currentBatch);
        if (valid) {
            document.getElementById('mem-batch').value = currentBatch;
        } else if (filteredBatches.length > 0) {
            document.getElementById('mem-batch').value = filteredBatches[0].id;
        }

        this.onPlanOrBatchChange();
    },

    setDatePicker: function(id, dateObjOrStr) {
      const el = document.getElementById(id);
      if (el && el._flatpickr) {
        el._flatpickr.setDate(dateObjOrStr);
      } else if (el) {
        el.value = dateObjOrStr; 
      }
    },

    showShimmer: function() {
      let mHtml = '';
      for(let i=0; i<5; i++){
        mHtml += '<div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-3"><div class="flex items-start gap-3"><div class="w-10 h-10 rounded-full shimmer shrink-0"></div><div class="space-y-2 flex-1"><div class="h-3 w-32 shimmer rounded"></div><div class="h-2 w-20 shimmer rounded"></div></div></div></div>';
      }
      document.getElementById('mobile-cards-container').innerHTML = mHtml;
      
      let dHtml = '';
      for(let i=0; i<5; i++){
        dHtml += '<tr><td colspan="6" class="px-4 py-4"><div class="h-6 w-full shimmer rounded"></div></td></tr>';
      }
      document.getElementById('desktop-table-body').innerHTML = dHtml;
    },

    getDueInfo: function(dueDateStr) {
      if (!dueDateStr || dueDateStr === 'N/A') {
        return { text: 'No Due Date', class: 'bg-slate-50 text-slate-500 border-slate-200', days: 999 };
      }
      
      const today = new Date();
      today.setHours(0,0,0,0);
      const due = new Date(dueDateStr);
      due.setHours(0,0,0,0);
      
      const diffTime = due - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      if (diffDays < 0) {
        return { text: `Overdue by ${Math.abs(diffDays)} Days`, class: 'bg-red-50 text-red-600 border-red-200', days: diffDays };
      } else if (diffDays === 0) {
        return { text: 'Due Today', class: 'bg-amber-50 text-amber-600 border-amber-200', days: diffDays };
      } else if (diffDays === 1) {
        return { text: 'Due in 1 Day', class: 'bg-amber-50 text-amber-600 border-amber-200', days: diffDays };
      } else if (diffDays <= 5) {
        return { text: `Due in ${diffDays} Days`, class: 'bg-yellow-50 text-yellow-600 border-yellow-200', days: diffDays };
      } else {
        return { text: `Due in ${diffDays} Days`, class: 'bg-emerald-50 text-emerald-600 border-emerald-200', days: diffDays };
      }
    },

    formatDateDDMMMYYYY: function(dateStr) {
      return AppUtils.formatDateDDMMMYYYY(dateStr, true, true);
    },

    parseToISODate: AppUtils.parseToISODate,

    isQuarterPlan: function(planName) {
      return String(planName || '').toUpperCase().indexOf('QUARTER') >= 0;
    },

    cycleEndFromStart: function(start, planName) {
      const end = new Date(start);
      const name = String(planName || '').toUpperCase();
      if (name.indexOf('QUARTER') >= 0) end.setDate(end.getDate() + 90);
      else if (name.indexOf('YEAR') >= 0) end.setFullYear(end.getFullYear() + 1);
      else if (name.indexOf('TRIAL') >= 0) end.setDate(end.getDate() + 7);
      else if (name.indexOf('ADHOC') >= 0 || name.indexOf('AD-HOC') >= 0) end.setDate(end.getDate() + 1);
      else end.setMonth(end.getMonth() + 1);
      return end;
    },

    nextCycleStart: function(cycleEnd, planName) {
      const next = new Date(cycleEnd);
      if (!this.isQuarterPlan(planName)) next.setDate(next.getDate() + 1);
      return next;
    },

    parseMoneyInput: function(value) {
      const text = String(value === undefined || value === null ? '' : value).trim();
      if (text === '') return 0;
      if (!/^\d+(\.\d{1,2})?$/.test(text)) return null;
      const amount = Number(text);
      if (!Number.isFinite(amount) || amount < 0) return null;
      return Math.round(amount * 100) / 100;
    },

    paymentSplitFromFields: function(cashValue, upiValue) {
      const cash = this.parseMoneyInput(cashValue);
      const upi = this.parseMoneyInput(upiValue);
      if (cash === null || upi === null) {
        Toast.error('Cash and UPI must be numbers, 0 or more.');
        return null;
      }
      const total = Math.round((cash + upi) * 100) / 100;
      const modes = this.dropdowns.paymentmode || [];
      const findMode = function(word) {
        const needle = String(word || '').trim().toLowerCase();
        const labelOf = function(item) {
          return String(item.name || item.label || item.value || '').trim().toLowerCase();
        };
        const keyOf = function(item) {
          return String(item.id || item.key || '').trim().toLowerCase();
        };
        const exact = modes.find(function(item) {
          return keyOf(item) === needle || labelOf(item) === needle;
        });
        const hit = exact || modes.find(function(item) {
          return keyOf(item).indexOf(needle) >= 0 || labelOf(item).indexOf(needle) >= 0;
        });
        return hit ? (hit.id || hit.key || hit.name) : '';
      };
      let paymentMode = findMode('split') || 'Split';
      if (cash > 0 && upi <= 0) paymentMode = findMode('cash') || 'Cash';
      else if (upi > 0 && cash <= 0) paymentMode = findMode('upi') || 'UPI';
      return { cashAmount: cash, upiAmount: upi, amount: total, paymentMode: paymentMode };
    },

    paymentSplitLabel: function(payment) {
      if (!payment) return '';
      const modeLabel = this.getName('paymentmode', payment.paymentMode) || payment.paymentMode || '';
      const cashSet = payment.cashAmount !== undefined && payment.cashAmount !== null && String(payment.cashAmount).trim() !== '';
      const upiSet = payment.upiAmount !== undefined && payment.upiAmount !== null && String(payment.upiAmount).trim() !== '';
      const parts = [];
      if (cashSet || upiSet) {
        const cash = Number(payment.cashAmount) || 0;
        const upi = Number(payment.upiAmount) || 0;
        if (cash) parts.push('Cash ' + AppUtils.formatCurrency(cash));
        if (upi) parts.push('UPI ' + AppUtils.formatCurrency(upi));
      }
      if (modeLabel && parts.length) return modeLabel + ' · ' + parts.join(' · ');
      if (parts.length) return parts.join(' · ');
      return modeLabel;
    },

    fillPaymentSplitFields: function(cashId, upiId, payment, amount) {
      const cashEl = document.getElementById(cashId);
      const upiEl = document.getElementById(upiId);
      if (!cashEl || !upiEl) return;
      const cashSet = payment && payment.cashAmount !== undefined && payment.cashAmount !== null && String(payment.cashAmount).trim() !== '';
      const upiSet = payment && payment.upiAmount !== undefined && payment.upiAmount !== null && String(payment.upiAmount).trim() !== '';
      if (cashSet || upiSet) {
        cashEl.value = Number(payment.cashAmount) || 0;
        upiEl.value = Number(payment.upiAmount) || 0;
        return;
      }
      const modeName = payment ? String(this.getName('paymentmode', payment.paymentMode) || payment.paymentMode || '').toLowerCase() : '';
      const total = Number(amount) || 0;
      if (modeName.indexOf('upi') >= 0 || modeName.indexOf('gpay') >= 0 || modeName.indexOf('phonepe') >= 0) {
        cashEl.value = 0;
        upiEl.value = total;
      } else if (modeName.indexOf('cash') >= 0 || !payment) {
        cashEl.value = total;
        upiEl.value = 0;
      } else {
        cashEl.value = 0;
        upiEl.value = 0;
      }
    },

    onDropdownsLoaded: function(response) {
      if (!response || !response.success) {
        const errorText = (response && response.error) ? response.error : 'Failed to load configuration.';
        return Toast.error(errorText);
      }

      this.dropdowns = response.data && response.data.options ? response.data.options : {};
      this.schemas = response.data && response.data.schemas ? response.data.schemas : {};
      
      const plans = this.dropdowns.membership || [];
      const batches = this.dropdowns.batch || [];
      const statuses = this.dropdowns.status || [];
      const payStatuses = this.dropdowns.paymentstatus || this.dropdowns.status || [];
      
      this.populateSelect('mem-plan', plans);
      this.populateSelect('mem-batch', batches, 'groups');
      this.populateSelect('mem-status', statuses);
      this.populateSelect('pay-status', payStatuses, null, 'Select Status...');
      
      this.populateFilterStatus(statuses);
      this.populateSelect('filter-batch', batches, null, 'All Batches', true);
      this.populateSelect('filter-plan', plans, null, 'All Memberships', true);
    },

    populateFilterStatus: function(statuses) {
      const el = document.getElementById('filter-status');
      if (!el) return;
      const currentVal = el.value || 'All';
      let html = `<option value="All">All Status</option>`;
      html += `<option value="Active">Active</option>`;
      html += `<option value="Due Soon">Due Soon</option>`;
      html += `<option value="Overdue">Overdue</option>`;
      if (Array.isArray(statuses)) {
        statuses.forEach(opt => {
          const name = opt.name || opt.id;
          if (name && name.toLowerCase() !== 'active') {
            html += `<option value="${opt.id}">${name}</option>`;
          }
        });
      }
      el.innerHTML = html;
      if (Array.from(el.options).some(o => o.value === currentVal)) {
        el.value = currentVal;
      }
    },

    applyFilters: function() {
      const fStatus = document.getElementById('filter-status')?.value || 'All';
      const fBatch = document.getElementById('filter-batch')?.value || 'All';
      const fPlan = document.getElementById('filter-plan')?.value || 'All';

      this.filteredData = this.allData.filter(m => {
        const sName = this.getName('status', m.status);
        const dueInfo = this.getDueInfo(m.dueDate);
        
        let matchStatus = true;
        if (fStatus === 'All') {
          matchStatus = true;
        } else if (fStatus === 'Active') {
          matchStatus = (sName.toLowerCase() === 'active');
        } else if (fStatus === 'Due Soon') {
          matchStatus = (dueInfo.days >= 0 && dueInfo.days <= 5);
        } else if (fStatus === 'Overdue') {
          matchStatus = (dueInfo.days < 0);
        } else {
          matchStatus = (m.status === fStatus || sName.toLowerCase() === fStatus.toLowerCase() || (this.dropdowns.status && this.getName('status', fStatus) === sName));
        }
        
        let matchBatch = fBatch === 'All' || m.batchId === fBatch;
        let matchPlan = fPlan === 'All' || m.membershipId === fPlan;
        
        let matchSearch = !this.searchQuery || 
                          (m.fullName && m.fullName.toLowerCase().includes(this.searchQuery)) || 
                          (m.phone && m.phone.includes(this.searchQuery)) ||
                          (m.memberId && m.memberId.toLowerCase().includes(this.searchQuery));

        return matchStatus && matchBatch && matchPlan && matchSearch;
      });
      this.render();
    },

    populateSelect: function(elementId, optionsArray, secondaryLabel = null, defaultText = "Select Option...", isFilter = false) {
      const el = document.getElementById(elementId);
      if(!el) return;
      const currentValue = isFilter ? el.value : '';
      let html = isFilter ? `<option value="All">${defaultText}</option>` : `<option value="" disabled selected>${defaultText}</option>`;
      if (Array.isArray(optionsArray)) {
        optionsArray.forEach(opt => {
          const label = secondaryLabel && opt[secondaryLabel] ? `${opt.name} (${opt[secondaryLabel]})` : opt.name;
          html += `<option value="${opt.id}">${label}</option>`;
        });
      }
      el.innerHTML = html;
      if (isFilter && Array.from(el.options).some(option => option.value === currentValue)) {
        el.value = currentValue;
      }
    },

    getName: function(type, id) {
      if(!id || !this.dropdowns[type]) return id || '--';
      const raw = String(id).trim();
      const match = this.dropdowns[type].find(item => {
        const key = String(item.id || item.key || '').trim();
        return key === raw || key.toLowerCase() === raw.toLowerCase();
      });
      if (!match) return id;
      return match.name || match.label || match.value || id;
    },

    isPaidPayment: function(payment) {
      const status = String(this.getName('paymentstatus', payment && payment.paymentStatus) || '').trim().toLowerCase();
      return status === 'paid' || status === 'completed';
    },

    fetchData: function(callback) {
      google.script.run
        .withSuccessHandler((res) => {
            this.onDataLoaded(res);
            this.applyFilters();
            if(typeof callback === 'function') callback();
        })
        .withFailureHandler((err) => {
            Toast.error((err && err.message) || 'Could not load members.');
            if(typeof callback === 'function') callback();
        })
        .api_getMembers();
    },

    onDataLoaded: function(response) {
      if (!response.success) {
        document.getElementById('desktop-table-body').innerHTML = `<tr><td colspan="6" class="text-center text-red-500 py-8 font-bold">Failed to load members: ${response.error}</td></tr>`;
        document.getElementById('mobile-cards-container').innerHTML = `<div class="bg-red-50 text-red-500 p-4 text-center rounded-lg font-bold">Failed to load members.</div>`;
        return Toast.error(response.error);
      }
      this.allData = response.data || [];
      if (response.currencyFormat) {
        AppUtils.setCurrencyFormat(response.currencyFormat);
      }
    },

    _debouncedApplyFilters: null,
    search: function(query) {
      this.searchQuery = query.toLowerCase().trim();
      if (!this._debouncedApplyFilters) {
        this._debouncedApplyFilters = AppUtils.debounce(() => this.applyFilters(), 150);
      }
      this._debouncedApplyFilters();
    },

    setMobileFilter: function(statusName) {
      const el = document.getElementById('filter-status');
      if (el) el.value = statusName;
      this.currentFilter = statusName;
      this.applyFilters();
    },

    setStatusFilter: function(statusName) {
      this.setMobileFilter(statusName);
    },

    buildDesktopRowHtml: function(member) {
      const sName = this.getName('status', member.status);
      const sLower = String(sName).toLowerCase();
      
      const sClass = this.statusBadgeClass(sLower);

      const planName = this.getName('membership', member.membershipId);
      const batchName = this.getName('batch', member.batchId);
      
      const batches = this.dropdowns.batch || [];
      const batchMatch = batches.find(b => b.id === member.batchId);
      const groupName = batchMatch ? (batchMatch.groups || batchMatch.group || batchMatch.name || 'NA') : 'NA';
      const groupBadgeColor = groupName.toLowerCase().includes('kid') ? 'text-amber-600' : 'text-brand-primary';
      
      const initials = member.fullName ? member.fullName.substring(0, 2).toUpperCase() : 'NA';
      let avatarHtml = initials;
      
      if (member.profileImage) {
        const imgSrcStr = this.getSafeAvatarUrl(member.profileImage);
        avatarHtml = '<img src="' + imgSrcStr + '" class="w-full h-full rounded-full object-cover">';
      }

      const dobStr = member.dob ? member.dob : 'N/A';
      const genderStr = member.gender || 'N/A';
      const phoneStr = member.phone || 'No Phone';
      const joinStr = member.joinDate ? member.joinDate : '--';
      
      let dueStr = member.dueDate ? member.dueDate : 'N/A';
      let dueInfo = this.getDueInfo(member.dueDate);
      if (sLower.includes('inactive') || sLower.includes('in-active') || sLower.includes('exit')) {
        dueStr = '--';
        dueInfo = { text: 'Account Closed', class: 'bg-slate-100 text-slate-500 border-slate-200' };
      }

      const memberJson = JSON.stringify(member).replace(/"/g, '&quot;');

      return `
        <tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-colors cursor-pointer group" onclick="MembersApp.openDetails(${memberJson})">
          <td class="px-4 py-3">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-[11px] font-bold shrink-0 shadow-sm border border-slate-200">
                 ${avatarHtml}
              </div>
              <div>
                <div class="font-bold text-slate-800 text-xs md:text-sm group-hover:text-brand-primary transition-colors">${member.fullName}</div>
                <div class="text-[11px] text-slate-500 font-medium mt-0.5">📞 ${phoneStr} • ${member.memberId || '--'} • ${genderStr} • DOB: ${dobStr}</div>
              </div>
            </div>
          </td>
          <td class="px-4 py-3">
             <div class="text-xs md:text-sm text-slate-800 font-bold">${planName}</div>
             <div class="text-[11px] text-slate-500 font-medium mt-0.5">${batchName} <span class="font-bold uppercase tracking-wider ${groupBadgeColor}">(${groupName})</span></div>
          </td>
          <td class="px-4 py-3">
             <div class="text-[11px] text-slate-500 font-medium mb-0.5">Joined: <span class="font-bold text-slate-700">${joinStr}</span></div>
             <div class="text-[11px] text-slate-500 font-medium mb-1">Due: <span class="font-bold text-slate-700">${dueStr}</span></div>
             <div><span class="text-[10px] font-bold px-2 py-0.5 rounded border ${Number(member.pendingAmount) > 0 ? 'bg-amber-50 text-amber-700 border-amber-200' : dueInfo.class} uppercase tracking-wider">${Number(member.pendingAmount) > 0 ? ('Partial · Pending ' + AppUtils.formatCurrency(member.pendingAmount)) : dueInfo.text}</span></div>
          </td>
          <td class="px-4 py-3"><span class="text-[10px] font-bold px-2 py-0.5 rounded border ${sClass} uppercase tracking-wider">${sName}</span></td>
          <td class="px-4 py-3 text-right">
            <button onclick="event.stopPropagation(); MembersApp.openModal(${memberJson})" class="w-8 h-8 text-slate-400 hover:text-brand-primary hover:bg-red-50 rounded-full transition-colors">
               <span class="material-symbols-rounded text-[18px]">edit</span>
            </button>
          </td>
        </tr>`;
    },

    buildMobileCardHtml: function(member) {
      const sName = this.getName('status', member.status);
      const sLower = String(sName).toLowerCase();
      
      const sClass = this.statusBadgeClass(sLower);

      const planName = this.getName('membership', member.membershipId);
      const batchName = this.getName('batch', member.batchId);
      
      const batches = this.dropdowns.batch || [];
      const batchMatch = batches.find(b => b.id === member.batchId);
      const groupName = batchMatch ? (batchMatch.groups || batchMatch.group || batchMatch.name || 'NA') : 'NA';
      const groupBadgeColor = groupName.toLowerCase().includes('kid') ? 'text-amber-600' : 'text-brand-primary';
      
      const initials = member.fullName ? member.fullName.substring(0, 2).toUpperCase() : 'NA';
      let avatarHtml = initials;
      
      if (member.profileImage) {
        const imgSrcStr = this.getSafeAvatarUrl(member.profileImage);
        avatarHtml = '<img src="' + imgSrcStr + '" class="w-full h-full rounded-full object-cover">';
      }

      const phoneStr = member.phone || 'No Phone';
      const joinStr = member.joinDate ? member.joinDate : '--';
      
      let dueInfo = this.getDueInfo(member.dueDate);
      if (sLower.includes('inactive') || sLower.includes('in-active') || sLower.includes('exit')) {
        dueInfo = { text: 'Account Closed', class: 'bg-slate-100 text-slate-500 border-slate-200' };
      }

      const memberJson = JSON.stringify(member).replace(/"/g, '&quot;');

      return `
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-3 cursor-pointer" onclick="MembersApp.openDetails(${memberJson})">
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center font-bold text-xs shrink-0 shadow-sm border border-slate-200">
                 ${avatarHtml}
              </div>
              <div>
                 <h3 class="font-bold text-sm md:text-base text-slate-800">${member.fullName}</h3>
                 <p class="text-[11px] font-medium text-slate-400">📞 ${phoneStr} • ${member.memberId || '--'}</p>
              </div>
            </div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${sClass} uppercase">${sName}</span>
          </div>
          
          <div class="grid grid-cols-2 gap-2 text-xs border-t border-slate-100 pt-3">
            <div><span class="text-slate-400">Plan:</span> <span class="font-bold text-slate-700">${planName}</span></div>
            <div class="text-right"><span class="text-[10px] font-bold px-2 py-0.5 rounded border ${Number(member.pendingAmount) > 0 ? 'bg-amber-50 text-amber-700 border-amber-200' : dueInfo.class} uppercase tracking-wider">${Number(member.pendingAmount) > 0 ? ('Pending ' + AppUtils.formatCurrency(member.pendingAmount)) : dueInfo.text}</span></div>

               <div><span class="text-slate-400">Joined:</span> <span class="font-bold text-slate-700">${joinStr}</span></div>
            </div>

    render: function() {
      const tBody = document.getElementById('desktop-table-body');
      const mContainer = document.getElementById('mobile-cards-container');
      if (!tBody || !mContainer) return;

      this.renderedCount = 0;
      this.isLoadingMore = false;

      if (this.filteredData.length === 0) {
        tBody.innerHTML = `<tr><td colspan="6" class="text-center py-12 px-4"><div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-3"><span class="material-symbols-rounded text-3xl text-slate-300">search_off</span></div><h3 class="text-slate-700 font-bold text-sm">No Results Found</h3></td></tr>`;
        mContainer.innerHTML = `<div class="bg-white p-8 text-center rounded-xl border border-slate-200 text-slate-500 font-medium">No members match your criteria.</div>`;
        return;
      }

      const initialBatch = this.filteredData.slice(0, this.pageSize);
      tBody.innerHTML = initialBatch.map(m => this.buildDesktopRowHtml(m)).join('');
      mContainer.innerHTML = initialBatch.map(m => this.buildMobileCardHtml(m)).join('');
      this.renderedCount = initialBatch.length;

      this.initScrollListener();
    },

    loadMore: function() {
      if (this.isLoadingMore || this.renderedCount >= this.filteredData.length) return;
      this.isLoadingMore = true;

      const tBody = document.getElementById('desktop-table-body');
      const mContainer = document.getElementById('mobile-cards-container');
      if (!tBody || !mContainer) { this.isLoadingMore = false; return; }

      // Append shimmer placeholders at bottom while keeping top rows intact
      const dShim = document.createElement('tr');
      dShim.id = 'members-lazy-shimmer-desktop';
      dShim.className = 'lazy-loading-row';
      dShim.innerHTML = `<td colspan="6" class="px-4 py-3"><div class="space-y-2 py-1"><div class="h-6 w-full shimmer rounded"></div><div class="h-6 w-4/5 shimmer rounded"></div></div></td>`;
      tBody.appendChild(dShim);

      const mShim = document.createElement('div');
      mShim.id = 'members-lazy-shimmer-mobile';
      mShim.innerHTML = `<div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-3"><div class="flex items-start gap-3"><div class="w-10 h-10 rounded-full shimmer shrink-0"></div><div class="space-y-2 flex-1"><div class="h-3.5 w-32 shimmer rounded"></div><div class="h-2.5 w-20 shimmer rounded"></div></div></div></div>`;
      mContainer.appendChild(mShim);

      setTimeout(() => {
        const dShimEl = document.getElementById('members-lazy-shimmer-desktop');
        if (dShimEl) dShimEl.remove();
        const mShimEl = document.getElementById('members-lazy-shimmer-mobile');
        if (mShimEl) mShimEl.remove();

        const startIdx = this.renderedCount;
        const nextBatch = this.filteredData.slice(startIdx, startIdx + this.pageSize);
        if (nextBatch.length > 0) {
          const dHtml = nextBatch.map(m => this.buildDesktopRowHtml(m)).join('');
          const mHtml = nextBatch.map(m => this.buildMobileCardHtml(m)).join('');
          tBody.insertAdjacentHTML('beforeend', dHtml);
          mContainer.insertAdjacentHTML('beforeend', mHtml);
          this.renderedCount += nextBatch.length;
        }
        this.isLoadingMore = false;
      }, 160);
    },

    initScrollListener: function() {
      if (this.scrollListenerBound) return;
      this.scrollListenerBound = true;

      const handleScroll = () => {
        if (this.isLoadingMore || this.renderedCount >= this.filteredData.length) return;
        const sContainer = document.getElementById('members-scroll-container');
        const appRoot = document.getElementById('app-root');

        const checkNearBottom = (el) => el && (el.scrollTop + el.clientHeight >= el.scrollHeight - 100);

        if (checkNearBottom(sContainer) || checkNearBottom(appRoot)) {
          this.loadMore();
        }
      };

      const debouncedScroll = AppUtils.debounce(handleScroll, 60);

      const sContainer = document.getElementById('members-scroll-container');
      if (sContainer && typeof sContainer.addEventListener === 'function') sContainer.addEventListener('scroll', debouncedScroll, { passive: true });

      const appRoot = document.getElementById('app-root');
      if (appRoot && typeof appRoot.addEventListener === 'function') appRoot.addEventListener('scroll', debouncedScroll, { passive: true });
    },

    isNonRecurringPlan: function(membershipId) {
      const plans = this.dropdowns.membership || [];
      const planMatch = plans.find(p => String(p.id) === String(membershipId));
      if (!planMatch) return false;
      const planName = String(planMatch.name || planMatch.label || '').toUpperCase();
      const frequency = String(planMatch.frequency || '').toUpperCase();
      const blob = frequency + ' ' + planName;
      return blob.indexOf('TRIAL') >= 0 || blob.indexOf('ADHOC') >= 0 || blob.indexOf('AD-HOC') >= 0;
    },

    calculateEffectiveCoverage: function(m) {
        // Ad-hoc / Trial: no renewal due date (consistent with member list)
        if (this.isNonRecurringPlan(m && m.membershipId)) {
          this.effectiveDueDate = null;
          return;
        }

        let effectiveDue = null;
        
        if (this.currentMemberPayments && this.currentMemberPayments.length > 0) {
            const validPayments = this.currentMemberPayments.filter(p => {
                return p.endDate && (this.isPaidPayment(p) || this.isPartialPayment(p));
            });
            
            validPayments.sort((a, b) => new Date(this.parseToISODate(b.endDate)) - new Date(this.parseToISODate(a.endDate)));
            
            if (validPayments.length > 0) {
                effectiveDue = new Date(this.parseToISODate(validPayments[0].endDate));
            }
        }
        
        if (!effectiveDue && m.joinDate) {
            effectiveDue = new Date(this.parseToISODate(m.joinDate));
        }
        
        if (!effectiveDue && m.dueDate && m.dueDate !== 'N/A') {
            effectiveDue = new Date(this.parseToISODate(m.dueDate));
        }
        
        this.effectiveDueDate = effectiveDue;
    },

    updateDetailHeader: function(member) {
        const isNonRecurring = this.isNonRecurringPlan(member.membershipId);
        const validPaymentsCount = this.currentMemberPayments.filter(p => {
            return this.isPaidPayment(p);
        }).length;

        let dueStr = this.effectiveDueDate ? this.formatDateDDMMMYYYY(this.effectiveDueDate) : 'N/A';
        let dueInfo = this.getDueInfo(dueStr);
        
        let mainStatusName = this.getName('status', member.status);
        const statLower = String(mainStatusName).toLowerCase();
        const today = new Date();
        today.setHours(0,0,0,0);
        
        if (statLower.includes('inactive') || statLower.includes('in-active') || statLower.includes('exit')) {
             mainStatusName = 'In-Active';
             dueStr = '--';
             dueInfo = { text: 'Account Closed', class: 'bg-slate-100 text-slate-500 border-slate-200' };
        } else if (isNonRecurring) {
             // Match list behavior: never show a renewal countdown for Trial / Ad-hoc
             dueStr = 'N/A';
             dueInfo = this.getDueInfo('N/A');
             if (validPaymentsCount > 0 && member.exitDate) {
               const exit = new Date(this.parseToISODate(member.exitDate));
               exit.setHours(0,0,0,0);
               if (!isNaN(exit) && exit < today) {
                 mainStatusName = 'Expired';
                 dueStr = '--';
                 dueInfo = { text: 'Plan Expired', class: 'bg-slate-100 text-slate-500 border-slate-200' };
               }
             }
        } else {
            if (this.effectiveDueDate && this.effectiveDueDate >= today) {
                mainStatusName = 'Active';
            } else if (this.effectiveDueDate && this.effectiveDueDate < today) {
                mainStatusName = 'Overdue';
            }
        }

        document.getElementById('det-due-date').innerHTML = dueStr; 

        const dueBadge = document.getElementById('det-due-days');
        dueBadge.innerText = dueInfo.text;
        dueBadge.className = `text-[8px] font-bold px-1.5 py-0.5 rounded border uppercase tracking-wider ${dueInfo.class}`;

        let sClass = 'bg-emerald-50 text-emerald-600 border-emerald-100';
        if (mainStatusName.toLowerCase() === 'due soon') sClass = 'bg-amber-50 text-amber-600 border-amber-100';
        if (mainStatusName.toLowerCase() === 'overdue' || mainStatusName.toLowerCase() === 'in-active') sClass = 'bg-red-50 text-red-600 border-red-100';
        if (mainStatusName === 'Expired') sClass = 'bg-slate-100 text-slate-600 border-slate-200';

        const openPartial = (this.currentMemberPayments || []).reduce((sum, payment) => {
          return sum + (this.isPartialPayment(payment) ? Number(String(payment.pendingAmount || 0).replace(/[^0-9.-]+/g, '')) : 0);
        }, 0);
        if (openPartial > 0 && !statLower.includes('inactive') && !statLower.includes('in-active')) {
          mainStatusName = 'Partial';
          sClass = 'bg-amber-50 text-amber-700 border-amber-200';
          dueBadge.innerText = 'Pending ' + AppUtils.formatCurrency(openPartial);
          dueBadge.className = 'text-[8px] font-bold px-1.5 py-0.5 rounded border uppercase tracking-wider bg-amber-50 text-amber-700 border-amber-200';
        }

        document.getElementById('det-status').innerText = mainStatusName;
        document.getElementById('det-status').className = `text-[8px] font-bold px-1.5 py-0.5 rounded border uppercase tracking-wider ${sClass}`;
    },

    renderPaymentHistory: function() {
      const tBody = document.getElementById('det-history-body');
      const cardList = document.getElementById('det-history-cards');
      
      let virtualRecords = [];
      const m = this.currentActiveMember;
      let currentDue = this.effectiveDueDate ? new Date(this.effectiveDueDate) : null;
      let today = new Date();
      today.setHours(0,0,0,0);
      
      const mainStatusName = this.getName('status', m.status).toLowerCase();
      const isActive = !mainStatusName.includes('inactive') && !mainStatusName.includes('in-active') && !mainStatusName.includes('exit');

      if (currentDue && !isNaN(currentDue)) {
          const plans = this.dropdowns.membership || [];
          const planMatch = plans.find(p => p.id === m.membershipId);
          const planName = String(`${planMatch && planMatch.name ? planMatch.name : ''} ${planMatch && planMatch.frequency ? planMatch.frequency : ''}`).toUpperCase();
          
          const validPaymentsCount = this.currentMemberPayments.filter(p => {
              return this.isPaidPayment(p);
          }).length;

          const isNonRecurring = planName.includes('TRIAL') || planName.includes('ADHOC') || planName.includes('AD-HOC');
          const maxCycles = isNonRecurring ? (validPaymentsCount > 0 ? 0 : 1) : 36;
          
          let iterCount = 1;
          
          while (currentDue < today && iterCount <= maxCycles) {
              let vStart = new Date(currentDue);
              let vEnd = this.cycleEndFromStart(vStart, planName);
              
              const cycleText = isNonRecurring ? 'Expired / Unpaid' : `Missed Cycle ${iterCount}`;

              virtualRecords.push({
                  isVirtual: true,
                  cycleLabel: cycleText,
                  paidDate: this.formatDateDDMMMYYYY(vStart), 
                  amount: m.membershipAmount || 0,
                  paymentMode: 'Unpaid',
                  paymentStatus: 'OVERDUE',
                  virtualStartDate: vStart.toISOString(), 
                  virtualEndDate: vEnd.toISOString()
              });
              
              currentDue = this.nextCycleStart(vEnd, planName);
              iterCount++;
          }
          
          if (isActive && !isNonRecurring && iterCount <= maxCycles && currentDue >= today) {
              let vStart = new Date(currentDue);
              let vEnd = this.cycleEndFromStart(vStart, planName); 
              
              virtualRecords.push({
                  isVirtual: true,
                  cycleLabel: 'Upcoming Cycle',
                  paidDate: this.formatDateDDMMMYYYY(vStart), 
                  amount: m.membershipAmount || 0,
                  paymentMode: 'Pending',
                  paymentStatus: 'UPCOMING',
                  virtualStartDate: vStart.toISOString(), 
                  virtualEndDate: vEnd.toISOString()
              });
          }
      }

      let combinedHistory = [...this.currentMemberPayments, ...virtualRecords];
      combinedHistory.sort((a,b) => new Date(this.parseToISODate(b.paidDate)) - new Date(this.parseToISODate(a.paidDate)));

      if(combinedHistory.length === 0) {
        const empty = '<div class="text-center py-6 text-xs font-bold text-slate-400">No payment history found.</div>';
        tBody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-xs font-bold text-slate-400">No payment history found.</td></tr>';
        if (cardList) cardList.innerHTML = empty;
        return;
      }
      
      let phtml = '';
      let cardsHtml = '';
      const memberPhone = (m && m.phone) || '';
      const memberName = (m && m.fullName) || 'Member';
      const planLabel = this.getName('membership', m && m.membershipId) || 'membership';
      const todayForWa = new Date();
      todayForWa.setHours(0, 0, 0, 0);

      combinedHistory.forEach((p, histIndex) => {
        const pAmt = p.amount ? p.amount.toString().replace(/[^0-9.-]+/g,"") : '';
        const pJson = JSON.stringify(p).replace(/"/g, '&quot;');
        
        if (p.isVirtual) {
            const vStartFmt = this.formatDateDDMMMYYYY(p.virtualStartDate);
            const vEndFmt = this.formatDateDDMMMYYYY(p.virtualEndDate);
            
            const isUpcoming = p.paymentStatus === 'UPCOMING';
            const rowClass = isUpcoming ? 'bg-amber-50/20 border-l-[3px] border-l-amber-400' : 'bg-red-50/30 border-l-[3px] border-l-red-500';
            const labelColor = isUpcoming ? 'text-amber-600' : 'text-red-500';
            const badgeClass = isUpcoming ? 'text-amber-600 bg-amber-50 border-amber-200' : 'text-red-600 bg-red-50 border-red-200';
            const waType = isUpcoming ? 'upcoming' : 'overdue';
            const dueDateObj = new Date(p.virtualStartDate);
            const daysDiff = WhatsAppNotify.daysBetween(dueDateObj, todayForWa);
            const waRow = {
              name: memberName,
              phone: memberPhone,
              plan: planLabel,
              amount: Number(pAmt) || 0,
              date: p.paidDate,
              days: isUpcoming ? Math.max(0, -daysDiff) : Math.max(0, daysDiff),
              period: vStartFmt + ' to ' + vEndFmt
            };
            const waRowJson = JSON.stringify(waRow).replace(/"/g, '&quot;');
            const hasPhone = Boolean(WhatsAppNotify.normalizePhone(memberPhone));
            const waBtn = WhatsAppNotify.renderButton(
              hasPhone,
              `WhatsAppNotify.open('${waType}', ${waRowJson}, event)`
            );
            
            const payNowBtn = `<button onclick="MembersApp.openRecordPayment(${pJson})" class="h-8 px-2.5 text-brand-primary border border-red-200 bg-white hover:bg-brand-primary hover:text-white text-[10px] font-bold rounded shadow-sm inline-flex items-center justify-center transition-colors shrink-0">Pay Now</button>`;
            phtml += `
              <tr class="border-b border-slate-50 last:border-0 hover:bg-slate-50 group transition-colors ${rowClass}">
                <td class="px-4 py-3">
                  <div class="font-bold text-slate-800">${p.paidDate}</div>
                  <div class="text-[9px] ${labelColor} font-bold mt-0.5">${p.cycleLabel}</div>
                  <div class="text-[9px] text-slate-500 mt-0.5">${vStartFmt} to ${vEndFmt}</div>
                </td>
                <td class="px-4 py-3"><div class="font-bold text-slate-800">${AppUtils.formatCurrency(pAmt)}</div><div class="text-[9px] text-slate-500">${this.paymentSplitLabel(p)}</div></td>
                <td class="px-4 py-3"><span class="text-[8px] font-bold px-1.5 py-0.5 rounded border uppercase ${badgeClass}">${p.paymentStatus}</span></td>
                <td class="px-4 py-3 text-right">
                  <div class="inline-flex items-center justify-end gap-1.5">
                    ${waBtn}
                    ${payNowBtn}
                  </div>
                </td>
              </tr>
            `;
            cardsHtml += `
              <div class="px-3 py-3 ${rowClass}">
                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0">
                    <div class="font-bold text-xs text-slate-800">${p.paidDate}</div>
                    <div class="text-[10px] ${labelColor} font-bold mt-0.5">${p.cycleLabel}</div>
                    <div class="text-[10px] text-slate-500 mt-0.5 break-words">${vStartFmt} to ${vEndFmt}</div>
                  </div>
                  <span class="text-[8px] font-bold px-1.5 py-0.5 rounded border uppercase shrink-0 max-w-[46%] text-right whitespace-normal leading-tight ${badgeClass}">${p.paymentStatus}</span>
                </div>
                <div class="mt-2 flex items-end justify-between gap-2">
                  <div class="min-w-0">
                    <div class="font-bold text-sm text-slate-800">${AppUtils.formatCurrency(pAmt)}</div>
                    <div class="text-[10px] text-slate-500 break-words">${this.paymentSplitLabel(p)}</div>
                  </div>
                  <div class="flex items-center gap-1 shrink-0">${waBtn}${payNowBtn}</div>
                </div>
              </div>
            `;
        } else {
            const modeName = this.paymentSplitLabel(p); 
            const pStatusName = this.isPartialPayment(p)
              ? ('Partial · Pending ' + AppUtils.formatCurrency(p.pendingAmount || 0))
              : (this.getName('paymentstatus', p.paymentStatus) || p.paymentStatus || 'Completed');
            const receiptHref = p.receiptUrl
              ? (String(p.receiptUrl).indexOf('http') === 0 ? p.receiptUrl : ('https://drive.google.com/file/d/' + p.receiptUrl + '/view'))
              : '';
            let rcptHtml = receiptHref ? `<a href="${receiptHref}" target="_blank" onclick="event.stopPropagation()" class="text-brand-primary hover:underline ml-1"><span class="material-symbols-rounded text-[12px] align-middle">image</span></a>` : '';
            
           let statColor = 'text-emerald-600 bg-emerald-50 border-emerald-100';
            if (pStatusName.toLowerCase().includes('pending')) statColor = 'text-amber-600 bg-amber-50 border-amber-100';
            if (pStatusName.toLowerCase().includes('fail') || pStatusName.toLowerCase().includes('overdue') || pStatusName.toLowerCase().includes('unpaid')) statColor = 'text-red-600 bg-red-50 border-red-100';
            
            let coverageHtml = '';
            let periodText = '';
            if (p.startDate && p.endDate) {
                const startFmt = this.formatDateDDMMMYYYY(p.startDate);
                const endFmt = this.formatDateDDMMMYYYY(p.endDate);
                coverageHtml = `<div class="text-[9px] text-slate-500 mt-0.5">${startFmt} to ${endFmt}</div>`;
                periodText = startFmt + ' to ' + endFmt;
            } else {
                coverageHtml = `<div class="text-[9px] text-slate-400 italic mt-0.5">No coverage period recorded</div>`;
            }

              const waRow = {
                name: memberName,
                phone: memberPhone,
                plan: planLabel,
                amount: Number(pAmt) || 0,
                date: this.formatDateDDMMMYYYY(p.paidDate),
                period: periodText
              };
              const waRowJson = JSON.stringify(waRow).replace(/"/g, '&quot;');
              waBtn = WhatsAppNotify.renderButton(
                hasPhone,
                `WhatsAppNotify.open('paid', ${waRowJson}, event)`
              );

    renderChart: function() {
      const selectedYear = parseInt(document.getElementById('filter-ltv').value);
      const viewMode = document.getElementById('filter-ltv-mode')?.value || 'monthly';
      const showPercent = (document.getElementById('filter-ltv-split')?.value || 'amount') === 'percent';
      document.getElementById('lbl-year-ltv').innerText = selectedYear;

      const allTimeAmount = this.currentMemberPayments.reduce((sum, p) => {
        if (!this.isPaidPayment(p) && !this.isPartialPayment(p)) return sum;
        return sum + Number(String(p.amount || 0).replace(/[^0-9.-]+/g,""));
      }, 0);
      
      document.getElementById('det-ltv-all').innerText = AppUtils.formatCurrency(allTimeAmount);

      const yearMetrics = this.chartMetrics[selectedYear] || {
        monthly: new Array(12).fill(0),
        quarterly: [0, 0, 0, 0],
        cashMonthly: new Array(12).fill(0),
        upiMonthly: new Array(12).fill(0),
        cashQuarterly: [0, 0, 0, 0],
        upiQuarterly: [0, 0, 0, 0],
        totalEarned: 0
      };
      
      let categories = [];
      let cashData = [];
      let upiData = [];

      const dlOptions = {
        enabled: true,
        formatter: (val) => val ? AppUtils.formatCompactCurrency(val) : '',
        offsetY: -6,
        style: { fontSize: '11px', fontWeight: 600, colors: ['#0f172a'] },
        background: {
          enabled: true,
          backgroundColor: '#ffffff',
          foreColor: '#0f172a',
          borderRadius: 4,
          padding: 3,
          opacity: 0.95,
          borderWidth: 1,
          borderColor: '#e2e8f0'
        }
      };

      const narrow = window.innerWidth < 640;
      if (viewMode === 'quarterly') {
          categories = narrow
            ? ['Q1', 'Q2', 'Q3', 'Q4']
            : ['Q1 Jan–Mar', 'Q2 Apr–Jun', 'Q3 Jul–Sep', 'Q4 Oct–Dec'];
          cashData = yearMetrics.cashQuarterly || [0, 0, 0, 0];
          upiData = yearMetrics.upiQuarterly || [0, 0, 0, 0];
      } else {
          categories = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          cashData = yearMetrics.cashMonthly || new Array(12).fill(0);
          upiData = yearMetrics.upiMonthly || new Array(12).fill(0);
      }
      
      const yearPayments = this.currentMemberPayments.filter(p => {
        if (!this.isPaidPayment(p) && !this.isPartialPayment(p)) return false;
        
        let sd = new Date(this.parseToISODate(p.startDate || p.paidDate));
        let ed = new Date(this.parseToISODate(p.endDate || p.paidDate));
        return (sd.getFullYear() === selectedYear || ed.getFullYear() === selectedYear);
      });

      document.getElementById('det-ltv-year').innerText = AppUtils.formatCurrency(yearMetrics.totalEarned);
      document.getElementById('det-ltv-count').innerText = yearPayments.length;

      const percentLabel = (val, opts) => {
        const series = (opts && opts.w && opts.w.config && opts.w.config.series) || [];
        const idx = opts ? opts.dataPointIndex : 0;
        const total = series.reduce((sum, item) => sum + (Number(item.data && item.data[idx]) || 0), 0);
        const raw = Number(series[opts.seriesIndex] && series[opts.seriesIndex].data[idx]) || 0;
        if (!total || !raw) return '';
        return Math.round((raw / total) * 100) + '%';
      };
      const rotateMonths = narrow && viewMode !== 'quarterly';
      const options = {
        series: [
          { name: 'Cash', data: cashData.map(v => Number(Number(v || 0).toFixed(2))) },
          { name: 'UPI', data: upiData.map(v => Number(Number(v || 0).toFixed(2))) }
        ],
        chart: {
          type: 'bar',
          width: '100%',
          height: '100%',
          toolbar: { show: false },
          stacked: true,
          stackType: showPercent ? '100%' : 'normal',
          parentHeightOffset: 0,
          redrawOnParentResize: true
        },
        plotOptions: { bar: { borderRadius: 2, columnWidth: narrow ? '62%' : '55%', dataLabels: { position: 'center' } } },
        dataLabels: narrow
          ? { enabled: false }
          : (showPercent
            ? { enabled: true, formatter: percentLabel, style: { fontSize: '10px', fontWeight: 600, colors: ['#0f172a'] } }
            : { ...dlOptions, offsetY: 0 }),
        xaxis: { 
            categories: categories,
            labels: {
              rotate: rotateMonths ? -45 : 0,
              rotateAlways: rotateMonths,
              hideOverlappingLabels: true,
              trim: true,
              style: { fontSize: narrow ? '9px' : '11px', colors: '#64748b' }
            },
            axisBorder: { show: false }, axisTicks: { show: false } 
        },
        yaxis: {
          max: showPercent ? 100 : undefined,
          labels: {
            formatter: (val) => showPercent
              ? (Math.round(val) + '%')
              : (narrow && AppUtils.formatCompactCurrency ? AppUtils.formatCompactCurrency(val) : AppUtils.formatCurrency(val)),
            style: { fontSize: narrow ? '9px' : '11px', colors: '#64748b' }
          }
        },
        tooltip: { y: { formatter: (val) => AppUtils.formatCurrency(val) } },
        colors: ['#10b981', '#3b82f6'],
        legend: { position: 'top', horizontalAlign: narrow ? 'left' : 'right', fontSize: narrow ? '10px' : '11px', markers: { radius: 10 } },
        grid: { borderColor: '#f1f5f9', strokeDashArray: 4, padding: { top: narrow ? 4 : 16, right: 8, bottom: rotateMonths ? 8 : 4, left: 4 } }
      };

      const container = document.querySelector("#member-revenue-chart");
      if(container) {
        container.innerHTML = '';
        if(this.chartInstance) this.chartInstance.destroy();
        this.chartInstance = new ApexCharts(container, options);
        this.chartInstance.render();
      }
      this._lastChartWidth = window.innerWidth;
      if (!this._chartResizeBound) {
        this._chartResizeBound = true;
        let resizeTimer;
        window.addEventListener('resize', () => {
          if (window.innerWidth === this._lastChartWidth) return;
          const details = document.getElementById('view-details');
          if (!details || details.classList.contains('translate-x-full')) return;
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => this.renderChart(), 150);
        });
      }
    },

    activeStatusId: function() {
      const statuses = this.dropdowns.status || [];
      const active = statuses.find(opt => String(opt.name || opt.label || opt.id || '').trim().toLowerCase() === 'active');
      return active ? active.id : '';
    },

    paidStatusId: function() {
      const statusOpts = this.dropdowns.paymentstatus || this.dropdowns.status || [];
      const paid = statusOpts.find(opt => {
        const name = String(opt.name || opt.label || '').trim().toLowerCase();
        return name === 'paid' || name === 'completed';
      });
      return paid ? paid.id : '';
    },

    pendingStatusId: function() {
      const statusOpts = this.dropdowns.paymentstatus || this.dropdowns.status || [];
      const pending = statusOpts.find(opt => {
        const name = String(opt.name || opt.label || '').trim().toLowerCase();
        return name === 'pending' || name === 'partial' || name.indexOf('partial') >= 0;
      });
      return pending ? pending.id : '';
    },

    isPartialPayment: function(payment) {
      if (!payment || payment.isVirtual) return false;
      const pending = Number(String(payment.pendingAmount || 0).replace(/[^0-9.-]+/g, ''));
      if (pending > 0.009) return true;
      const paid = Number(String(payment.amount || 0).replace(/[^0-9.-]+/g, ''));
      const expected = Number(String(payment.expectedAmount || 0).replace(/[^0-9.-]+/g, ''));
      const status = String(this.getName('paymentstatus', payment.paymentStatus) || payment.paymentStatus || '').toLowerCase();
      return (status.indexOf('pending') >= 0 || status.indexOf('partial') >= 0) && paid > 0 && expected > paid;
    },

    isNonRecurringPlan: function(planMatch) {
      const planName = planMatch ? `${planMatch.name || ''} ${planMatch.frequency || ''}`.toLowerCase() : '';
      return planName.includes('trial') || planName.includes('adhoc') || planName.includes('ad-hoc');

    saveMember: async function(e) {
      e.preventDefault();
      if (!AppUtils.validateRequiredFields('member-form')) return;

      const phone = document.getElementById('mem-phone').value;
      if (!/^\d{10}$/.test(phone)) {
        document.getElementById('mem-phone').focus();
        return Toast.error('Phone number must contain exactly 10 digits.');
      }

      const planVal = document.getElementById('mem-plan').value;
      const batchVal = document.getElementById('mem-batch').value;
      if (planVal === 'All' || batchVal === 'All') return Toast.error('Please select valid membership details.');

      const btn = document.getElementById('btn-save-member');
      btn.innerHTML = '<span class="material-symbols-rounded animate-spin text-[16px] mr-2">progress_activity</span> Saving...';
      btn.disabled = true;

      const fileInput = document.getElementById('mem-profile-file');
      let base64Image = null;
      let imageName = null;
      
      if (fileInput.files && fileInput.files.length > 0) {
          const file = fileInput.files[0];
          imageName = file.name;
          base64Image = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.readAsDataURL(file);
              reader.onload = () => resolve(reader.result);
              reader.onerror = error => reject(error);
          });
      }

      const dobFmt = this.formatDateDDMMMYYYY(document.getElementById('mem-dob').value);
      const joinFmt = this.formatDateDDMMMYYYY(document.getElementById('mem-join').value);
      const exitFmt = this.formatDateDDMMMYYYY(document.getElementById('mem-exit-date').value); 
      const isNew = !document.getElementById('mem-id').value;

      const payload = {
        memberId: document.getElementById('mem-id').value,
        profileImage: document.getElementById('mem-profile-url').value, 
        base64Image: base64Image,
        imageName: imageName,
        fullName: document.getElementById('mem-name').value,
        phone: phone,
        dob: dobFmt,
        gender: document.getElementById('mem-gender').value,
        email: document.getElementById('mem-email').value,
        status: isNew ? (this.activeStatusId() || document.getElementById('mem-status').value) : document.getElementById('mem-status').value,
        membershipId: planVal,
        batchId: batchVal,
        joinDate: joinFmt,
        exitDate: exitFmt, 
        membershipAmount: Number(document.getElementById('mem-amount').value)
      };
      
      const cashNow = Number(document.getElementById('mem-pay-cash') && document.getElementById('mem-pay-cash').value) || 0;
      const upiNow = Number(document.getElementById('mem-pay-upi') && document.getElementById('mem-pay-upi').value) || 0;
      if (isNew && (cashNow > 0 || upiNow > 0)) {
          const plans = this.dropdowns.membership || [];
          const planMatch = plans.find(p => p.id === planVal);
          const planName = planMatch ? `${planMatch.name || ''} ${planMatch.frequency || ''}`.toUpperCase() : '';
          
          let calcEnd = new Date(this.parseToISODate(joinFmt));
          
          if (exitFmt) {
              calcEnd = new Date(this.parseToISODate(exitFmt));
          } else {
              calcEnd = this.cycleEndFromStart(calcEnd, planName);
          }

          const initialSplit = this.paymentSplitFromFields(
            document.getElementById('mem-pay-cash').value,
            document.getElementById('mem-pay-upi').value
          );
          if (!initialSplit) {
            btn.innerHTML = 'Save Member';
            btn.disabled = false;
            return;
          }
          const expectedFee = Number(payload.membershipAmount) || 0;
          const pendingFee = Math.max(0, Math.round((expectedFee - initialSplit.amount) * 100) / 100);
          payload.initialPayment = {
              amount: initialSplit.amount,
              expectedAmount: expectedFee,
              pendingAmount: pendingFee,
              paidDate: joinFmt,
              startDate: joinFmt,
              endDate: this.formatDateDDMMMYYYY(calcEnd),
              paymentMode: initialSplit.paymentMode,
              cashAmount: initialSplit.cashAmount,
              upiAmount: initialSplit.upiAmount,
              paymentStatus: pendingFee > 0 ? (this.pendingStatusId() || this.paidStatusId()) : this.paidStatusId()
          };
      }

      const reopenMemberId = this.currentActiveMember && this.currentActiveMember.memberId;
      this.closeModal();
      this.showShimmer();
      google.script.run
        .withSuccessHandler((res) => {
          btn.innerHTML = 'Save Member'; btn.disabled = false;
          if(res.success) {
            Toast.success(res.message);
            this.fetchData(() => {
                const freshId = (res.data && res.data.memberId) || payload.memberId || reopenMemberId;
                if (!freshId) return;
                const freshMember = this.allData.find(m => String(m.memberId) === String(freshId));
                if (freshMember && reopenMemberId) this.openDetails(freshMember);
            });
          } else {
            Toast.error(res.error);
            this.fetchData();
          }
        })
        .withFailureHandler((err) => {
          btn.innerHTML = 'Save Member'; btn.disabled = false;
          Toast.error((err && err.message) || 'Could not save the member.');
          this.fetchData();
        })
        .api_saveMember(payload);
    },

      document.getElementById('member-modal').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('member-modal-content').classList.add('translate-y-full', 'md:translate-y-10', 'opacity-0');

    onPlanOrBatchChange: function() {
      const planId = document.getElementById('mem-plan').value;
      const batchId = document.getElementById('mem-batch').value;
      const plans = this.dropdowns.membership || [];
      const batches = this.dropdowns.batch || [];
      const prices = this.dropdowns.price || this.dropdowns.price_options || this.dropdowns.prices || []; 

      const planMatch = plans.find(p => p.id === planId);
      const batchMatch = batches.find(b => b.id === batchId);
      const amountField = document.getElementById('mem-amount');

      const groupName = batchMatch ? (batchMatch.groups || batchMatch.group || batchMatch.name || '') : '';
      const badge = document.getElementById('batch-type-badge');

      if (groupName) {
          badge.innerText = groupName;
          badge.classList.remove('hidden');
          if (groupName.toLowerCase().includes('kid')) {
              badge.className = 'text-[8px] font-bold px-1.5 py-0.5 rounded border bg-amber-50 text-amber-600 border-amber-200 uppercase tracking-wider';
          } else {
              badge.className = 'text-[8px] font-bold px-1.5 py-0.5 rounded border bg-red-50 text-brand-primary border-red-200 uppercase tracking-wider';
          }
      } else {
          badge.classList.add('hidden');
      }

      const planName = String(planMatch && planMatch.name || '');
      const frequency = String(planMatch && planMatch.frequency || '');
      const isTrial = /TRIAL/i.test(`${planName} ${frequency}`);
      const matchingPlanPrices = prices.filter(price =>
        String(price.name || '').trim().toLowerCase() === planName.trim().toLowerCase()
      );
      const price = matchingPlanPrices.find(item =>
        String(item.group || '').trim().toLowerCase() === String(groupName).trim().toLowerCase()
      ) || matchingPlanPrices.find(item => {
        const group = String(item.group || '').trim().toLowerCase().replace(/[\s_-]+/g, '');
        return ['', 'all', 'allgroups', 'allbatches', 'any', '*'].includes(group);
      });
      const rawDailyAmount = price && price.base_price != null && price.base_price !== ''
        ? price.base_price
        : (planMatch && (planMatch.baseamount || planMatch.baseAmount || planMatch.amount));
      let amount = rawDailyAmount == null || rawDailyAmount === ''
        ? ''
        : Number(String(rawDailyAmount).replace(/[^0-9.-]+/g, ''));

      if (isTrial) {
        const startDate = AppUtils.parseToISODate(document.getElementById('mem-join').value);
        const exitDate = AppUtils.parseToISODate(document.getElementById('mem-exit-date').value);
        const startTime = startDate ? Date.parse(`${startDate}T00:00:00Z`) : NaN;
        const exitTime = exitDate ? Date.parse(`${exitDate}T00:00:00Z`) : NaN;
        amount = Number.isFinite(amount) && Number.isFinite(startTime) && Number.isFinite(exitTime) && exitTime >= startTime
          ? amount * (Math.floor((exitTime - startTime) / 86400000) + 1)
          : '';
      }

      amountField.value = amount === '' || !Number.isFinite(amount) ? '' : String(amount);
      this.onStatusChange();
    },

    setExpectedFee: function(amount) {
      const expected = Math.round((Number(amount) || 0) * 100) / 100;
      const hidden = document.getElementById('pay-expected');
      const label = document.getElementById('pay-expected-label');
      if (hidden) hidden.value = String(expected);
      if (label) label.value = expected ? AppUtils.formatCurrency(expected) : '—';
      this.syncPaymentAmount();
    },

    syncPaymentAmount: function() {
      const cash = this.parseMoneyInput(document.getElementById('pay-cash')?.value);
      const upi = this.parseMoneyInput(document.getElementById('pay-upi')?.value);
      const amountEl = document.getElementById('pay-amount');
      const pendingEl = document.getElementById('pay-pending');
      const expected = Number(document.getElementById('pay-expected')?.value) || 0;
      if (cash === null || upi === null) {
        if (amountEl) amountEl.value = '';
        if (pendingEl) {
          pendingEl.textContent = 'Enter numbers only';
          pendingEl.className = 'text-[11px] font-bold text-red-600 text-right';
        }
        return;
      }
      const paid = Math.round((cash + upi) * 100) / 100;
      if (amountEl) amountEl.value = String(paid);
      const pending = Math.max(0, Math.round((expected - paid) * 100) / 100);
      if (pendingEl) {
        if (!expected || pending <= 0) {
          pendingEl.textContent = 'Fully paid';
          pendingEl.className = 'text-[11px] font-bold text-emerald-700 text-right';
        } else {
          pendingEl.textContent = 'Pending ' + AppUtils.formatCurrency(pending);
          pendingEl.className = 'text-[11px] font-bold text-amber-700 text-right';
        }
      }
    },

    openRecordPayment: function(payment = null) {
      const m = this.currentActiveMember;
      if(!m) return;
      const fee = Number(String(m.membershipAmount || 0).replace(/[^0-9.-]+/g, '')) || 0;

      if (payment && payment.isVirtual) {
          document.getElementById('pay-modal-title').innerText = payment.paymentStatus === 'UPCOMING' ? 'Record Payment' : 'Record Payment';
          document.getElementById('pay-id').value = '';
          const rawAmt = Number(String(payment.amount || fee).replace(/[^0-9.-]+/g, '')) || fee;
          this.fillPaymentSplitFields('pay-cash', 'pay-upi', null, 0);
          this.setExpectedFee(rawAmt);
          this.setReceiptPreview('');
          this.setDatePicker('pay-date', new Date());
          this.setDatePicker('pay-start', new Date(payment.virtualStartDate));
          this.setDatePicker('pay-end', new Date(payment.virtualEndDate));
          document.getElementById('pay-header-due').innerText = this.effectiveDueDate ? this.formatDateDDMMMYYYY(this.effectiveDueDate) : 'Auto-calculated after payment';
      } else {
          document.getElementById('pay-modal-title').innerText = payment ? 'Edit Payment' : 'Record Payment';
          document.getElementById('pay-id').value = payment ? payment.paymentId : '';
          const expected = payment && payment.expectedAmount
            ? Number(String(payment.expectedAmount).replace(/[^0-9.-]+/g, ''))
            : fee;
          const recorded = payment ? Number(String(payment.amount || 0).replace(/[^0-9.-]+/g, '')) : 0;
          this.fillPaymentSplitFields('pay-cash', 'pay-upi', payment, recorded);
          this.setExpectedFee(expected || fee);
          this.setReceiptPreview(payment && payment.receiptUrl ? payment.receiptUrl : '');

          const plans = this.dropdowns.membership || [];
          const planMatch = plans.find(p => p.id === m.membershipId);
          const planName = planMatch ? `${planMatch.name || ''} ${planMatch.frequency || ''}`.toUpperCase() : '';
          let calcStartObj, calcEndObj;
          if (payment) {
              calcStartObj = payment.startDate ? new Date(payment.startDate) : new Date();
              calcEndObj = payment.endDate ? new Date(payment.endDate) : new Date();
          } else {
              const payments = this.currentMemberPayments || [];
              const sortedPayments = [...payments].sort((a, b) => new Date(b.endDate || b.paidDate) - new Date(a.endDate || a.paidDate));
              if (sortedPayments.length > 0 && sortedPayments[0].endDate) {
                  calcStartObj = this.nextCycleStart(new Date(sortedPayments[0].endDate), planName);
              } else {
                  calcStartObj = m.joinDate ? new Date(m.joinDate) : new Date();
              }
              calcEndObj = this.cycleEndFromStart(calcStartObj, planName);
          }
          this.setDatePicker('pay-date', payment && payment.paidDate ? payment.paidDate : new Date());
          this.setDatePicker('pay-start', calcStartObj);
          this.setDatePicker('pay-end', calcEndObj);
          document.getElementById('pay-header-due').innerText = this.effectiveDueDate ? this.formatDateDDMMMYYYY(this.effectiveDueDate) : 'Auto-calculated after payment';
      }

      document.getElementById('payment-modal').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('payment-modal-content').classList.remove('translate-y-full', 'md:translate-y-10', 'opacity-0');
    },

    submitPayment: async function(e) {
      e.preventDefault();
      if (!AppUtils.validateRequiredFields('payment-form')) return;

      const btn = document.getElementById('btn-submit-payment');
      btn.innerHTML = '<span class="material-symbols-rounded animate-spin text-[16px] mr-2">progress_activity</span> Processing...';
      btn.disabled = true;

      const split = this.paymentSplitFromFields(
        document.getElementById('pay-cash').value,
        document.getElementById('pay-upi').value
      );
      if (!split || split.amount <= 0) {
        if (split && split.amount <= 0) Toast.error('Enter a cash or UPI amount.');
        btn.innerHTML = 'Save Payment';
        btn.disabled = false;
        return;
      }

      const expected = Number(document.getElementById('pay-expected').value) || 0;
      const pending = Math.max(0, Math.round((expected - split.amount) * 100) / 100);
      const fileInput = document.getElementById('pay-receipt-file');
      let base64Image = null;
      let imageName = null;
      if (fileInput && fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        imageName = file.name;
        try {
          base64Image = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = (error) => reject(error);
          });
        } catch (error) {
          Toast.error('Could not read the receipt image.');
          btn.innerHTML = 'Save Payment';
          btn.disabled = false;
          return;
        }
      }

      const payload = {
        paymentId: document.getElementById('pay-id').value,
        memberId: this.currentActiveMember.memberId,
        amount: split.amount,
        expectedAmount: expected,
        pendingAmount: pending,
        paidDate: this.formatDateDDMMMYYYY(document.getElementById('pay-date').value),
        paymentMode: split.paymentMode,
        cashAmount: split.cashAmount,
        upiAmount: split.upiAmount,
        paymentStatus: pending > 0 ? (this.pendingStatusId() || this.paidStatusId()) : this.paidStatusId(),
        startDate: this.formatDateDDMMMYYYY(document.getElementById('pay-start').value),
        endDate: this.formatDateDDMMMYYYY(document.getElementById('pay-end').value),
        receiptUrl: document.getElementById('pay-receipt').value,
        base64Image: base64Image,
        imageName: imageName
      };

      const reopenMemberId = this.currentActiveMember && this.currentActiveMember.memberId;
      this.closeRecordPayment();
      this.showShimmer();
      google.script.run
        .withSuccessHandler((res) => {
          btn.innerHTML = 'Save Payment'; btn.disabled = false;
          if(res.success) {
            Toast.success(res.message);
            this.fetchData(() => {
                if (!reopenMemberId) return;
                const freshMember = this.allData.find(m => String(m.memberId) === String(reopenMemberId));
                if(freshMember) this.openDetails(freshMember);
            });
          } else {
            Toast.error(res.error);
            this.fetchData();
          }
        })
        .withFailureHandler((err) => {
          btn.innerHTML = 'Save Payment'; btn.disabled = false;
          Toast.error((err && err.message) || 'Could not save the payment.');
          this.fetchData();
        })
        .api_recordPayment(payload);
    },

    closeRecordPayment: function() {
      document.getElementById('payment-modal').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('payment-modal-content').classList.add('translate-y-full', 'md:translate-y-10', 'opacity-0');
      document.getElementById('payment-form').reset();
      AppUtils.clearValidationState('payment-form');
    },
    
    openDeleteModal: function(type, id, name) {
      this.deleteState = { type: type, id: id };
      document.getElementById('delete-title').innerText = type === 'member' ? 'Delete Member?' : 'Delete Payment?';
      document.getElementById('delete-target-name').innerText = name;
      
      document.getElementById('delete-modal').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('delete-modal-content').classList.remove('scale-95', 'opacity-0');
    },

    closeDeleteModal: function() {
      this.deleteState = { type: null, id: null };
      document.getElementById('delete-modal').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('delete-modal-content').classList.add('scale-95', 'opacity-0');
    },

    confirmDelete: function() {
      if(!this.deleteState.id) return;

      const deleteType = this.deleteState.type;
      const deleteId = this.deleteState.id;
      const reopenMemberId = this.currentActiveMember && this.currentActiveMember.memberId;
      this.closeDeleteModal();
      this.showShimmer();
      if(deleteType === 'member') {
        google.script.run
          .withSuccessHandler((res) => {
            if(res.success) {
              Toast.success(res.message);
              this.closeDetails();
              this.fetchData();
            } else {
              Toast.error(res.error);
              this.fetchData();
            }
          })
          .withFailureHandler(() => { this.fetchData(); })
          .api_deleteMember(deleteId);
      } 
      else if (deleteType === 'payment') {
        google.script.run
          .withSuccessHandler((res) => {
            if(res.success) {
              Toast.success(res.message);
              this.fetchData(() => {
                  if (!reopenMemberId) return;
                  const freshMember = this.allData.find(m => String(m.memberId) === String(reopenMemberId));
                  if (freshMember) this.openDetails(freshMember);
              });
            } else {
              Toast.error(res.error);
              this.fetchData();
            }
          })
          .withFailureHandler(() => { this.fetchData(); })
          .api_deletePayment(deleteId);
      }
    }
  };

  MembersApp.init();
</script>
