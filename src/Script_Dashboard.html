<script>
  window.AppCharts = {}; 
  window.AppChartConfigs = {}; 
  window.modalChartInstance = null;
  window.DashboardData = null; 

  var safeSetText = AppUtils.safeSetText;

  window.toggleDataLabels = function(chartKey, btn) {
    const chart = window.AppCharts[chartKey];
    if (!chart) return;
    const next = !chart.w.config.dataLabels.enabled;
    chart.updateOptions({ dataLabels: { enabled: next } });
    if (window.AppChartConfigs[chartKey]) window.AppChartConfigs[chartKey].dataLabels.enabled = next;
    if (btn) {
      btn.classList.toggle('text-brand-primary', next);
      btn.classList.toggle('text-slate-400', !next);
    }
  };

  window.openChartModal = function(title, chartKey) {
    const config = window.AppChartConfigs[chartKey];
    if (!config) return;
    
    const backdrop = document.getElementById('chart-modal-backdrop');
    if (backdrop && backdrop.parentNode !== document.body) {
      document.body.appendChild(backdrop);
    }
    
    safeSetText('chart-modal-title', title);
    const content = document.getElementById('chart-modal-content');
    
    if(backdrop) {
      backdrop.classList.remove('opacity-0', 'pointer-events-none');
      backdrop.classList.add('opacity-100', 'pointer-events-auto');
    }
    if(content) content.classList.remove('scale-95', 'opacity-0');
    
    const modalConfig = { ...config, chart: { ...config.chart, height: '100%', minHeight: 400 } };
    const container = document.getElementById('modal-chart-container');
    if(container) {
      container.innerHTML = ''; 
      window.modalChartInstance = new ApexCharts(container, modalConfig);
      window.modalChartInstance.render();
    }
  };

  window.closeChartModal = function() {
    const backdrop = document.getElementById('chart-modal-backdrop');
    const content = document.getElementById('chart-modal-content');
    if (backdrop) {
      backdrop.classList.remove('opacity-100', 'pointer-events-auto');
      backdrop.classList.add('opacity-0', 'pointer-events-none');
    }
    if (content) content.classList.add('scale-95', 'opacity-0');
    
    if (window.modalChartInstance) {
      setTimeout(() => { window.modalChartInstance.destroy(); window.modalChartInstance = null; }, 300);
    }
  };

  var DashboardTables = {
    data: { overdue: [], upcoming: [] },
    filtered: { overdue: [], upcoming: [] },
    sortState: { overdue: { col: '', asc: true }, upcoming: { col: '', asc: true } },

    init: function(overdueData, upcomingData) {
      this.data.overdue = overdueData || [];
      this.data.upcoming = upcomingData || [];
      this.filtered.overdue = [...this.data.overdue];
      this.filtered.upcoming = [...this.data.upcoming];
      this.render('overdue');
      this.render('upcoming');
    },

    _debouncedSearch: null,
    search: function(type, query) {
      if (!this._debouncedSearch) {
        this._debouncedSearch = AppUtils.debounce((t, q) => {
          const lowerQ = (q || '').toLowerCase();
          this.filtered[t] = this.data[t].filter(row => row.name.toLowerCase().includes(lowerQ));
          if (this.sortState[t].col) {
            this.sort(t, this.sortState[t].col, true);
          } else {
            this.render(t);
          }
        }, 150);
      }
      this._debouncedSearch(type, query);
    },

    sort: function(type, col, keepDirection = false) {
      if (!keepDirection) {
        if (this.sortState[type].col === col) {
          this.sortState[type].asc = !this.sortState[type].asc;
        } else {
          this.sortState[type].col = col;
          this.sortState[type].asc = true;
        }
      }
      const asc = this.sortState[type].asc ? 1 : -1;
      
      this.filtered[type].sort((a, b) => {
        let valA = a[col];
        let valB = b[col];
        if (col === 'amount' || col === 'days') {
          valA = Number(valA); valB = Number(valB);
        } else if (col === 'date') {
          valA = new Date(valA).getTime(); valB = new Date(valB).getTime();
        }
        if (valA < valB) return -1 * asc;
        if (valA > valB) return 1 * asc;
        return 0;
      });

      const headers = ['name', 'plan', 'amount', 'date', 'days'];
      headers.forEach(h => {
         const el = document.getElementById(`sort-${type}-${h}`);
         if (el) el.innerHTML = h === col ? (asc === 1 ? '&#8593;' : '&#8595;') : '';
      });
      this.render(type);
    },

    render: function(type) {
      const tbody = document.getElementById(`table-${type}`);
      if(!tbody) return;
      let html = '';
      this.filtered[type].forEach((row, index) => {
        const names = row.name.split(' ');
        const initials = names.length > 1 ? (names[0][0] + names[1][0]).toUpperCase() : names[0].substring(0,2).toUpperCase();
        
        // Convert row data into a safely escaped JSON string for the click handler
        const rowJson = JSON.stringify(row).replace(/"/g, '&quot;');
        const hasPhone = Boolean(WhatsAppNotify.normalizePhone(row.phone));
        const waBtn = WhatsAppNotify.renderButton(
          hasPhone,
          `WhatsAppNotify.open('${type}', DashboardTables.filtered['${type}'][${index}], event)`
        );

        html += `
          <tr onclick="window.navigateToMemberDetail(${row.memberId ? `'${row.memberId}'` : 'null'}, ${rowJson})" 
              class="border-b border-slate-50 hover:bg-slate-100/80 transition-colors cursor-pointer group">
            <td class="px-3 py-2.5">
              <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-[11px] font-bold shrink-0 shadow-sm group-hover:bg-brand-primary group-hover:text-white transition-colors">${initials}</div>
                <div>
                  <div class="font-bold text-slate-800 text-xs md:text-sm group-hover:text-brand-primary transition-colors">${row.name}</div>
                  <div class="text-[11px] text-slate-500 md:hidden mt-0.5">${row.plan}</div>
                </div>
              </div>
            </td>
            <td class="px-3 py-2.5 text-slate-600 font-medium whitespace-nowrap hidden md:table-cell text-xs">${row.plan}</td>
            <td class="px-3 py-2.5 font-bold text-slate-800 whitespace-nowrap text-xs md:text-sm">${AppUtils.formatCurrency(row.amount)}</td>
            <td class="px-3 py-2.5 text-slate-500 whitespace-nowrap hidden md:table-cell text-xs">${row.date}</td>
            <td class="px-3 py-2.5 text-right whitespace-nowrap">
              <span class="px-2.5 py-1 rounded text-xs font-bold ${row.status}">${row.days}</span>
            </td>
            <td class="px-2 md:px-3 py-2.5 text-center whitespace-nowrap" onclick="event.stopPropagation()">
              ${waBtn}
            </td>
          </tr>
        `;
      });
      if(html === '') {
        const emptyMsg = type === 'overdue' ? 'Awesome! No overdue payments.' : 'No upcoming payments in the next 7 days.';
        html = `<tr><td colspan="6" class="text-center py-6 text-xs text-slate-500 font-medium">${emptyMsg}</td></tr>`;
      }
      tbody.innerHTML = html;
    }
  };

  var DashboardState = {
    months: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
    quarters: ['Q1 (JFM)', 'Q2 (AMJ)', 'Q3 (JAS)', 'Q4 (OND)'],
    selectedPeriods: [],
    isAllSelected: true,
    isShowingMisc: false,
    
    init: function() {
      document.removeEventListener('click', window.closeMultiSelectMenu);
      window.closeMultiSelectMenu = function(e) {
        const menu = document.getElementById('multi-select-menu');
        const btn = document.getElementById('multi-select-label')?.parentElement;
        if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
          menu.classList.add('hidden');
        }
      };
      document.addEventListener('click', window.closeMultiSelectMenu);
      // Don't wait on available-years: seed current year and fetch metrics immediately.
      this.populateYears();
      this.fetchData();
      AppUtils.loadAvailableYears(() => {
        this.populateYears();
      });
    },

    getValidOptions: function() {
      const mode = document.getElementById('filter-mode')?.value || 'Monthly';
      // Allow selecting all options for the chosen year without cutting off at the current month
      return mode === 'Monthly' ? [...this.months] : [...this.quarters];
    },

    onFilterChange: function() {
      const valid = this.getValidOptions();
      if (this.isAllSelected) {
          this.selectedPeriods = [...valid];
      } else {
          this.selectedPeriods = this.selectedPeriods.filter(p => valid.includes(p));
          if (this.selectedPeriods.length === 0 && valid.length > 0) this.selectedPeriods = [valid[0]];
      }
      this.renderCheckboxes();
      this.updateLabel();
      this.fetchData();
    },

    handleModeSwitch: function() {
      const mode = document.getElementById('filter-mode').value;
      this.selectedPeriods = mode === 'Monthly' ? [...this.months] : [...this.quarters];
      this.isAllSelected = true;
      this.onFilterChange();
    },

    toggleMisc: function() {
      this.isShowingMisc = !this.isShowingMisc;
      const btn = document.getElementById('btn-misc-toggle');
      if (btn) btn.innerText = this.isShowingMisc ? 'Back to All' : 'View Misc';
      this.rebuildCharts();
    },

    rebuildCharts: function() {
      if (window.DashboardData) {
         renderDashboard({ success: true, data: window.DashboardData }, true);
      }
    },

    renderCheckboxes: function() {
      const validOptions = this.getValidOptions();
      const menu = document.getElementById('multi-select-menu');
      if(!menu) return;
      const scrollTop = menu.scrollTop;

      const allSelected = this.selectedPeriods.length === validOptions.length && validOptions.length > 0;

      let html = `<label class="flex items-center gap-2 px-3 py-2 hover:bg-slate-50 cursor-pointer rounded text-xs font-bold text-slate-800 border-b border-slate-100 mb-1"><input type="checkbox" onchange="DashboardState.toggleAll(this)" ${allSelected ? 'checked' : ''} class="accent-brand-primary w-3.5 h-3.5 rounded border-slate-300">Select All</label>`;
      validOptions.forEach(opt => {
        const isChecked = this.selectedPeriods.includes(opt) ? 'checked' : '';
        html += `<label class="flex items-center gap-2 px-3 py-2 hover:bg-slate-50 cursor-pointer rounded text-xs text-slate-700"><input type="checkbox" value="${opt}" ${isChecked} onchange="DashboardState.togglePeriod(this)" class="accent-brand-primary w-3.5 h-3.5 rounded border-slate-300">${opt.split(' ')[0]}</label>`;
      });
      menu.innerHTML = html;
      menu.scrollTop = scrollTop;
    },

    toggleAll: function(checkbox) {
      this.isAllSelected = checkbox.checked;
      const valid = this.getValidOptions();
      this.selectedPeriods = this.isAllSelected ? [...valid] : (valid.length > 0 ? [valid[0]] : []);
      this.updateLabel();
      this.renderCheckboxes();
      this.fetchData();
    },

    togglePeriod: function(checkbox) {
      if (checkbox.checked) {
        this.selectedPeriods.push(checkbox.value);
      } else {
        this.selectedPeriods = this.selectedPeriods.filter(v => v !== checkbox.value);
      }
      const valid = this.getValidOptions();
      this.selectedPeriods.sort((a, b) => valid.indexOf(a) - valid.indexOf(b));
      
      if (this.selectedPeriods.length === 0 && valid.length > 0) this.selectedPeriods = [valid[0]];
      this.isAllSelected = (this.selectedPeriods.length === valid.length && valid.length > 0);
      
      this.updateLabel();
      this.renderCheckboxes();
      this.fetchData(); 
    },

    updateLabel: function() {
      const labelEl = document.getElementById('multi-select-label');
      if (!labelEl) return;
      const valid = this.getValidOptions();

      if (this.isAllSelected || (this.selectedPeriods.length === valid.length && valid.length > 0)) {
        labelEl.innerText = "All Selected";
      } else if (this.selectedPeriods.length <= 2) {
        labelEl.innerText = this.selectedPeriods.map(p => p.split(' ')[0]).join(', ');
      } else {
        const firstFew = this.selectedPeriods.slice(0, 2).map(p => p.split(' ')[0]).join(', ');
        labelEl.innerText = `${firstFew} +${this.selectedPeriods.length - 2}`;
      }
    },

    fetchData: function() {
      toggleShimmer(true);
      const year = document.getElementById('filter-year')?.value || new Date().getFullYear().toString();
      const mode = document.getElementById('filter-mode')?.value || 'Monthly';
      const periods = this.selectedPeriods.length > 0 ? this.selectedPeriods : this.getValidOptions();
      google.script.run.withSuccessHandler(renderDashboard).api_getDashboardMetrics(year, mode, periods);
    },

    populateYears: function() {
      AppUtils.populateYearSelect('filter-year');
      
      if (this.selectedPeriods.length === 0) {
        this.selectedPeriods = [...this.getValidOptions()];
        this.updateLabel();
        this.renderCheckboxes();
      }
    }
  };

  function toggleShimmer(isActive) {
    const kpis = ['kpi-active', 'kpi-collected', 'kpi-overdue', 'kpi-bus-exp', 'kpi-staff-cost', 'kpi-total-exp', 'kpi-net', 'kpi-net-forecast', 'pred-sum-actual', 'pred-sum-remaining', 'pred-sum-total'];
    const chartIds = ['chart-batch', 'chart-rev-exp', 'chart-trend', 'chart-expense-breakdown', 'chart-prediction'];
    const tables = ['table-overdue', 'table-upcoming'];
    const seg = document.getElementById('kpi-active-segregation');
    
    if (isActive) {
      kpis.forEach(id => { const el = document.getElementById(id); if (el) { el.innerHTML = ''; el.classList.add('shimmer', 'rounded-md', 'w-16', 'h-5'); } });
      if (seg) seg.innerHTML = '<div class="h-4 w-16 shimmer rounded"></div><div class="h-4 w-14 shimmer rounded"></div><div class="h-4 w-12 shimmer rounded"></div>';
      chartIds.forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = '<div class="absolute inset-0 rounded-xl shimmer opacity-50"></div>'; });
      tables.forEach(id => {
         const el = document.getElementById(id); 
         if (el) {
            let sHtml = '';
            for(let i=0; i<4; i++) sHtml += `<tr><td colspan="5" class="px-3 py-3 border-b border-slate-50"><div class="h-5 w-full shimmer rounded"></div></td></tr>`;
            el.innerHTML = sHtml;
         }
      });
    } else {
      kpis.forEach(id => { const el = document.getElementById(id); if (el) el.classList.remove('shimmer', 'rounded-md', 'w-16', 'h-5'); });
    }
  }

  function renderDashboard(response, isRebuild = false) {
    if (!isRebuild) toggleShimmer(false);

    if (!response || !response.success) {
       let errorMsg = response && response.error ? response.error : "Failed to load dashboard data. Please try again.";
       Toast.error(errorMsg);
       return;
    }

    window.DashboardData = response.data || {};
    const data = response.data || {};
    const incomingCurrencyFormat = data.currencyFormat || response.currencyFormat;
    if (incomingCurrencyFormat) {
      AppUtils.setCurrencyFormat(incomingCurrencyFormat);
    }

    if (!isRebuild) {
      DashboardState.updateLabel(); 
      
      const formatCurrency = (val, style) => AppUtils.formatCurrency(val, style);
      
      const currentHour = new Date().getHours();
      let timeGreet = "Good Morning";
      if (currentHour >= 12 && currentHour < 17) timeGreet = "Good Afternoon";
      else if (currentHour >= 17) timeGreet = "Good Evening";
      
      const displayName = data.userGreetingName || "User";
      safeSetText('user-greeting', `${timeGreet}, ${displayName}!`);

      safeSetText('kpi-active', data.kpis.activeMembers || 0);
      safeSetText('kpi-collected', formatCurrency(data.kpis.membersCollected));
      safeSetText('kpi-overdue', formatCurrency(data.kpis.overdueAmount));
      safeSetText('kpi-bus-exp', formatCurrency(data.kpis.businessExpenses));
      safeSetText('kpi-staff-cost', formatCurrency(data.kpis.staffCost));
      safeSetText('kpi-total-exp', formatCurrency(data.kpis.totalOperatingExpenses));
      safeSetText('kpi-net', formatCurrency(data.kpis.netInHand));

      const remainingNet = data.kpis.remainingForecastNet || 0;
      safeSetText('kpi-net-forecast', formatCurrency(remainingNet));
      const forecastEl = document.getElementById('kpi-net-forecast');
      if (forecastEl) {
        forecastEl.title = `Actual: ${formatCurrency(data.kpis.netInHand)} | Remaining Forecast: ${remainingNet >= 0 ? '+' : ''}${formatCurrency(remainingNet)}`;
      }

      const projNet = data.kpis.projectedNet != null ? data.kpis.projectedNet : data.kpis.netInHand;
      const predActual = (data.charts.prediction && data.charts.prediction.actualNet != null) ? data.charts.prediction.actualNet : data.kpis.netInHand;
      const predRemaining = (data.charts.prediction && data.charts.prediction.remainingForecastNet != null) ? data.charts.prediction.remainingForecastNet : (data.kpis.remainingForecastNet || 0);
      const predTotal = (data.charts.prediction && data.charts.prediction.projectedNet != null) ? data.charts.prediction.projectedNet : projNet;

      safeSetText('pred-sum-actual', formatCurrency(predActual));
      safeSetText('pred-sum-remaining', (predRemaining > 0 ? '+' : '') + formatCurrency(predRemaining));
      safeSetText('pred-sum-total', formatCurrency(predTotal));

      if (data.kpis.activeSegregation) {
         const segContainer = document.getElementById('kpi-active-segregation');
         if (segContainer) {
            let segHtml = '';
            Object.entries(data.kpis.activeSegregation).forEach(([planName, count]) => {
               if (count > 0) {
                  const rawLabel = String(planName || '').trim().toLowerCase();
                  const label = rawLabel ? rawLabel.charAt(0).toUpperCase() + rawLabel.slice(1) : '';
                  segHtml += `
                    <div class="bg-slate-50 border border-slate-100 rounded px-1 py-px sm:px-1.5 sm:py-0.5 flex items-center gap-0.5 sm:gap-1 min-w-0 w-fit max-w-full justify-self-start">
                      <span class="text-[9px] sm:text-[11px] leading-none sm:leading-tight text-slate-600 font-bold">${label}</span>
                      <span class="text-[9px] sm:text-[10px] leading-none font-bold text-slate-800 shrink-0">${count}</span>
                    </div>`;
               }
            });
            if (segHtml === '') segHtml = `<span class="text-xs text-slate-400 font-medium">No active memberships</span>`;
            segContainer.innerHTML = segHtml;
         }
      }

      safeSetText('mini-staff-count', data.kpis.staffCount || 0);
      safeSetText('mini-staff-cost', formatCurrency(data.kpis.staffCost));
      const avgStaffCost = (data.kpis.staffCount && data.kpis.staffCount > 0) ? (data.kpis.staffCost / data.kpis.staffCount) : 0;
      safeSetText('mini-staff-avg', formatCurrency(Math.round(avgStaffCost)));
    }

    Object.keys(window.AppCharts).forEach(key => {
      if (window.AppCharts[key] && typeof window.AppCharts[key].destroy === 'function') {
        window.AppCharts[key].destroy();
      }
    });
    window.AppCharts = {};

    const commonToolbar = { show: true, tools: { download: false, selection: false, zoom: true, zoomin: true, zoomout: true, pan: true, reset: true }, autoSelected: 'zoom' };
    const commonGrid = { borderColor: '#f1f5f9', strokeDashArray: 4, padding: { top: 36, right: 12, left: 10, bottom: 4 } };
    const commonXAxis = { categories: data.charts.categories || [], tickAmount: 'dataPoints', labels: { hideOverlappingLabels: false, rotate: -45, rotateAlways: false, style: { fontSize: '11px', colors: '#64748b' } } };
    // ApexCharts: backgroundColor = pill fill; foreColor = text. style.colors is fallback pill fill if backgroundColor omitted.
    var dlOptions = {
      enabled: true,
      formatter: (val) => val ? AppUtils.formatCompactCurrency(val) : '',
      offsetY: -6,
      style: { fontSize: '11px', fontWeight: 600, colors: ['#0f172a'] },
      background: {
        enabled: true,
        backgroundColor: '#ffffff',
        foreColor: '#0f172a',
        borderRadius: 4,
        padding: 3,
        opacity: 0.95,
        borderWidth: 1,
        borderColor: '#e2e8f0'
      }
    };
    const commonTooltip = {
      theme: 'dark',
      style: { fontSize: '13px', fontFamily: 'inherit' },
      y: { formatter: (val) => AppUtils.formatCurrency(val) }
    };

    // 1. Rev vs Exp
    const elRevExp = document.querySelector("#chart-rev-exp");
    if(elRevExp) {
      window.AppChartConfigs.revExp = {
        series: [ { name: 'Revenue', data: data.charts.revenue }, { name: 'Expenses', data: data.charts.expenses } ],
        chart: { type: 'bar', height: '100%', toolbar: commonToolbar, zoom: { enabled: true } },
        plotOptions: { bar: { horizontal: false, columnWidth: '55%', borderRadius: 2, dataLabels: { position: 'top' } } },
        dataLabels: dlOptions,
        xaxis: commonXAxis,
        yaxis: { labels: { formatter: (val) => AppUtils.formatCurrency(val), style: { fontSize: '11px', colors: '#64748b' } } },
        tooltip: commonTooltip,
        colors: ['#3b82f6', '#f43f5e'],
        legend: { position: 'top', horizontalAlign: 'left', markers: { radius: 12 }, fontSize: '11px' },
        grid: commonGrid
      };
      elRevExp.innerHTML = ''; 
      window.AppCharts.revExp = new ApexCharts(elRevExp, window.AppChartConfigs.revExp);
      window.AppCharts.revExp.render();
    }

    // 2. Batch
    const elBatch = document.querySelector("#chart-batch");
    if(elBatch) {
      const batchValues = data.charts.batchData || [];
      const hasBatch = batchValues.some(function(value) { return Number(value) > 0; });
      if (!hasBatch) {
        elBatch.innerHTML = '<div class="h-full flex flex-col items-center justify-center text-center px-3 py-2">' +
          '<div class="w-12 h-12 rounded-2xl bg-sky-50 text-sky-500 flex items-center justify-center mb-2"><span class="material-symbols-rounded text-[26px]">groups</span></div>' +
          '<p class="text-xs font-bold text-slate-700">No members in this period</p>' +
          '<p class="text-[10px] text-slate-400 font-medium mt-1 max-w-[180px]">Batch counts show up when someone was a member in the months you selected.</p>' +
          '</div>';
      } else {
      window.AppChartConfigs.batch = {
        series: [{ name: 'Members', data: batchValues }],
        chart: { type: 'bar', height: '100%', toolbar: commonToolbar },
        plotOptions: { bar: { distributed: true, columnWidth: '50%', borderRadius: 4, dataLabels: { position: 'top' } } },
        dataLabels: { enabled: true, offsetY: -20, style: { fontSize: '11px', fontWeight: 600, colors: ["#304758"] } },
        xaxis: { categories: data.charts.batchLabels, axisBorder: { show: false }, labels: { rotate: -45, style: { fontSize: '11px', fontWeight: 600 } } },
        yaxis: { labels: { style: { fontSize: '11px', colors: '#64748b' } } },
        colors: ['#3b82f6', '#10b981', '#a855f7', '#fbbf24', '#3b82f6'],
        legend: { show: false },
        grid: commonGrid
      };
      elBatch.innerHTML = ''; 
      window.AppCharts.batch = new ApexCharts(elBatch, window.AppChartConfigs.batch);
      window.AppCharts.batch.render();
      }
    }

    // 3. Net-In-Hand actuals transition into the payment-based forecast.
    const elPred = document.querySelector("#chart-prediction");
    if(elPred) {
      const prediction = data.charts.prediction || {};
      window.AppChartConfigs.pred = {
        series: [
          { name: 'Actual', data: prediction.actual || [] },
          { name: 'Predicted', data: prediction.expected || [] }
        ],
        chart: {
          type: 'area',
          height: '100%',
          toolbar: commonToolbar,
          zoom: { enabled: true },
          animations: { enabled: true, speed: 350, dynamicAnimation: { speed: 300 } }
        },
        stroke: { width: 2, curve: 'smooth', dashArray: [0, 5], connectNulls: true },
        xaxis: { ...commonXAxis, categories: prediction.categories || data.charts.categories || [] },
        yaxis: { labels: { formatter: (val) => AppUtils.formatCurrency(val), style: { fontSize: '11px', colors: '#64748b' } } },
        tooltip: {
          ...commonTooltip,
          y: {
            formatter: (val) => AppUtils.formatCurrency(val),
            title: { formatter: (seriesName) => seriesName }
          }
        },
        colors: ['#3b82f6', '#10b981'],
        markers: {
          size: 4,
          discrete: prediction.transitionIndex >= 0 ? [{
            seriesIndex: 1,
            dataPointIndex: prediction.transitionIndex,
            fillColor: '#3b82f6',
            strokeColor: '#3b82f6',
            size: 5
          }] : []
        },
        legend: { show: false },
        fill: { opacity: [0.12, 0] },
        dataLabels: {
          ...dlOptions,
          offsetY: -10,
          formatter: (val, opts) => opts.seriesIndex === 1 && opts.dataPointIndex === prediction.transitionIndex
            ? ''
            : (val ? AppUtils.formatCompactCurrency(val) : '')
        },
        grid: commonGrid
      };
      elPred.innerHTML = ''; 
      window.AppCharts.pred = new ApexCharts(elPred, window.AppChartConfigs.pred);
      window.AppCharts.pred.render();
    }

    // 4. Collection Trend (connectNulls: true added)
    const elTrend = document.querySelector("#chart-trend");
    if(elTrend) {
      const trendType = document.getElementById('toggle-trend')?.value || 'line';
      window.AppChartConfigs.trend = {
        series: [
          { name: 'Collected', data: data.charts.collectionTrend.collected },
          { name: 'Overdue', data: data.charts.collectionTrend.overdue }
        ],
        chart: { type: trendType, height: '100%', toolbar: commonToolbar, zoom: { enabled: true } },
        dataLabels: { ...dlOptions, offsetY: -10 },
        stroke: { curve: 'smooth', width: trendType === 'bar' ? 0 : 2, connectNulls: true },
        markers: { size: trendType === 'bar' ? 0 : 4 },
        xaxis: commonXAxis,
        yaxis: { labels: { formatter: (val) => AppUtils.formatCurrency(val), style: { fontSize: '11px', colors: '#64748b' } } },
        tooltip: commonTooltip,
        colors: ['#10b981', '#ef4444'],
        legend: { position: 'bottom', horizontalAlign: 'center', offsetY: 5, fontSize: '11px' },
        grid: commonGrid
      };
      elTrend.innerHTML = ''; 
      window.AppCharts.trend = new ApexCharts(elTrend, window.AppChartConfigs.trend);
      window.AppCharts.trend.render();
    }

    // 5. Expense Breakdown
    const elExp = document.querySelector("#chart-expense-breakdown");
    if (elExp) {
      const hasMisc = data.charts.expenseBreakdown.miscSeries && data.charts.expenseBreakdown.miscSeries.length > 0;
      const btnMisc = document.getElementById('btn-misc-toggle');
      if(btnMisc) {
         if (hasMisc) { btnMisc.classList.remove('hidden'); } else { btnMisc.classList.add('hidden'); }
      }
      
      const expSeries = DashboardState.isShowingMisc ? data.charts.expenseBreakdown.miscSeries : data.charts.expenseBreakdown.series;
      const expLabels = DashboardState.isShowingMisc ? data.charts.expenseBreakdown.miscLabels : data.charts.expenseBreakdown.labels;
      const hasExpense = Array.isArray(expSeries) && expSeries.some(function(value) { return Number(value) > 0; });

      if (!hasExpense) {
        elExp.innerHTML = '<div class="h-full flex flex-col items-center justify-center text-center px-3 py-2">' +
          '<div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center mb-2"><span class="material-symbols-rounded text-[26px]">receipt_long</span></div>' +
          '<p class="text-xs font-bold text-slate-700">No expenses in this period</p>' +
          '<p class="text-[10px] text-slate-400 font-medium mt-1 max-w-[180px]">Utilities and staff costs will appear here once they are recorded.</p>' +
          '</div>';
      } else {
      window.AppChartConfigs.exp = {
        series: expSeries,
        labels: expLabels,
        chart: { type: 'donut', height: '100%' },
        colors: ['#3b82f6', '#10b981', '#fbbf24', '#f97316', '#a855f7', '#06b6d4', '#94a3b8', '#e2e8f0', '#6366f1', '#ec4899'],
        plotOptions: { pie: { donut: { size: '70%', labels: { show: true, total: { show: true, label: DashboardState.isShowingMisc ? 'Total Misc' : 'Total', fontSize: '14px', fontWeight: 600, formatter: function(w) { const tot = w.globals.seriesTotals.reduce((a,b)=>a+b,0); return AppUtils.formatCurrency(tot); } } } } } },
        legend: { position: 'bottom', fontSize: '10px', offsetY: 0 },
        dataLabels: { enabled: true, formatter: function (val, opts) { return AppUtils.formatCompactCurrency(opts.w.globals.seriesTotals[opts.seriesIndex]); }, style: { fontSize: '11px', fontWeight: 600 } },
        tooltip: commonTooltip
      };
      elExp.innerHTML = ''; 
      window.AppCharts.exp = new ApexCharts(elExp, window.AppChartConfigs.exp);
      window.AppCharts.exp.render();
      }
    }

    // 6. Staff Cost Trend
    const elStaff = document.querySelector("#chart-staff-trend");
    if(elStaff) {
      const staffType = document.getElementById('toggle-staff')?.value || 'line';
      window.AppChartConfigs.staff = {
        series: [{ name: 'Staff Cost', data: data.charts.staffTrend }],
        chart: { type: staffType, height: '100%', toolbar: commonToolbar, zoom: { enabled: true } },
        stroke: { curve: 'smooth', width: staffType === 'bar' ? 0 : 3, connectNulls: true },
        xaxis: commonXAxis,
        yaxis: { labels: { formatter: (val) => AppUtils.formatCurrency(val), style: { fontSize: '11px', colors: '#64748b' } } },
        tooltip: commonTooltip,
        colors: ['#8b5cf6'], 
        markers: { size: staffType === 'bar' ? 0 : 4 },
        legend: { position: 'bottom', horizontalAlign: 'center', show: true, offsetY: 5, fontSize: '11px' },
        grid: commonGrid,
        dataLabels: { ...dlOptions, offsetY: -10 }
      };
      elStaff.innerHTML = ''; 
      window.AppCharts.staff = new ApexCharts(elStaff, window.AppChartConfigs.staff);
      window.AppCharts.staff.render();
    }

    window.renderDashboardBirthdays(data.birthdays || []);

    if (!isRebuild) {
      DashboardTables.init(data.overdue, data.upcoming);
    }
  }

  window.renderDashboardBirthdays = function(list) {
    const box = document.getElementById('dash-birthdays-list');
    const countEl = document.getElementById('dash-birthdays-count');
    const rows = Array.isArray(list) ? list.slice() : [];
    if (!box) return;
    rows.sort(function(a, b) { return Number(a.days) - Number(b.days); });
    if (countEl) countEl.textContent = String(rows.length);
    if (!rows.length) {
      box.innerHTML = '<div class="h-full min-h-[140px] flex flex-col items-center justify-center text-center px-3 py-4">' +
        '<div class="text-[28px] leading-none tracking-wide" aria-hidden="true">🎂 🎉 🥳</div>' +
        '<p class="text-xs font-bold text-slate-800 mt-2">No birthdays coming up</p>' +
        '<p class="text-[10px] font-semibold text-fuchsia-600 mt-1">This month and the next two are clear.</p>' +
        '<div class="text-lg leading-none mt-2 tracking-widest" aria-hidden="true">🎈 🎊 🎁</div>' +
        '</div>';
      return;
    }
    const monthTones = ['text-rose-600', 'text-amber-600', 'text-fuchsia-600', 'text-violet-600'];
    const groups = [];
    const byMonth = {};
    rows.forEach(function(row) {
      const key = row.month || 'Upcoming';
      if (!byMonth[key]) {
        byMonth[key] = [];
        groups.push(key);
      }
      byMonth[key].push(row);
    });
    box.innerHTML = groups.map(function(month, monthIndex) {
      const monthTone = monthTones[monthIndex % monthTones.length];
      const items = byMonth[month].map(function(row) {
        const days = Number(row.days);
        const isToday = days === 0;
        const when = isToday ? 'Today' : (days === 1 ? 'Tomorrow' : ('in ' + days + ' days'));
        const isStaff = row.kind === 'staff';
        const badge = isStaff
          ? '<span class="text-[9px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded border bg-indigo-50 text-indigo-700 border-indigo-100 shrink-0">Staff</span>'
          : '<span class="text-[9px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded border bg-pink-50 text-pink-700 border-pink-100 shrink-0">Member</span>';
        const id = String(isStaff ? (row.staffId || '') : (row.memberId || '')).replace(/'/g, '');
        const name = String(row.name || '').replace(/'/g, '');
        const rowClass = isToday
          ? 'bg-gradient-to-r from-amber-100 via-rose-50 to-fuchsia-50 ring-1 ring-amber-300 shadow-sm'
          : 'hover:bg-rose-50/80';
        const dayClass = isToday
          ? 'bg-amber-400 text-amber-950'
          : 'bg-rose-100 text-rose-700';
        const whenClass = isToday
          ? 'text-amber-800'
          : 'text-pink-700';
        return '<button type="button" onclick="window.openDashboardBirthday(\'' + (isStaff ? 'staff' : 'member') + '\', \'' + id + '\', \'' + name + '\')" class="w-full flex items-center gap-2 px-1.5 py-1.5 rounded-lg text-left ' + rowClass + '">' +
          '<span class="w-8 h-8 rounded-lg text-sm font-bold flex items-center justify-center shrink-0 ' + dayClass + '">' + (row.day || '') + (isToday ? '<span class="sr-only"> today</span>' : '') + '</span>' +
          '<span class="min-w-0 flex-1"><span class="block font-bold text-xs text-slate-900 truncate">' + (row.name || '') + (isToday ? ' 🎂' : '') + '</span>' +
          '<span class="block text-[10px] font-semibold ' + whenClass + '">' + when + '</span></span>' +
          badge + '</button>';
      }).join('');
      return '<div><p class="text-[10px] font-bold uppercase tracking-wider px-1 mb-1 ' + monthTone + '">' + month + '</p><div class="space-y-0.5">' + items + '</div></div>';
    }).join('');
  };

  window.openDashboardBirthday = function(kind, id, name) {
    if (kind === 'staff') {
      window.location.hash = '#expenses';
      let tries = 0;
      const tryOpen = function() {
        tries += 1;
        if (typeof ExpensesHub !== 'undefined' && ExpensesHub.switchListTab) ExpensesHub.switchListTab('staff');
        if (typeof StaffApp !== 'undefined' && StaffApp.allData && StaffApp.openDetails) {
          const st = StaffApp.allData.find(function(s) { return String(s.staffId) === String(id); });
          if (st) StaffApp.openDetails(st);
          return;
        }
        if (tries < 8) setTimeout(tryOpen, 250);
      };
      setTimeout(tryOpen, 250);
      return;
    }
    window.navigateToMemberDetail(id || null, { name: name || '' });
  };

  // Global router helper to jump from Dashboard tables directly to Member Details
  window.navigateToMemberDetail = function(memberId, rowData) {
    rowData = rowData || {};
    window.location.hash = '#members';
    
    const tryOpen = () => {
      if (typeof MembersApp !== 'undefined') {
        // If members data is loaded, find the full member object
        let targetMember = MembersApp.allData ? MembersApp.allData.find(m => m.memberId === memberId || m.fullName === rowData.name) : null;
        
        if (targetMember) {
          MembersApp.openDetails(targetMember);
        } else {
          // If data isn't loaded yet, fetch it first, then open
          MembersApp.fetchData(() => {
            let freshTarget = MembersApp.allData.find(m => m.memberId === memberId || m.fullName === rowData.name);
            if (freshTarget) {
              MembersApp.openDetails(freshTarget);
            } else {
              // Safe fallback minimal object with empty strings instead of undefined
              MembersApp.openDetails({
                memberId: memberId || rowData.memberId || '',
                fullName: rowData.name || '',
                membershipAmount: rowData.amount || 0,
                dueDate: rowData.date || '',
                membershipId: '',
                batchId: '',
                status: ''
              });
            }
          });
        }
      } else {
        setTimeout(tryOpen, 100);
      }
    };
    
    setTimeout(tryOpen, 200);
  };

  DashboardState.init();
</script>
