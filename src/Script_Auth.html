<script>
  var AuthApp = {
    token: '',
    email: '',
    isAdmin: false,
    clientId: '',
    renderAttempts: 0,
    renderTimer: null,

    init: function() {
      google.script.run
        .withSuccessHandler((response) => {
          if (!response || !response.success) {
            this.showMessage(response && response.error ? response.error : 'Unable to load Google sign-in.');
            return;
          }
          this.clientId = response.data.clientId || '';
          const setupFields = document.getElementById('auth-setup-fields');
          if (setupFields) setupFields.classList.toggle('hidden', Boolean(this.clientId));
          this.renderGoogleButton();
        })
        .withFailureHandler((error) => {
          this.showMessage(error && error.message ? error.message : 'Unable to load Google sign-in.');
        })
        .api_getAuthConfig();
    },

    renderGoogleButton: function() {
      const loading = document.getElementById('auth-loading');
      if (!window.google || !google.accounts || !google.accounts.id) {
        if (this.renderTimer) return;
        this.renderAttempts++;
        if (this.renderAttempts < 40) {
          this.renderTimer = setTimeout(() => {
            this.renderTimer = null;
            this.renderGoogleButton();
          }, 250);
        } else {
          if (loading) loading.textContent = 'Google sign-in could not be loaded. Check your connection and reload.';
        }
        return;
      }

      const input = document.getElementById('auth-client-id');
      const clientId = this.clientId || (input && input.value.trim());
      if (!clientId) {
        if (loading) loading.textContent = 'Enter the OAuth client ID to continue with first-time setup.';
        return;
      }
      if (!/^[0-9]+-[a-z0-9-]+\.apps\.googleusercontent\.com$/i.test(clientId)) {
        if (loading) loading.textContent = 'Enter a valid Google OAuth client ID.';
        return;
      }

      google.accounts.id.initialize({
        client_id: clientId,
        callback: (credentialResponse) => this.authenticate(credentialResponse.credential),
        auto_select: false,
        cancel_on_tap_outside: true
      });
      const button = document.getElementById('google-signin-button');
      if (button) {
        button.innerHTML = '';
        google.accounts.id.renderButton(button, {
          theme: 'outline',
          size: 'large',
          text: 'continue_with',
          shape: 'rectangular',
          width: Math.min(360, Math.max(240, button.clientWidth))
        });
      }
      if (loading) loading.classList.add('hidden');
    },

    authenticate: function(idToken) {
      const input = document.getElementById('auth-client-id');
      const bootstrapClientId = this.clientId || (input && input.value.trim()) || '';
      const loading = document.getElementById('auth-loading');
      if (loading) {
        loading.textContent = 'Verifying your Google account…';
        loading.classList.remove('hidden');
      }

      google.script.run
        .withSuccessHandler((response) => {
          if (!response || !response.success) {
            if (loading) loading.classList.add('hidden');
            this.showMessage(response && response.error ? response.error : 'Google sign-in was not accepted.');
            return;
          }
          this.token = idToken;
          this.email = response.data.email;
          this.isAdmin = Boolean(response.data.isAdmin);
          const gate = document.getElementById('auth-gate');
          if (gate) gate.classList.add('hidden');
          AppState.init();
        })
        .withFailureHandler((error) => {
          if (loading) loading.classList.add('hidden');
          this.showMessage(error && error.message ? error.message : 'Google sign-in could not be verified.');
        })
        .api_authenticate(idToken, bootstrapClientId);
    },

    showMessage: function(message) {
      const element = document.getElementById('auth-message');
      if (!element) return;
      element.textContent = message;
      element.classList.remove('hidden');
    }
  };
</script>
