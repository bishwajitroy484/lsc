<!-- Overlay Backdrop -->
<div id="modal-backdrop" class="fixed inset-0 bg-slate-900/40 opacity-0 transition-opacity duration-300 pointer-events-none" onclick="ModalManager.closeAll()"></div>

<!-- Record Payment Bottom Sheet -->
<div id="modal-record-payment" class="fixed inset-x-0 bottom-0 md:inset-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:w-full md:max-w-md bg-white rounded-t-3xl md:rounded-2xl shadow-2xl transform translate-y-full md:scale-95 md:opacity-0 transition-all duration-300 flex flex-col max-h-[90vh]">
  
  <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center shrink-0">
    <h2 class="font-bold text-lg text-slate-800">Record Payment</h2>
    <button onclick="ModalManager.closeAll()" class="w-8 h-8 flex items-center justify-center bg-slate-100 text-slate-500 rounded-full hover:bg-slate-200 transition-colors">
      <span class="material-symbols-rounded text-lg">close</span>
    </button>
  </div>

  <div class="p-5 overflow-y-auto no-scrollbar">
    <form id="form-payment" onsubmit="ModalManager.submitPayment(event)">
      
      <!-- Member Select (Mocked for now) -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-500 mb-1">Member *</label>
        <select name="memberId" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary">
          <option value="">Select a member...</option>
          <option value="MEM-1">Amit Sharma</option>
        </select>
      </div>

      <!-- Amount & Date -->
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Amount Paid *</label>
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-slate-400 font-medium">₹</span>
            <input type="number" name="amount" required class="w-full pl-7 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-primary" placeholder="2500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Payment Date *</label>
          <input type="date" name="paymentDate" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-primary">
        </div>
      </div>

      <!-- Mode & Status -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Mode *</label>
          <select name="paymentMode" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-primary">
            <option value="MOD-1">UPI</option>
            <option value="MOD-2">Cash</option>
            <option value="MOD-3">Bank Transfer</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Notes</label>
          <input type="text" name="notes" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-primary" placeholder="Optional">
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="btn-submit-payment" class="w-full py-3.5 bg-brand-primary text-white rounded-xl font-bold text-sm shadow-md shadow-brand-primary/30 hover:bg-blue-700 transition flex items-center justify-center gap-2">
        Save Payment
      </button>
    </form>
  </div>
</div>
